<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- 动态内容壳页面：静态导出未预生成的旅行攻略详情由此页面客户端取数渲染（主题规范 3.4） -->
  <title>攻略加载中 | Tech Geek Blog</title>
  <script src="/theme-config.js"></script>
  <script>
    // 与主站一致的主题初始化：localStorage 记忆优先，其次跟随系统（亮色为默认）
    (function () {
      try {
        var t = localStorage.getItem("theme");
        if (t === "dark" || (!t && window.matchMedia("(prefers-color-scheme: dark)").matches)) {
          document.documentElement.classList.add("dark");
        }
      } catch (e) {}
    })();
  </script>
  <style>
    :root {
      --bg: #f8fafc;
      --panel: #ffffff;
      --border: #e2e8f0;
      --text: #0f172a;
      --muted: #64748b;
      --accent: #2563eb;
      --accent-dim: #2563eb1a;
      --error: #dc2626;
    }
    html.dark {
      --bg: #0b0f14;
      --panel: #111827;
      --border: #1e293b;
      --text: #e2e8f0;
      --muted: #94a3b8;
      --accent: #60a5fa;
      --accent-dim: #60a5fa26;
      --error: #f87171;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: ui-sans-serif, system-ui, "PingFang SC", "Microsoft YaHei", sans-serif;
      line-height: 1.75;
    }
    .shell-header {
      border-bottom: 1px solid var(--border);
      padding: 16px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 14px;
    }
    .shell-header a { color: var(--accent); text-decoration: none; }
    .shell-header a:hover { text-decoration: underline; }
    .brand { color: var(--muted); }
    main { max-width: 860px; margin: 0 auto; padding: 40px 24px 80px; }
    .status {
      font-family: ui-monospace, Menlo, monospace;
      color: var(--muted);
      padding: 48px 0;
      text-align: center;
    }
    .status.error { color: var(--error); }
    .status.error a { color: var(--accent); }
    article h1 { font-size: 30px; line-height: 1.3; margin: 16px 0; letter-spacing: -0.02em; }
    .meta {
      font-family: ui-monospace, Menlo, monospace;
      font-size: 13px;
      color: var(--muted);
      margin-bottom: 24px;
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
    }
    .meta .tag { color: var(--accent); }
    .cover { width: 100%; border-radius: 8px; border: 1px solid var(--border); margin-bottom: 24px; }
    .summary {
      border-left: 3px solid var(--accent);
      padding: 8px 16px;
      margin: 20px 0;
      color: var(--muted);
      font-style: italic;
    }
    section h2 { font-size: 22px; margin: 36px 0 16px; letter-spacing: -0.01em; }
    .card {
      border: 1px solid var(--border);
      background: var(--panel);
      border-radius: 8px;
      padding: 16px;
      margin: 14px 0;
    }
    .card h3 { font-size: 17px; margin-bottom: 6px; }
    .card p { font-size: 14px; color: var(--muted); }
    .card .label { color: var(--accent); font-weight: 600; }
    .stars { color: #f59e0b; letter-spacing: 2px; font-size: 13px; }
    .itinerary { list-style: none; border-left: 2px solid var(--accent-dim); margin: 0 0 0 6px; padding-left: 22px; }
    .itinerary li { position: relative; margin: 18px 0; }
    .itinerary li::before {
      content: "";
      position: absolute;
      left: -28px;
      top: 9px;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      border: 2px solid var(--accent);
      background: var(--bg);
    }
    .itinerary .label { color: var(--accent); font-weight: 600; font-size: 15px; }
    .itinerary p { font-size: 14px; color: var(--muted); }
  </style>
</head>
<body>
  <header class="shell-header">
    <span class="brand">tech-geek blog</span>
    <a href="/">← 返回首页</a>
  </header>
  <main>
    <div id="status" class="status">正在加载攻略…</div>
    <article id="travel" hidden>
      <h1 id="t-title"></h1>
      <div class="meta" id="t-meta"></div>
      <img id="t-cover" class="cover" alt="" hidden />
      <blockquote id="t-summary" class="summary" hidden></blockquote>
      <div id="t-sections"></div>
    </article>
  </main>

  <script>
    (function () {
      "use strict";

      // API 地址解析：theme-config.js 注入（可携带 /api/v1 前缀）> 同域相对路径
      var injected = window.__NOVA_CONFIG__ && window.__NOVA_CONFIG__.apiBase;
      var siteRoot = injected
        ? injected.replace(/\/api\/v1\/?$/, "").replace(/\/$/, "")
        : "";

      // 从 URL 解析 id：/travels/{id} | /travels/{id}.html | /travels/{id}/
      function parseId() {
        var m = location.pathname.match(/\/travels\/([^/]+?)\.?html?\/?$/i) ||
                location.pathname.match(/\/travels\/([^/]+?)\/?$/i);
        if (!m) return "";
        try {
          return decodeURIComponent(m[1]);
        } catch (e) {
          return "";
        }
      }

      function el(id) { return document.getElementById(id); }

      function escapeHtml(s) {
        return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;")
          .replace(/>/g, "&gt;").replace(/"/g, "&quot;");
      }

      function pickString(map, keys) {
        for (var i = 0; i < keys.length; i++) {
          var v = map[keys[i]];
          if (typeof v === "string" && v.trim()) return v;
          if (typeof v === "number") return String(v);
        }
        return "";
      }

      function pickNumber(map, keys) {
        for (var i = 0; i < keys.length; i++) {
          var v = map[keys[i]];
          if (typeof v === "number" && isFinite(v)) return v;
        }
        return 0;
      }

      function stars(n) {
        var clamped = Math.max(0, Math.min(5, Math.round(n)));
        return "★★★★★".slice(0, clamped) + "☆☆☆☆☆".slice(0, 5 - clamped);
      }

      function showError(msg) {
        var s = el("status");
        s.className = "status error";
        s.innerHTML = msg + ' · <a href="/">返回首页</a>';
      }

      function render(t) {
        document.title = (t.title || "旅行攻略") + " | Tech Geek Blog";
        el("t-title").textContent = t.title || "无标题";

        var meta = [];
        if (t.destination) meta.push('<span class="tag">' + escapeHtml(t.destination) + (t.region ? " · " + escapeHtml(t.region) : "") + "</span>");
        if (t.days > 0) meta.push("<span>" + escapeHtml(t.days) + " 天</span>");
        if (t.best_month) meta.push("<span>最佳月份 " + escapeHtml(t.best_month) + "</span>");
        if (t.rating > 0) meta.push('<span class="tag">' + stars(t.rating) + " " + escapeHtml(t.rating.toFixed(1)) + "</span>");
        if (t.view_count !== undefined) meta.push("<span>" + escapeHtml(t.view_count) + " 次浏览</span>");
        if (t.like_count !== undefined) meta.push("<span>" + escapeHtml(t.like_count) + " 人点赞</span>");
        el("t-meta").innerHTML = meta.join(" ");

        if (t.cover_image) {
          var c = el("t-cover");
          c.src = t.cover_image;
          c.hidden = false;
        }
        if (t.summary) {
          var sm = el("t-summary");
          sm.textContent = t.summary;
          sm.hidden = false;
        }

        var html = "";
        var attractions = Array.isArray(t.attractions) ? t.attractions : [];
        if (attractions.length) {
          html += "<section><h2>景点推荐</h2>";
          attractions.forEach(function (a) {
            var name = pickString(a, ["name", "title"]);
            var desc = pickString(a, ["description", "content", "intro", "summary", "text"]);
            html += '<div class="card">' +
              (name ? '<h3>' + escapeHtml(name) + "</h3>" : "") +
              (desc ? "<p>" + escapeHtml(desc) + "</p>" : "") +
              "</div>";
          });
          html += "</section>";
        }

        var itinerary = Array.isArray(t.itinerary) ? t.itinerary : [];
        if (itinerary.length) {
          html += "<section><h2>行程安排</h2><ol class='itinerary'>";
          itinerary.forEach(function (item) {
            var label = pickString(item, ["day", "day_label", "dayLabel", "label", "title", "name"]);
            var desc = pickString(item, ["description", "content", "detail", "summary", "text"]);
            html += "<li>" +
              (label ? '<div class="label">' + escapeHtml(label) + "</div>" : "") +
              (desc ? "<p>" + escapeHtml(desc) + "</p>" : "") +
              "</li>";
          });
          html += "</ol></section>";
        }

        var reviews = Array.isArray(t.reviews) ? t.reviews : [];
        if (reviews.length) {
          html += "<section><h2>旅行评价</h2>";
          reviews.forEach(function (r) {
            var author = pickString(r, ["nickname", "user", "author", "name", "reviewer"]);
            var rating = pickNumber(r, ["rating", "score", "star", "stars"]);
            var content = pickString(r, ["content", "comment", "text", "description", "review"]);
            html += '<div class="card">' +
              '<div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;">' +
              '<span style="font-size:14px;font-weight:600;">' + escapeHtml(author || "匿名旅行者") + "</span>" +
              (rating > 0 ? '<span class="stars">' + stars(rating) + "</span>" : "") +
              "</div>" +
              (content ? "<p>" + escapeHtml(content) + "</p>" : "") +
              "</div>";
          });
          html += "</section>";
        }
        el("t-sections").innerHTML = html;

        el("status").hidden = true;
        el("travel").hidden = false;
      }

      var id = parseId();
      if (!id) { showError("无效的攻略地址"); return; }

      // 模块开关预检查：旅行模块关闭时不请求详情（失败按开启处理）
      fetch(siteRoot + "/api/v1/public/module-config", { headers: { Accept: "application/json" } })
        .then(function (r) { return r.json(); })
        .then(function (res) {
          if (res && res.code === 0 && res.data && res.data.travel_enabled === false) {
            showError("旅行模块未开启");
            return null;
          }
          return fetch(siteRoot + "/api/v1/public/travels/" + encodeURIComponent(id), {
            headers: { Accept: "application/json" }
          }).then(function (r) { return r.json(); });
        })
        .then(function (res) {
          if (!res) return;
          if (res && res.code === 0 && res.data) { render(res.data); }
          else { showError((res && res.msg) || "攻略不存在或已下架"); }
        })
        .catch(function () { showError("攻略加载失败，请稍后重试"); });
    })();
  </script>
</body>
</html>
