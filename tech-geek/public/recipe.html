<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- 动态内容壳页面：静态导出未预生成的菜谱详情由此页面客户端取数渲染（主题规范 3.4） -->
  <title>菜谱加载中 | 极客风</title>
  <script src="/theme-config.js"></script>
  <script>
    // 与主站一致的主题初始化：localStorage 记忆优先，其次跟随系统（亮色为默认）
    (function () {
      try {
        var t = localStorage.getItem("theme");
        if (t === "dark" || (!t && window.matchMedia("(prefers-color-scheme: dark)").matches)) {
          document.documentElement.classList.add("dark");
        }
      } catch (e) {}
    })();
  </script>
  <style>
    :root {
      --bg: #f8fafc;
      --panel: #ffffff;
      --border: #e2e8f0;
      --text: #0f172a;
      --muted: #64748b;
      --accent: #2563eb;
      --error: #dc2626;
    }
    html.dark {
      --bg: #0b0f14;
      --panel: #111827;
      --border: #1e293b;
      --text: #e2e8f0;
      --muted: #94a3b8;
      --accent: #60a5fa;
      --error: #f87171;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: ui-sans-serif, system-ui, "PingFang SC", "Microsoft YaHei", sans-serif;
      line-height: 1.75;
    }
    .shell-header {
      border-bottom: 1px solid var(--border);
      padding: 16px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 14px;
    }
    .shell-header a { color: var(--accent); text-decoration: none; }
    .shell-header a:hover { text-decoration: underline; }
    .brand { color: var(--muted); }
    .brand::before { content: "$ "; color: var(--accent); }
    main { max-width: 900px; margin: 0 auto; padding: 40px 24px 80px; }
    .status {
      font-family: ui-monospace, Menlo, monospace;
      color: var(--muted);
      padding: 48px 0;
      text-align: center;
    }
    .status.error { color: var(--error); }
    .status.error a { color: var(--accent); }
    article h1 { font-size: 28px; line-height: 1.3; margin: 20px 0 10px; letter-spacing: -0.02em; }
    .cover { width: 100%; border-radius: 8px; border: 1px solid var(--border); }
    .meta { display: flex; flex-wrap: wrap; gap: 8px; margin: 14px 0 8px; font-size: 13px; }
    .meta span {
      padding: 2px 12px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: var(--panel);
      color: var(--muted);
    }
    .desc { color: var(--muted); margin: 10px 0 8px; }
    .section-title { font-size: 18px; font-weight: 600; margin: 28px 0 12px; }
    .ingredients { list-style: none; display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 8px; }
    .ingredients li {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      padding: 8px 14px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--panel);
      font-size: 14px;
    }
    .ingredients .amount { color: var(--muted); }
    .steps { list-style: none; }
    .steps li { display: flex; gap: 14px; margin-bottom: 24px; }
    .steps .no {
      flex-shrink: 0;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: var(--accent);
      color: #fff;
      font-family: ui-monospace, Menlo, monospace;
      font-size: 14px;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-top: 2px;
    }
    .steps .body { flex: 1; min-width: 0; }
    .steps img { max-width: 100%; border-radius: 8px; border: 1px solid var(--border); margin-top: 10px; }
  </style>
</head>
<body>
  <header class="shell-header">
    <span class="brand">极客风</span>
    <a href="/">← 返回首页</a>
  </header>
  <main>
    <div id="status" class="status">正在加载菜谱…</div>
    <article id="recipe" hidden>
      <img id="r-cover" class="cover" alt="" hidden />
      <h1 id="r-title"></h1>
      <div class="meta" id="r-meta"></div>
      <p class="desc" id="r-desc" hidden></p>
      <div id="r-ingredients" hidden>
        <h2 class="section-title">食材清单</h2>
        <ul class="ingredients" id="r-ingredient-list"></ul>
      </div>
      <div id="r-steps" hidden>
        <h2 class="section-title">制作步骤</h2>
        <ol class="steps" id="r-step-list"></ol>
      </div>
    </article>
  </main>

  <script>
    (function () {
      "use strict";

      // API 地址解析：theme-config.js 注入（可携带 /api/v1 前缀）> 同域相对路径
      var injected = window.__NOVA_CONFIG__ && window.__NOVA_CONFIG__.apiBase;
      var siteRoot = injected
        ? injected.replace(/\/api\/v1\/?$/, "").replace(/\/$/, "")
        : "";

      // 博主信息：左上角品牌与标题后缀使用真实博客标题（失败时回退主题名）
      var blogTitle = "极客风";
      fetch(siteRoot + "/api/v1/public/blogger", { headers: { Accept: "application/json" } })
        .then(function (r) { return r.json(); })
        .then(function (res) {
          if (!(res && res.code === 0 && res.data && res.data.blog_title)) return;
          blogTitle = res.data.blog_title;
          var brand = document.querySelector(".brand");
          if (brand) brand.textContent = blogTitle;
          if (document.title.indexOf(blogTitle) === -1) {
            document.title = document.title.replace(/极客风|Tech Geek Blog/, blogTitle);
          }
        })
        .catch(function () {});

      // 从 URL 解析 id：/recipes/{id} | /recipes/{id}.html | /recipes/{id}/
      function parseId() {
        var m = location.pathname.match(/\/recipes\/([^/]+?)\.?html?\/?$/i) ||
                location.pathname.match(/\/recipes\/([^/]+?)\/?$/i);
        if (!m) return "";
        try {
          return decodeURIComponent(m[1]);
        } catch (e) {
          // 非法百分号编码：按无效地址处理，避免页面卡在加载态
          return "";
        }
      }

      function el(id) { return document.getElementById(id); }

      function escapeHtml(s) {
        return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;")
          .replace(/>/g, "&gt;").replace(/"/g, "&quot;");
      }

      function safeUrl(u) {
        u = String(u || "").trim();
        if (/^(https?:\/\/|\/|#)/i.test(u)) return u;
        return "#";
      }

      // 步骤配图相对路径：拼「站点根 /files/」前缀（与主站 resolveFileUrl 行为一致）
      function fileUrl(path) {
        var value = String(path || "").trim();
        if (!value) return "";
        if (/^(https?:\/\/|\/|data:)/i.test(value)) return value;
        return siteRoot + "/files/" + value.replace(/^\.\//, "");
      }

      // 难度映射：1=简单 2=中等 3=困难
      var DIFFICULTY = { 1: "简单", 2: "中等", 3: "困难" };

      function showError(msg) {
        var s = el("status");
        s.className = "status error";
        s.innerHTML = msg + ' · <a href="/">返回首页</a>';
      }

      function render(r) {
        document.title = (r.title || "菜谱") + " | " + blogTitle;

        if (r.cover) {
          var c = el("r-cover");
          c.src = safeUrl(r.cover);
          c.hidden = false;
        }
        el("r-title").textContent = r.title || "无标题";

        // 难度 / 耗时 / 份量 / 标签
        var meta = [];
        if (DIFFICULTY[r.difficulty]) meta.push('<span>' + escapeHtml(DIFFICULTY[r.difficulty]) + "</span>");
        if (Number(r.minutes) > 0) meta.push("<span>" + escapeHtml(r.minutes) + " 分钟</span>");
        if (Number(r.servings) > 0) meta.push("<span>" + escapeHtml(r.servings) + " 人份</span>");
        String(r.tags || "").split(",").forEach(function (tag) {
          tag = tag.trim();
          if (tag) meta.push("<span>#" + escapeHtml(tag) + "</span>");
        });
        if (meta.length) el("r-meta").innerHTML = meta.join(" ");

        if (r.summary) {
          el("r-desc").textContent = r.summary;
          el("r-desc").hidden = false;
        }

        // 食材清单
        var ingredients = Array.isArray(r.ingredients) ? r.ingredients : [];
        if (ingredients.length) {
          var ingHtml = "";
          ingredients.forEach(function (item) {
            ingHtml += "<li><span>" + escapeHtml(item.name || "") + "</span>" +
              '<span class="amount">' + escapeHtml(item.amount || "") + "</span></li>";
          });
          el("r-ingredient-list").innerHTML = ingHtml;
          el("r-ingredients").hidden = false;
        }

        // 编号步骤（含配图）
        var steps = Array.isArray(r.steps) ? r.steps : [];
        if (steps.length) {
          var stepHtml = "";
          steps.forEach(function (step, i) {
            var img = "";
            var src = fileUrl(step && step.image);
            if (src) {
              img = '<img src="' + escapeHtml(src) + '" alt="步骤 ' + (i + 1) + '" loading="lazy" />';
            }
            stepHtml += "<li><span class=\"no\">" + (i + 1) + "</span>" +
              '<div class="body"><p>' + escapeHtml(step && step.text || "") + "</p>" + img + "</div></li>";
          });
          el("r-step-list").innerHTML = stepHtml;
          el("r-steps").hidden = false;
        }

        el("status").hidden = true;
        el("recipe").hidden = false;
      }

      var id = parseId();
      if (!id) { showError("无效的菜谱地址"); return; }

      // 模块开关预检查：菜谱模块关闭时不请求详情（失败按开启处理）
      fetch(siteRoot + "/api/v1/public/module-config", { headers: { Accept: "application/json" } })
        .then(function (r) { return r.json(); })
        .then(function (res) {
          if (res && res.code === 0 && res.data && res.data.recipe_enabled === false) {
            showError("美食菜谱模块未开启");
            return null;
          }
          return fetch(siteRoot + "/api/v1/public/recipes/" + encodeURIComponent(id), {
            headers: { Accept: "application/json" }
          }).then(function (r) { return r.json(); });
        })
        .then(function (res) {
          if (!res) return;
          if (res && res.code === 0 && res.data) { render(res.data); }
          else { showError((res && res.msg) || "菜谱不存在或已下架"); }
        })
        .catch(function () { showError("菜谱加载失败，请稍后重试"); });
    })();
  </script>
</body>
</html>
