<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- 动态内容壳页面：静态导出未预生成的视频详情由此页面客户端取数渲染（主题规范 3.4） -->
  <title>视频加载中 | Tech Geek Blog</title>
  <script src="/theme-config.js"></script>
  <script>
    // 与主站一致的主题初始化：localStorage 记忆优先，其次跟随系统（亮色为默认）
    (function () {
      try {
        var t = localStorage.getItem("theme");
        if (t === "dark" || (!t && window.matchMedia("(prefers-color-scheme: dark)").matches)) {
          document.documentElement.classList.add("dark");
        }
      } catch (e) {}
    })();
  </script>
  <style>
    :root {
      --bg: #f8fafc;
      --panel: #ffffff;
      --border: #e2e8f0;
      --text: #0f172a;
      --muted: #64748b;
      --accent: #2563eb;
      --error: #dc2626;
    }
    html.dark {
      --bg: #0b0f14;
      --panel: #111827;
      --border: #1e293b;
      --text: #e2e8f0;
      --muted: #94a3b8;
      --accent: #60a5fa;
      --error: #f87171;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: ui-sans-serif, system-ui, "PingFang SC", "Microsoft YaHei", sans-serif;
      line-height: 1.75;
    }
    .shell-header {
      border-bottom: 1px solid var(--border);
      padding: 16px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 14px;
    }
    .shell-header a { color: var(--accent); text-decoration: none; }
    .shell-header a:hover { text-decoration: underline; }
    .brand { color: var(--muted); }
    main { max-width: 900px; margin: 0 auto; padding: 40px 24px 80px; }
    .status {
      font-family: ui-monospace, Menlo, monospace;
      color: var(--muted);
      padding: 48px 0;
      text-align: center;
    }
    .status.error { color: var(--error); }
    .status.error a { color: var(--accent); }
    article h1 { font-size: 28px; line-height: 1.3; margin: 20px 0 10px; letter-spacing: -0.02em; }
    .cover { width: 100%; border-radius: 8px; border: 1px solid var(--border); }
    .desc { color: var(--muted); margin: 14px 0 8px; }
    .section-title { font-size: 18px; font-weight: 600; margin: 28px 0 12px; }
    .links { display: flex; flex-wrap: wrap; gap: 12px; }
    .links a {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 10px 18px;
      border: 1px solid var(--border);
      background: var(--panel);
      border-radius: 8px;
      color: var(--text);
      text-decoration: none;
      font-size: 14px;
      font-weight: 500;
      transition: border-color 0.2s, color 0.2s;
    }
    .links a:hover { border-color: var(--accent); color: var(--accent); }
    .links a svg { width: 14px; height: 14px; }
  </style>
</head>
<body>
  <header class="shell-header">
    <span class="brand">tech-geek blog</span>
    <a href="/">← 返回首页</a>
  </header>
  <main>
    <div id="status" class="status">正在加载视频…</div>
    <article id="video" hidden>
      <img id="v-cover" class="cover" alt="" hidden />
      <h1 id="v-title"></h1>
      <p class="desc" id="v-desc" hidden></p>
      <div id="v-platforms" hidden>
        <h2 class="section-title">观看平台</h2>
        <div class="links" id="v-links"></div>
      </div>
    </article>
  </main>

  <script>
    (function () {
      "use strict";

      // API 地址解析：theme-config.js 注入（可携带 /api/v1 前缀）> 同域相对路径
      var injected = window.__NOVA_CONFIG__ && window.__NOVA_CONFIG__.apiBase;
      var siteRoot = injected
        ? injected.replace(/\/api\/v1\/?$/, "").replace(/\/$/, "")
        : "";

      // 从 URL 解析 id：/videos/{id} | /videos/{id}.html | /videos/{id}/
      function parseId() {
        var m = location.pathname.match(/\/videos\/([^/]+?)\.?html?\/?$/i) ||
                location.pathname.match(/\/videos\/([^/]+?)\/?$/i);
        if (!m) return "";
        try {
          return decodeURIComponent(m[1]);
        } catch (e) {
          return "";
        }
      }

      function el(id) { return document.getElementById(id); }

      function escapeHtml(s) {
        return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;")
          .replace(/>/g, "&gt;").replace(/"/g, "&quot;");
      }

      function safeUrl(u) {
        u = String(u || "").trim();
        if (/^(https?:\/\/|\/|#)/i.test(u)) return u;
        return "#";
      }

      function showError(msg) {
        var s = el("status");
        s.className = "status error";
        s.innerHTML = msg + ' · <a href="/">返回首页</a>';
      }

      function render(v) {
        document.title = (v.title || "视频") + " | Tech Geek Blog";

        if (v.cover_url) {
          var c = el("v-cover");
          c.src = safeUrl(v.cover_url);
          c.hidden = false;
        }
        el("v-title").textContent = v.title || "无标题";

        if (v.description) {
          var d = el("v-desc");
          d.textContent = v.description;
          d.hidden = false;
        }

        var platforms = Array.isArray(v.platforms) ? v.platforms : [];
        if (platforms.length) {
          var html = "";
          platforms.forEach(function (p) {
            html += '<a href="' + escapeHtml(safeUrl(p.url)) + '" target="_blank" rel="noopener">' +
              '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 3h6v6"/><path d="M10 14 21 3"/><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/></svg>' +
              escapeHtml(p.platform || "观看链接") +
              "</a>";
          });
          el("v-links").innerHTML = html;
          el("v-platforms").hidden = false;
        }

        el("status").hidden = true;
        el("video").hidden = false;
      }

      var id = parseId();
      if (!id) { showError("无效的视频地址"); return; }

      // 模块开关预检查：视频模块关闭时不请求详情（失败按开启处理）
      fetch(siteRoot + "/api/v1/public/module-config", { headers: { Accept: "application/json" } })
        .then(function (r) { return r.json(); })
        .then(function (res) {
          if (res && res.code === 0 && res.data && res.data.video_enabled === false) {
            showError("视频模块未开启");
            return null;
          }
          return fetch(siteRoot + "/api/v1/public/videos/" + encodeURIComponent(id), {
            headers: { Accept: "application/json" }
          }).then(function (r) { return r.json(); });
        })
        .then(function (res) {
          if (!res) return;
          if (res && res.code === 0 && res.data) { render(res.data); }
          else { showError((res && res.msg) || "视频不存在或已下架"); }
        })
        .catch(function () { showError("视频加载失败，请稍后重试"); });
    })();
  </script>
</body>
</html>
