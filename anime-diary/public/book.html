<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- 动态内容壳页面：静态导出未预生成的书籍详情由此页面客户端取数渲染（主题规范 3.4） -->
  <title>书籍加载中</title>
  <script src="/theme-config.js"></script>
  <style>
    :root {
      --bg: #fdfcff;
      --panel: #ffffff;
      --border: rgba(60, 53, 84, 0.12);
      --text: #3c3554;
      --muted: #8f89a8;
      --accent: #f078a1;
      --accent-deep: #e75c8d;
      --night: #2f2847;
      --danger: #e05656;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    [hidden] { display: none !important; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      line-height: 1.8;
    }
    .kuaile { font-family: "ZCOOL KuaiLe", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif; }
    .shell-header {
      background: var(--night);
      padding: 16px 28px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .brand {
      color: #fff;
      font-size: 18px;
      letter-spacing: 0.06em;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .brand .heart { color: var(--accent); }
    .shell-header a { color: rgba(255,255,255,0.75); text-decoration: none; font-size: 13px; }
    .shell-header a:hover { color: var(--accent); }
    main { max-width: 760px; margin: 0 auto; padding: 40px 24px 96px; }
    .status {
      color: var(--muted);
      padding: 64px 0;
      text-align: center;
    }
    .status.error { color: var(--danger); }
    .status.error a { color: var(--accent-deep); }
    h1 {
      font-size: 28px;
      line-height: 1.4;
      margin: 0 0 10px;
    }
    .book-head { display: flex; gap: 32px; align-items: flex-start; }
    @media (max-width: 640px) { .book-head { flex-direction: column; } }
    .book-cover {
      flex: none; width: 176px;
    }
    @media (min-width: 641px) { .book-cover { width: 208px; } }
    .book-cover img {
      width: 100%; height: auto; border-radius: 14px;
      box-shadow: 0 6px 24px rgba(60, 53, 84, 0.08);
      display: block;
    }
    .cover-placeholder {
      aspect-ratio: 2/3; width: 100%;
      display: flex; align-items: center; justify-content: center;
      background: #f6f2fb; border-radius: 14px;
      color: var(--muted); font-size: 13px;
    }
    .book-info { flex: 1; min-width: 0; }
    .badge {
      display: inline-block;
      border-radius: 999px;
      padding: 2px 12px;
      font-size: 12px;
      font-weight: 500;
      background: var(--accent);
      color: #fff;
      margin-bottom: 12px;
    }
    .author { color: var(--muted); margin: 0 0 10px; }
    .stars { color: var(--muted); font-size: 15px; margin-bottom: 10px; }
    .stars .star { color: var(--accent); }
    .stars .star.off { color: #d9d4e8; }
    .dates { color: var(--muted); font-size: 13px; }
    .dates p { margin: 2px 0; }
    h2.section {
      font-size: 22px;
      margin: 44px 0 18px;
      padding-top: 32px;
      border-top: 1px solid var(--border);
    }
    /* 书评（Markdown）正文样式，与站点 .prose-content 对齐 */
    .md { font-size: 15px; }
    .md h1, .md h2, .md h3, .md h4, .md h5, .md h6 {
      color: var(--text); font-family: "ZCOOL KuaiLe", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
      font-weight: 400; margin: 1.8rem 0 1rem; line-height: 1.4;
    }
    .md h1 { font-size: 1.5rem; } .md h2 { font-size: 1.3rem; } .md h3 { font-size: 1.15rem; }
    .md p { margin-bottom: 1.1rem; }
    .md a { color: var(--accent-deep); text-decoration: underline; text-underline-offset: 2px; }
    .md ul, .md ol { margin: 0 0 1.1rem; padding-left: 1.5rem; }
    .md ul { list-style: disc; } .md ol { list-style: decimal; }
    .md li { margin-bottom: .4rem; }
    .md blockquote {
      border-left: 3px solid var(--accent); margin: 1.2rem 0;
      padding: .4rem 0 .4rem 1.1rem; color: var(--muted); font-style: italic;
    }
    .md code { background: rgba(155,140,242,0.1); border-radius: 4px; font-size: .9em; padding: .15rem .4rem; }
    .md pre { background: var(--night); border-radius: 10px; margin: 0 0 1.1rem; overflow-x: auto; padding: 1rem 1.2rem; }
    .md pre code { background: none; padding: 0; color: #f3effc; }
    .md img { border-radius: 8px; height: auto; margin: 1rem 0; max-width: 100%; }
    .md hr { border: none; border-top: 1px solid var(--border); margin: 1.8rem 0; }
    .md table { border-collapse: collapse; margin-bottom: 1.1rem; width: 100%; }
    .md th, .md td { border: 1px solid var(--border); padding: .5rem .75rem; text-align: left; }
    .md th { background: var(--panel); font-weight: 600; }
    .no-review { color: var(--muted); font-size: 14px; }
    .shell-footer {
      border-top: 1px solid var(--border);
      text-align: center;
      color: var(--muted);
      font-size: 12px;
      padding: 20px;
    }
  </style>
</head>
<body>
  <header class="shell-header">
    <span class="brand kuaile"><span id="brand-text"></span><span class="heart">♥</span></span>
    <a href="/books">← 返回书架</a>
  </header>
  <main>
    <div id="status" class="status">正在加载书籍…</div>
    <article id="book" hidden>
      <div class="book-head">
        <div class="book-cover">
          <img id="b-cover" alt="" hidden />
          <div id="b-cover-placeholder" class="cover-placeholder" hidden>暂无封面</div>
        </div>
        <div class="book-info">
          <span id="b-status" class="badge" hidden></span>
          <h1 id="b-title" class="kuaile"></h1>
          <p id="b-author" class="author" hidden></p>
          <div id="b-stars" class="stars" hidden></div>
          <div id="b-dates" class="dates" hidden></div>
        </div>
      </div>
      <section id="sec-review" hidden>
        <h2 class="section kuaile">书评</h2>
        <div id="b-review" class="md"></div>
      </section>
      <p id="b-no-review" class="no-review" hidden>暂无书评</p>
    </article>
  </main>
  <footer class="shell-footer">二次元，让生活更有趣</footer>

  <script>
    (function () {
      "use strict";

      // API 地址解析：theme-config.js 注入（可携带 /api/v1 前缀）> 同域相对路径
      var injected = window.__NOVA_CONFIG__ && window.__NOVA_CONFIG__.apiBase;
      var siteRoot = injected
        ? injected.replace(/\/api\/v1\/?$/, "").replace(/\/$/, "")
        : "";
      var apiBase = siteRoot + "/api/v1";

      // 获取博主资料并更新品牌文字
      var blogTitle = "";
      fetch(apiBase + "/public/blogger", { headers: { Accept: "application/json" } })
        .then(function (r) { return r.json(); })
        .then(function (res) {
          if (res && res.code === 0 && res.data) {
            blogTitle = res.data.blog_title || "";
            var brand = document.getElementById("brand-text");
            if (brand) brand.textContent = blogTitle;
          }
        })
        .catch(function () { /* 静默失败 */ });

      // 从 URL 解析 id：/books/{id} | /books/{id}.html | /books/{id}/
      function parseId() {
        var m = location.pathname.match(/\/books\/([^/]+?)\.?html?\/?$/i) ||
                location.pathname.match(/\/books\/([^/]+?)\/?$/i);
        if (!m) return "";
        try {
          return decodeURIComponent(m[1]);
        } catch (e) {
          return "";
        }
      }

      function el(id) { return document.getElementById(id); }

      function escapeHtml(s) {
        return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;")
          .replace(/>/g, "&gt;").replace(/"/g, "&quot;");
      }

      // 链接/图片 URL 仅放行 http(s)://、//、/、#
      function safeUrl(u) {
        u = String(u || "").trim();
        if (/^(https?:\/\/|\/\/|\/|#)/i.test(u)) return u;
        return "#";
      }

      // 相对路径文件 → API 站点根 + /files/ + 路径
      function fileUrl(path) {
        var raw = String(path || "").trim();
        if (!raw) return "";
        if (/^(https?:\/\/|\/\/|\/|#)/i.test(raw)) return raw;
        return siteRoot + "/files/" + raw.replace(/^\/+/, "");
      }

      var STATUS_LABELS = { want: "想读", reading: "在读", done: "读完" };

      function formatDate(s) {
        if (!s) return "";
        var d = new Date(s);
        if (isNaN(d.getTime())) return "";
        return d.getFullYear() + " 年 " + (d.getMonth() + 1) + " 月 " + d.getDate() + " 日";
      }

      // ===== 极简 Markdown 渲染：先整体 HTML 转义再替换标记（防 XSS）=====
      function inlineMd(s) {
        s = s.replace(/`([^`]+)`/g, "<code>$1</code>");
        s = s.replace(/!\[([^\]]*)\]\(([^)\s]+)[^)]*\)/g, function (m, alt, src) {
          var u = safeUrl(src);
          return u === "#" ? "" : '<img src="' + u + '" alt="' + alt + '" loading="lazy" />';
        });
        s = s.replace(/\[([^\]]*)\]\(([^)\s]+)[^)]*\)/g, function (m, t, href) {
          var u = safeUrl(href);
          if (u === "#") return t;
          return '<a href="' + u + '" target="_blank" rel="noopener noreferrer">' + t + "</a>";
        });
        s = s.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
        s = s.replace(/(^|[^*])\*([^*\s][^*]*)\*/g, "$1<em>$2</em>");
        return s;
      }

      function renderMarkdown(src) {
        var lines = String(src || "").replace(/\r\n/g, "\n").split("\n");
        var html = "";
        var para = [];
        var listType = null;
        var inCode = false;

        function flushPara() {
          if (para.length) { html += "<p>" + para.map(inlineMd).join("<br>") + "</p>"; para = []; }
        }
        function closeList() {
          if (listType) { html += "</" + listType + ">"; listType = null; }
        }

        for (var i = 0; i < lines.length; i++) {
          var line = lines[i];
          if (/^```/.test(line)) {
            if (inCode) { html += "</code></pre>"; inCode = false; }
            else { flushPara(); closeList(); html += "<pre><code>"; inCode = true; }
            continue;
          }
          if (inCode) { html += escapeHtml(line) + "\n"; continue; }

          if (!line.trim()) { flushPara(); closeList(); continue; }

          var hm = line.match(/^(#{1,6})\s+(.*)$/);
          if (hm) {
            flushPara(); closeList();
            var level = hm[1].length;
            html += "<h" + level + ">" + inlineMd(escapeHtml(hm[2])) + "</h" + level + ">";
            continue;
          }
          if (/^(-{3,}|\*{3,})$/.test(line.trim())) { flushPara(); closeList(); html += "<hr>"; continue; }
          if (/^&gt;\s?/.test(line) || /^>\s?/.test(line)) {
            flushPara(); closeList();
            html += "<blockquote>" + inlineMd(escapeHtml(line.replace(/^&gt;\s?|^>\s?/, ""))) + "</blockquote>";
            continue;
          }
          var ul = line.match(/^\s*[-*+]\s+(.*)$/);
          if (ul) {
            flushPara();
            if (listType !== "ul") { closeList(); html += "<ul>"; listType = "ul"; }
            html += "<li>" + inlineMd(escapeHtml(ul[1])) + "</li>";
            continue;
          }
          var ol = line.match(/^\s*\d+[.)]\s+(.*)$/);
          if (ol) {
            flushPara();
            if (listType !== "ol") { closeList(); html += "<ol>"; listType = "ol"; }
            html += "<li>" + inlineMd(escapeHtml(ol[1])) + "</li>";
            continue;
          }
          flushPara();
          para.push(line);
        }
        flushPara();
        closeList();
        if (inCode) html += "</code></pre>";
        return html;
      }

      function showError(msg) {
        var s = el("status");
        s.className = "status error";
        s.innerHTML = escapeHtml(msg) + ' · <a href="/books">返回书架</a>';
      }

      function render(p) {
        var title = p.title || "书籍";
        document.title = blogTitle ? title + " | " + blogTitle : title;
        el("b-title").textContent = title;

        var coverUrl = fileUrl(p.cover);
        if (coverUrl && safeUrl(coverUrl) !== "#") {
          el("b-cover").src = coverUrl;
          el("b-cover").hidden = false;
        } else {
          el("b-cover-placeholder").hidden = false;
        }

        var statusLabel = STATUS_LABELS[p.reading_status];
        if (statusLabel) {
          el("b-status").textContent = statusLabel;
          el("b-status").hidden = false;
        }

        if (p.author) {
          el("b-author").textContent = p.author;
          el("b-author").hidden = false;
        }

        if (p.rating > 0) {
          var filled = Math.max(0, Math.min(5, Math.round(p.rating)));
          var starsHtml = "";
          for (var i = 0; i < 5; i++) {
            starsHtml += '<span class="star' + (i < filled ? "" : " off") + '">★</span>';
          }
          starsHtml += " " + p.rating + " / 5";
          el("b-stars").innerHTML = starsHtml;
          el("b-stars").hidden = false;
        }

        var startedAt = formatDate(p.started_at);
        var finishedAt = formatDate(p.finished_at);
        if (startedAt || finishedAt) {
          var datesHtml = "";
          if (startedAt) datesHtml += "<p>开始阅读：" + escapeHtml(startedAt) + "</p>";
          if (finishedAt) datesHtml += "<p>读完于：" + escapeHtml(finishedAt) + "</p>";
          el("b-dates").innerHTML = datesHtml;
          el("b-dates").hidden = false;
        }

        if (p.review && String(p.review).trim()) {
          el("sec-review").hidden = false;
          el("b-review").innerHTML = renderMarkdown(p.review);
        } else if (startedAt || finishedAt || statusLabel) {
          el("b-no-review").hidden = false;
        }

        el("status").hidden = true;
        el("book").hidden = false;
      }

      var id = parseId();
      if (!id) { showError("无效的书籍地址"); return; }

      fetch(apiBase + "/public/books/" + encodeURIComponent(id), {
        headers: { Accept: "application/json" }
      })
        .then(function (r) { return r.json(); })
        .then(function (res) {
          if (res && res.code === 0 && res.data) { render(res.data); }
          else { showError((res && res.msg) || "书籍不存在或已下架"); }
        })
        .catch(function () { showError("书籍加载失败，请稍后重试"); });
    })();
  </script>
</body>
</html>
