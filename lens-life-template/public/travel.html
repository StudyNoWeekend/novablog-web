<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- 动态内容壳页面：静态导出未预生成的旅行攻略由此页面客户端取数渲染（主题规范 3.4） -->
  <title>攻略加载中</title>
  <script src="/theme-config.js"></script>
  <style>
    :root {
      --bg: #131311;
      --panel: #1b1a17;
      --border: #2c2a25;
      --text: #ece7dd;
      --muted: #a29a8b;
      --accent: #c9a86a;
      --danger: #e07a6a;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    /* 带 display 样式的元素（如 .reply-banner）被 hidden 时仍需隐藏 */
    [hidden] { display: none !important; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: ui-sans-serif, system-ui, "PingFang SC", "Microsoft YaHei", sans-serif;
      line-height: 1.8;
    }
    .serif { font-family: Georgia, "Songti SC", "Noto Serif SC", serif; }
    .shell-header {
      border-bottom: 1px solid var(--border);
      padding: 18px 28px;
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      letter-spacing: 0.14em;
      font-size: 13px;
    }
    .brand { color: var(--text); }
    .brand em { color: var(--accent); font-style: normal; }
    .shell-header a { color: var(--muted); text-decoration: none; }
    .shell-header a:hover { color: var(--accent); }
    main { max-width: 860px; margin: 0 auto; padding: 40px 24px 96px; }
    .status {
      color: var(--muted);
      padding: 64px 0;
      text-align: center;
      letter-spacing: 0.05em;
    }
    .status.error { color: var(--danger); }
    .status.error a { color: var(--accent); }
    .hero { position: relative; border-radius: 8px; overflow: hidden; margin-bottom: 32px; }
    .hero img { width: 100%; aspect-ratio: 21/9; object-fit: cover; display: block; }
    .hero .ph { width: 100%; aspect-ratio: 21/9; background: var(--panel); }
    .hero .overlay {
      position: absolute; inset: 0;
      background: linear-gradient(to top, rgba(0,0,0,.85), rgba(0,0,0,.25) 55%, transparent);
      display: flex; flex-direction: column; justify-content: flex-end;
      padding: 24px;
    }
    .hero .dest { color: var(--accent); font-size: 12px; letter-spacing: 0.2em; text-transform: uppercase; margin-bottom: 6px; }
    .hero h1 { color: #fff; font-size: 30px; line-height: 1.3; }
    .hero .facts { color: rgba(255,255,255,.82); font-size: 13px; margin-top: 10px; display: flex; flex-wrap: wrap; gap: 14px; }
    .stats { display: flex; flex-wrap: wrap; gap: 14px; color: var(--muted); font-size: 14px; margin-bottom: 28px; }
    blockquote.summary {
      border-left: 2px solid var(--accent);
      padding: 8px 20px;
      margin: 0 0 40px;
      color: var(--muted);
      font-style: italic;
    }
    h2.section { font-size: 24px; margin: 44px 0 18px; }
    .attraction { display: flex; gap: 16px; background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 16px; margin-bottom: 16px; }
    .attraction img { width: 176px; aspect-ratio: 4/3; object-fit: cover; border-radius: 4px; flex-shrink: 0; }
    .attraction h3 { font-size: 17px; margin-bottom: 6px; }
    .attraction p { font-size: 14px; color: var(--muted); }
    .itinerary { list-style: none; border-left: 2px solid rgba(201,168,106,.25); padding-left: 22px; }
    .itinerary li { position: relative; margin-bottom: 22px; }
    .itinerary li::before {
      content: ""; position: absolute; left: -29px; top: 8px;
      width: 12px; height: 12px; border-radius: 50%;
      border: 2px solid var(--accent); background: var(--bg);
    }
    .itinerary h3 { font-size: 15px; color: var(--accent); margin-bottom: 4px; }
    .itinerary p { font-size: 14px; color: var(--text); }
    .review { background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 16px 18px; margin-bottom: 12px; }
    .review .row { display: flex; justify-content: space-between; align-items: center; gap: 12px; font-size: 14px; }
    .review .stars { color: var(--accent); letter-spacing: 2px; }
    .review p { font-size: 14px; margin-top: 8px; color: var(--text); }
    .c-count-badge {
      background: rgba(201,168,106,.15);
      color: var(--accent);
      font-family: ui-sans-serif, system-ui, sans-serif;
      font-size: 12px;
      font-weight: 600;
      border-radius: 999px;
      padding: 2px 9px;
      vertical-align: 3px;
    }
    .comments-form {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 18px;
      margin-bottom: 28px;
    }
    .comments-form .reply-banner {
      display: flex; align-items: center; justify-content: space-between; gap: 12px;
      border: 1px solid rgba(201,168,106,.3);
      background: rgba(201,168,106,.08);
      border-radius: 4px;
      padding: 6px 12px;
      font-size: 13px;
      color: var(--muted);
      margin-bottom: 14px;
    }
    .comments-form .reply-banner em { color: var(--accent); font-style: normal; font-weight: 600; }
    .comments-form .reply-banner button {
      background: none; border: none; color: var(--muted); cursor: pointer;
      font-size: 16px; line-height: 1; padding: 2px 6px;
    }
    .comments-form .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 12px; }
    @media (max-width: 640px) { .comments-form .row2 { grid-template-columns: 1fr; } }
    .comments-form input, .comments-form textarea {
      width: 100%;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 4px;
      color: var(--text);
      font: inherit;
      font-size: 14px;
      padding: 10px 12px;
    }
    .comments-form input:focus, .comments-form textarea:focus { outline: none; border-color: var(--accent); }
    .comments-form textarea { resize: vertical; min-height: 96px; line-height: 1.7; }
    .field-err { color: var(--danger); font-size: 12px; margin-top: 4px; }
    .form-foot { display: flex; align-items: center; justify-content: space-between; margin-top: 12px; }
    .char-count { color: var(--muted); font-size: 12px; }
    .btn-submit {
      background: var(--accent);
      color: var(--bg);
      border: none;
      border-radius: 999px;
      padding: 10px 24px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
    }
    .btn-submit:disabled { opacity: .6; cursor: not-allowed; }
    .submit-msg { font-size: 13px; margin-top: 10px; }
    .submit-msg.err { color: var(--danger); }
    .submit-msg.ok { color: var(--accent); }
    .comment-card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 14px 16px;
      margin-bottom: 12px;
    }
    .comment-head { display: flex; align-items: flex-start; gap: 10px; }
    .comment-avatar {
      width: 34px; height: 34px; border-radius: 50%;
      border: 1px solid var(--border); background: var(--bg);
      display: flex; align-items: center; justify-content: center;
      color: var(--muted); flex-shrink: 0;
    }
    .comment-avatar.blogger { border-color: rgba(201,168,106,.4); background: rgba(201,168,106,.12); color: var(--accent); }
    .comment-body { flex: 1; min-width: 0; }
    .comment-name { font-size: 14px; font-weight: 600; color: var(--text); }
    .chip-blogger {
      display: inline-block; background: var(--accent); color: var(--bg);
      font-size: 10px; font-weight: 600; border-radius: 999px;
      padding: 1px 8px; margin-left: 6px; vertical-align: 1px;
    }
    .comment-date { color: var(--muted); font-size: 12px; margin-left: 8px; font-weight: 400; }
    .comment-content { font-size: 14px; color: var(--text); margin-top: 6px; white-space: pre-wrap; word-break: break-word; }
    .comment-reply-btn {
      background: none; border: none; padding: 0; margin-top: 8px;
      color: var(--muted); font-size: 12px; cursor: pointer;
    }
    .comment-reply-btn:hover { color: var(--accent); }
    .comment-replies { margin-left: 26px; margin-top: 10px; padding-left: 14px; border-left: 2px solid rgba(201,168,106,.25); }
    .comment-replies .comment-card { background: var(--bg); padding: 12px 14px; }
    .comment-replies .comment-avatar { width: 30px; height: 30px; }
    .comments-empty { color: var(--muted); text-align: center; font-size: 14px; padding: 40px 0; }
    .cmt-skeleton {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 16px;
      margin-bottom: 12px;
      animation: cmt-pulse 1.5s ease-in-out infinite;
    }
    .sk-row { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
    .sk-avatar { width: 34px; height: 34px; border-radius: 50%; background: var(--border); flex-shrink: 0; }
    .sk-bar { height: 12px; border-radius: 4px; background: var(--border); margin-bottom: 8px; }
    @keyframes cmt-pulse { 0%, 100% { opacity: 1; } 50% { opacity: .55; } }
  </style>
</head>
<body>
  <header class="shell-header">
    <span class="brand serif" id="brand-text"></span>
    <a href="/travels">← 攻略列表</a>
  </header>
  <main>
    <div id="status" class="status">正在加载攻略…</div>
    <article id="travel" hidden>
      <div class="hero">
        <img id="t-cover" alt="" hidden />
        <div id="t-cover-ph" class="ph"></div>
        <div class="overlay">
          <p class="dest" id="t-dest"></p>
          <h1 id="t-title" class="serif"></h1>
          <div class="facts" id="t-facts"></div>
        </div>
      </div>
      <div class="stats" id="t-stats"></div>
      <blockquote class="summary serif" id="t-summary" hidden></blockquote>
      <section id="sec-attractions" hidden>
        <h2 class="section serif">景点推荐</h2>
        <div id="t-attractions"></div>
      </section>
      <section id="sec-itinerary" hidden>
        <h2 class="section serif">行程安排</h2>
        <ol class="itinerary" id="t-itinerary"></ol>
      </section>
      <section id="sec-reviews" hidden>
        <h2 class="section serif">旅行评价</h2>
        <div id="t-reviews"></div>
      </section>
      <section id="sec-comments" hidden>
        <h2 class="section serif">评论 <span id="c-total" class="c-count-badge" hidden></span></h2>
        <div class="comments-form">
          <div id="c-reply-banner" class="reply-banner" hidden>
            <span>回复 @<em id="c-reply-name"></em></span>
            <button type="button" id="c-reply-cancel" aria-label="取消回复">×</button>
          </div>
          <form id="c-form" novalidate>
            <div class="row2">
              <div>
                <input id="c-nickname" type="text" maxlength="50" placeholder="昵称 *" />
                <p id="c-err-nickname" class="field-err" hidden></p>
              </div>
              <div>
                <input id="c-website" type="url" maxlength="255" placeholder="网站（选填，https://...）" />
                <p id="c-err-website" class="field-err" hidden></p>
              </div>
            </div>
            <div>
              <textarea id="c-content" rows="4" maxlength="2000" placeholder="写下你的想法... *"></textarea>
              <p id="c-err-content" class="field-err" hidden></p>
            </div>
            <p id="c-submit-msg" class="submit-msg" hidden></p>
            <div class="form-foot">
              <span id="c-count-chars" class="char-count">0 / 2000</span>
              <button id="c-submit" type="submit" class="btn-submit">发布评论</button>
            </div>
          </form>
        </div>
        <div id="c-list"></div>
      </section>
    </article>
  </main>

  <script>
    (function () {
      "use strict";

      // API 地址解析：theme-config.js 注入（可携带 /api/v1 前缀）> 同域相对路径
      var injected = window.__NOVA_CONFIG__ && window.__NOVA_CONFIG__.apiBase;
      var siteRoot = injected
        ? injected.replace(/\/api\/v1\/?$/, "").replace(/\/$/, "")
        : "";
      var apiBase = siteRoot + "/api/v1";

      // 获取博主资料并更新品牌文字
      var blogTitle = "";
      fetch(apiBase + "/public/blogger", { headers: { Accept: "application/json" } })
        .then(function (r) { return r.json(); })
        .then(function (res) {
          if (res && res.code === 0 && res.data) {
            blogTitle = res.data.blog_title || "";
            var brand = document.getElementById("brand-text");
            if (brand) brand.textContent = blogTitle;
          }
        })
        .catch(function () { /* 静默失败 */ });

      // 从 URL 解析 id：/travels/{id} | /travels/{id}.html | /travels/{id}/
      function parseId() {
        var m = location.pathname.match(/\/travels\/([^/]+?)\.?html?\/?$/i) ||
                location.pathname.match(/\/travels\/([^/]+?)\/?$/i);
        if (!m) return "";
        try {
          return decodeURIComponent(m[1]);
        } catch (e) {
          // 非法百分号编码：按无效地址处理，避免页面卡在加载态
          return "";
        }
      }

      function el(id) { return document.getElementById(id); }

      function escapeHtml(s) {
        return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;")
          .replace(/>/g, "&gt;").replace(/"/g, "&quot;");
      }

      function safeUrl(u) {
        u = String(u || "").trim();
        if (/^(https?:\/\/|\/|#)/i.test(u)) return u;
        return "#";
      }

      // 兼容 JSONB 字段的防御性取值（与站点服务端渲染逻辑一致）
      function pickString(map, keys) {
        for (var i = 0; i < keys.length; i++) {
          var v = map[keys[i]];
          if (typeof v === "string" && v.trim()) return v;
          if (typeof v === "number") return String(v);
        }
        return "";
      }
      function pickNumber(map, keys) {
        for (var i = 0; i < keys.length; i++) {
          var v = map[keys[i]];
          if (typeof v === "number" && isFinite(v)) return v;
        }
        return 0;
      }
      function stars(value) {
        var n = Math.max(0, Math.min(5, Math.round(value)));
        var out = "";
        for (var i = 1; i <= 5; i++) out += i <= n ? "★" : "☆";
        return out;
      }

      function showError(msg) {
        var s = el("status");
        s.className = "status error";
        s.innerHTML = msg + ' · <a href="/travels">返回攻略列表</a>';
      }

      function render(t) {
        document.title = blogTitle ? (t.title || "攻略") + " | " + blogTitle : (t.title || "攻略");
        el("t-title").textContent = t.title || "无标题";
        el("t-dest").textContent = (t.destination || "") + (t.region ? " · " + t.region : "");

        var facts = [];
        if (t.days > 0) facts.push(escapeHtml(t.days) + " 天");
        if (t.best_month) facts.push("最佳月份 " + escapeHtml(t.best_month));
        if (t.rating > 0) facts.push("★ " + t.rating.toFixed(1) + (t.review_count > 0 ? " (" + t.review_count + " 条评价)" : ""));
        el("t-facts").innerHTML = facts.join("<span>·</span>");

        if (t.cover_image) {
          var c = el("t-cover");
          c.src = safeUrl(t.cover_image);
          c.hidden = false;
          el("t-cover-ph").style.display = "none";
        }

        var stats = [];
        if (t.view_count !== undefined) stats.push(escapeHtml(t.view_count) + " 次浏览");
        if (t.like_count !== undefined) stats.push(escapeHtml(t.like_count) + " 人点赞");
        el("t-stats").innerHTML = stats.join("<span>·</span>");

        if (t.summary) {
          var sm = el("t-summary");
          sm.textContent = t.summary;
          sm.hidden = false;
        }

        // 景点推荐
        var attractions = t.attractions || [];
        if (attractions.length) {
          el("sec-attractions").hidden = false;
          var html = "";
          attractions.forEach(function (a, i) {
            var image = safeUrl(pickString(a, ["image", "cover_image", "image_url", "cover", "pic", "photo"]));
            var name = escapeHtml(pickString(a, ["name", "title"]));
            var desc = escapeHtml(pickString(a, ["description", "content", "intro", "summary", "text"]));
            html += '<div class="attraction">' +
              (image !== "#" ? '<img src="' + image + '" alt="' + (name || "景点 " + (i + 1)) + '" loading="lazy" />' : "") +
              '<div class="body">' + (name ? "<h3 class=\"serif\">" + name + "</h3>" : "") +
              (desc ? "<p>" + desc + "</p>" : "") + "</div></div>";
          });
          el("t-attractions").innerHTML = html;
        }

        // 行程安排
        var itinerary = t.itinerary || [];
        if (itinerary.length) {
          el("sec-itinerary").hidden = false;
          var items = "";
          itinerary.forEach(function (it) {
            var label = escapeHtml(pickString(it, ["day", "day_label", "dayLabel", "label", "title", "name"]));
            var desc = escapeHtml(pickString(it, ["description", "content", "detail", "summary", "text"]));
            items += "<li>" + (label ? "<h3 class=\"serif\">" + label + "</h3>" : "") +
              (desc ? "<p>" + desc + "</p>" : "") + "</li>";
          });
          el("t-itinerary").innerHTML = items;
        }

        // 旅行评价
        var reviews = t.reviews || [];
        if (reviews.length) {
          el("sec-reviews").hidden = false;
          var rhtml = "";
          reviews.forEach(function (r) {
            var author = escapeHtml(pickString(r, ["nickname", "user", "author", "name", "reviewer"]) || "匿名旅行者");
            var rating = pickNumber(r, ["rating", "score", "star", "stars"]);
            var content = escapeHtml(pickString(r, ["content", "comment", "text", "description", "review"]));
            rhtml += '<div class="review"><div class="row"><span>' + author + "</span>" +
              (rating > 0 ? '<span class="stars">' + stars(rating) + "</span>" : "") +
              "</div>" + (content ? "<p>" + content + "</p>" : "") + "</div>";
          });
          el("t-reviews").innerHTML = rhtml;
        }

        el("status").hidden = true;
        el("travel").hidden = false;
        // 评论区：攻略详情页无条件展示（与预渲染页一致）
        if (t.id) { initComments(t.id); }
      }

      // ===== 评论模块（与站点预渲染页 components/Comments.tsx 行为对齐）=====
      var COMMENT_TARGET_TYPE = "travel_guide";
      var commentTargetId = "";
      var replyTo = null; // { id: string, nickname: string }
      var submitting = false;

      var USER_ICON_SVG =
        '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" ' +
        'stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' +
        '<path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>';

      function initComments(targetId) {
        commentTargetId = String(targetId);
        el("sec-comments").hidden = false;
        renderCommentSkeleton();
        bindCommentForm();
        fetchComments();
      }

      function renderCommentSkeleton() {
        var card =
          '<div class="cmt-skeleton"><div class="sk-row"><span class="sk-avatar"></span>' +
          '<span class="sk-bar" style="width:30%;margin:0"></span></div>' +
          '<div class="sk-bar" style="width:100%"></div><div class="sk-bar" style="width:66%"></div></div>';
        var html = "";
        for (var i = 0; i < 3; i++) html += card;
        el("c-list").innerHTML = html;
        el("c-total").hidden = true;
      }

      function fetchComments() {
        var query =
          "target_type=" + encodeURIComponent(COMMENT_TARGET_TYPE) +
          "&target_id=" + encodeURIComponent(commentTargetId) +
          "&page=1&page_size=100";
        return fetch(apiBase + "/public/comments?" + query, { headers: { Accept: "application/json" } })
          .then(function (r) { return r.json(); })
          .then(function (res) {
            var list = res && res.code === 0 && res.data && Array.isArray(res.data.list) ? res.data.list : [];
            renderCommentList(list);
          })
          .catch(function () { renderCommentList([]); });
      }

      // 两级回复树：parent_id 指向的父评论存在则挂入其 replies，否则作为根评论
      function buildCommentTree(list) {
        var nodeMap = {};
        var roots = [];
        list.forEach(function (c) { nodeMap[c.id] = { c: c, replies: [] }; });
        list.forEach(function (c) {
          var node = nodeMap[c.id];
          if (!node) return;
          if (c.parent_id && nodeMap[c.parent_id]) nodeMap[c.parent_id].replies.push(node);
          else roots.push(node);
        });
        return roots;
      }

      function commentDate(dateStr) {
        var d = new Date(dateStr);
        if (isNaN(d.getTime())) return "";
        return d.toLocaleDateString("zh-CN", { year: "numeric", month: "long", day: "numeric" });
      }

      function commentCardHTML(node, isReply) {
        var c = node.c;
        var chip = c.is_blogger ? '<span class="chip-blogger">博主</span>' : "";
        var date = commentDate(c.created_at || "");
        var replyBtn = isReply ? "" :
          '<button type="button" class="comment-reply-btn" data-reply-id="' + escapeHtml(c.id || "") +
          '" data-reply-nick="' + escapeHtml(c.nickname || "") + '">回复</button>';
        return (
          '<div class="comment-card"><div class="comment-head">' +
          '<span class="comment-avatar' + (c.is_blogger ? " blogger" : "") + '">' + USER_ICON_SVG + "</span>" +
          '<div class="comment-body"><div>' +
          '<span class="comment-name">' + escapeHtml(c.nickname || "") + "</span>" + chip +
          (date ? '<span class="comment-date">' + escapeHtml(date) + "</span>" : "") +
          "</div>" +
          (c.content ? '<p class="comment-content">' + escapeHtml(c.content) + "</p>" : "") +
          replyBtn +
          "</div></div></div>"
        );
      }

      function renderCommentList(list) {
        var total = el("c-total");
        if (list.length > 0) { total.textContent = String(list.length); total.hidden = false; }
        else { total.hidden = true; }

        var tree = buildCommentTree(list);
        var box = el("c-list");
        if (tree.length === 0) {
          box.innerHTML = '<p class="comments-empty">还没有评论，来抢沙发吧～</p>';
          return;
        }
        box.innerHTML = tree.map(function (node) {
          var html = commentCardHTML(node, false);
          if (node.replies.length) {
            html += '<div class="comment-replies">' +
              node.replies.map(function (r) { return commentCardHTML(r, true); }).join("") +
              "</div>";
          }
          return html;
        }).join("");
      }

      function setReplyTo(id, nickname) {
        if (id) {
          replyTo = { id: id, nickname: nickname || "" };
          el("c-reply-name").textContent = nickname || "";
          el("c-reply-banner").hidden = false;
        } else {
          replyTo = null;
          el("c-reply-banner").hidden = true;
        }
      }

      function setSubmitMsg(msg, kind) {
        var node = el("c-submit-msg");
        if (!msg) { node.hidden = true; node.textContent = ""; return; }
        node.textContent = msg;
        node.className = "submit-msg " + (kind || "");
        node.hidden = false;
      }

      function setFieldError(id, msg) {
        var node = el(id);
        if (!msg) { node.hidden = true; node.textContent = ""; return; }
        node.textContent = msg;
        node.hidden = false;
      }

      function bindCommentForm() {
        el("c-content").addEventListener("input", function () {
          el("c-count-chars").textContent = this.value.trim().length + " / 2000";
        });

        el("c-reply-cancel").addEventListener("click", function () { setReplyTo(null); });

        // 列表内「回复」按钮：事件委托
        el("c-list").addEventListener("click", function (e) {
          var btn = e.target.closest ? e.target.closest(".comment-reply-btn") : null;
          if (!btn) return;
          setReplyTo(btn.getAttribute("data-reply-id"), btn.getAttribute("data-reply-nick"));
        });

        el("c-form").addEventListener("submit", function (ev) {
          ev.preventDefault();
          if (submitting) return;

          var nickname = el("c-nickname").value.trim();
          var website = el("c-website").value.trim();
          var content = el("c-content").value.trim();

          // 与预渲染页一致的逐字段校验（昵称 1-50 / 网址格式 / 内容 1-2000）
          var errors = {};
          if (!nickname) errors.nickname = "请填写昵称";
          else if (nickname.length > 50) errors.nickname = "昵称不能超过 50 字符";
          if (website && !/^https?:\/\/[\w.-]+(:\d+)?(\/[\w\-./?%&=]*)?$/i.test(website)) {
            errors.website = "请输入有效的网址（以 http(s):// 开头）";
          }
          if (!content) errors.content = "请填写评论内容";
          else if (content.length > 2000) errors.content = "评论内容不能超过 2000 字符";
          setFieldError("c-err-nickname", errors.nickname);
          setFieldError("c-err-website", errors.website);
          setFieldError("c-err-content", errors.content);
          if (errors.nickname || errors.website || errors.content) return;

          submitting = true;
          var btn = el("c-submit");
          btn.disabled = true;
          btn.textContent = "发布中...";
          setSubmitMsg("", "");

          var payload = {
            target_type: COMMENT_TARGET_TYPE,
            target_id: commentTargetId,
            nickname: nickname,
            content: content
          };
          if (replyTo) payload.parent_id = replyTo.id;
          if (website) payload.website = website;

          fetch(apiBase + "/public/comments", {
            method: "POST",
            headers: { "Content-Type": "application/json", Accept: "application/json" },
            body: JSON.stringify(payload)
          })
            .then(function (r) { return r.json(); })
            .then(function (res) {
              if (res && res.code === 0) {
                el("c-content").value = "";
                el("c-count-chars").textContent = "0 / 2000";
                setReplyTo(null);
                setSubmitMsg("评论已提交，感谢你的留言！", "ok");
                return fetchComments();
              }
              setSubmitMsg((res && res.msg) || "评论发布失败，请稍后再试", "err");
            })
            .catch(function () { setSubmitMsg("评论发布失败，请稍后再试", "err"); })
            .then(function () {
              submitting = false;
              btn.disabled = false;
              btn.textContent = "发布评论";
            });
        });
      }

      var id = parseId();
      if (!id) { showError("无效的攻略地址"); return; }

      fetch(siteRoot + "/api/v1/public/travels/" + encodeURIComponent(id), {
        headers: { Accept: "application/json" }
      })
        .then(function (r) { return r.json(); })
        .then(function (res) {
          if (res && res.code === 0 && res.data) { render(res.data); }
          else { showError((res && res.msg) || "攻略不存在或已下架"); }
        })
        .catch(function () { showError("攻略加载失败，请稍后重试"); });
    })();
  </script>
</body>
</html>
