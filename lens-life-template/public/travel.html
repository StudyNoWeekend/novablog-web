<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- 动态内容壳页面：静态导出未预生成的旅行攻略由此页面客户端取数渲染（主题规范 3.4） -->
  <title>攻略加载中 | Lens &amp; Life</title>
  <script src="/theme-config.js"></script>
  <style>
    :root {
      --bg: #131311;
      --panel: #1b1a17;
      --border: #2c2a25;
      --text: #ece7dd;
      --muted: #a29a8b;
      --accent: #c9a86a;
      --danger: #e07a6a;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: ui-sans-serif, system-ui, "PingFang SC", "Microsoft YaHei", sans-serif;
      line-height: 1.8;
    }
    .serif { font-family: Georgia, "Songti SC", "Noto Serif SC", serif; }
    .shell-header {
      border-bottom: 1px solid var(--border);
      padding: 18px 28px;
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      letter-spacing: 0.14em;
      font-size: 13px;
    }
    .brand { color: var(--text); }
    .brand em { color: var(--accent); font-style: normal; }
    .shell-header a { color: var(--muted); text-decoration: none; }
    .shell-header a:hover { color: var(--accent); }
    main { max-width: 860px; margin: 0 auto; padding: 40px 24px 96px; }
    .status {
      color: var(--muted);
      padding: 64px 0;
      text-align: center;
      letter-spacing: 0.05em;
    }
    .status.error { color: var(--danger); }
    .status.error a { color: var(--accent); }
    .hero { position: relative; border-radius: 8px; overflow: hidden; margin-bottom: 32px; }
    .hero img { width: 100%; aspect-ratio: 21/9; object-fit: cover; display: block; }
    .hero .ph { width: 100%; aspect-ratio: 21/9; background: var(--panel); }
    .hero .overlay {
      position: absolute; inset: 0;
      background: linear-gradient(to top, rgba(0,0,0,.85), rgba(0,0,0,.25) 55%, transparent);
      display: flex; flex-direction: column; justify-content: flex-end;
      padding: 24px;
    }
    .hero .dest { color: var(--accent); font-size: 12px; letter-spacing: 0.2em; text-transform: uppercase; margin-bottom: 6px; }
    .hero h1 { color: #fff; font-size: 30px; line-height: 1.3; }
    .hero .facts { color: rgba(255,255,255,.82); font-size: 13px; margin-top: 10px; display: flex; flex-wrap: wrap; gap: 14px; }
    .stats { display: flex; flex-wrap: wrap; gap: 14px; color: var(--muted); font-size: 14px; margin-bottom: 28px; }
    blockquote.summary {
      border-left: 2px solid var(--accent);
      padding: 8px 20px;
      margin: 0 0 40px;
      color: var(--muted);
      font-style: italic;
    }
    h2.section { font-size: 24px; margin: 44px 0 18px; }
    .attraction { display: flex; gap: 16px; background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 16px; margin-bottom: 16px; }
    .attraction img { width: 176px; aspect-ratio: 4/3; object-fit: cover; border-radius: 4px; flex-shrink: 0; }
    .attraction h3 { font-size: 17px; margin-bottom: 6px; }
    .attraction p { font-size: 14px; color: var(--muted); }
    .itinerary { list-style: none; border-left: 2px solid rgba(201,168,106,.25); padding-left: 22px; }
    .itinerary li { position: relative; margin-bottom: 22px; }
    .itinerary li::before {
      content: ""; position: absolute; left: -29px; top: 8px;
      width: 12px; height: 12px; border-radius: 50%;
      border: 2px solid var(--accent); background: var(--bg);
    }
    .itinerary h3 { font-size: 15px; color: var(--accent); margin-bottom: 4px; }
    .itinerary p { font-size: 14px; color: var(--text); }
    .review { background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 16px 18px; margin-bottom: 12px; }
    .review .row { display: flex; justify-content: space-between; align-items: center; gap: 12px; font-size: 14px; }
    .review .stars { color: var(--accent); letter-spacing: 2px; }
    .review p { font-size: 14px; margin-top: 8px; color: var(--text); }
  </style>
</head>
<body>
  <header class="shell-header">
    <span class="brand serif">Lens <em>&amp;</em> Life</span>
    <a href="/travels">← 攻略列表</a>
  </header>
  <main>
    <div id="status" class="status">正在加载攻略…</div>
    <article id="travel" hidden>
      <div class="hero">
        <img id="t-cover" alt="" hidden />
        <div id="t-cover-ph" class="ph"></div>
        <div class="overlay">
          <p class="dest" id="t-dest"></p>
          <h1 id="t-title" class="serif"></h1>
          <div class="facts" id="t-facts"></div>
        </div>
      </div>
      <div class="stats" id="t-stats"></div>
      <blockquote class="summary serif" id="t-summary" hidden></blockquote>
      <section id="sec-attractions" hidden>
        <h2 class="section serif">景点推荐</h2>
        <div id="t-attractions"></div>
      </section>
      <section id="sec-itinerary" hidden>
        <h2 class="section serif">行程安排</h2>
        <ol class="itinerary" id="t-itinerary"></ol>
      </section>
      <section id="sec-reviews" hidden>
        <h2 class="section serif">旅行评价</h2>
        <div id="t-reviews"></div>
      </section>
    </article>
  </main>

  <script>
    (function () {
      "use strict";

      // API 地址解析：theme-config.js 注入（可携带 /api/v1 前缀）> 同域相对路径
      var injected = window.__NOVA_CONFIG__ && window.__NOVA_CONFIG__.apiBase;
      var siteRoot = injected
        ? injected.replace(/\/api\/v1\/?$/, "").replace(/\/$/, "")
        : "";

      // 从 URL 解析 id：/travels/{id} | /travels/{id}.html | /travels/{id}/
      function parseId() {
        var m = location.pathname.match(/\/travels\/([^/]+?)\.?html?\/?$/i) ||
                location.pathname.match(/\/travels\/([^/]+?)\/?$/i);
        if (!m) return "";
        try {
          return decodeURIComponent(m[1]);
        } catch (e) {
          // 非法百分号编码：按无效地址处理，避免页面卡在加载态
          return "";
        }
      }

      function el(id) { return document.getElementById(id); }

      function escapeHtml(s) {
        return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;")
          .replace(/>/g, "&gt;").replace(/"/g, "&quot;");
      }

      function safeUrl(u) {
        u = String(u || "").trim();
        if (/^(https?:\/\/|\/|#)/i.test(u)) return u;
        return "#";
      }

      // 兼容 JSONB 字段的防御性取值（与站点服务端渲染逻辑一致）
      function pickString(map, keys) {
        for (var i = 0; i < keys.length; i++) {
          var v = map[keys[i]];
          if (typeof v === "string" && v.trim()) return v;
          if (typeof v === "number") return String(v);
        }
        return "";
      }
      function pickNumber(map, keys) {
        for (var i = 0; i < keys.length; i++) {
          var v = map[keys[i]];
          if (typeof v === "number" && isFinite(v)) return v;
        }
        return 0;
      }
      function stars(value) {
        var n = Math.max(0, Math.min(5, Math.round(value)));
        var out = "";
        for (var i = 1; i <= 5; i++) out += i <= n ? "★" : "☆";
        return out;
      }

      function showError(msg) {
        var s = el("status");
        s.className = "status error";
        s.innerHTML = msg + ' · <a href="/travels">返回攻略列表</a>';
      }

      function render(t) {
        document.title = (t.title || "攻略") + " | Lens & Life";
        el("t-title").textContent = t.title || "无标题";
        el("t-dest").textContent = (t.destination || "") + (t.region ? " · " + t.region : "");

        var facts = [];
        if (t.days > 0) facts.push(escapeHtml(t.days) + " 天");
        if (t.best_month) facts.push("最佳月份 " + escapeHtml(t.best_month));
        if (t.rating > 0) facts.push("★ " + t.rating.toFixed(1) + (t.review_count > 0 ? " (" + t.review_count + " 条评价)" : ""));
        el("t-facts").innerHTML = facts.join("<span>·</span>");

        if (t.cover_image) {
          var c = el("t-cover");
          c.src = safeUrl(t.cover_image);
          c.hidden = false;
          el("t-cover-ph").style.display = "none";
        }

        var stats = [];
        if (t.view_count !== undefined) stats.push(escapeHtml(t.view_count) + " 次浏览");
        if (t.like_count !== undefined) stats.push(escapeHtml(t.like_count) + " 人点赞");
        el("t-stats").innerHTML = stats.join("<span>·</span>");

        if (t.summary) {
          var sm = el("t-summary");
          sm.textContent = t.summary;
          sm.hidden = false;
        }

        // 景点推荐
        var attractions = t.attractions || [];
        if (attractions.length) {
          el("sec-attractions").hidden = false;
          var html = "";
          attractions.forEach(function (a, i) {
            var image = safeUrl(pickString(a, ["image", "cover_image", "image_url", "cover", "pic", "photo"]));
            var name = escapeHtml(pickString(a, ["name", "title"]));
            var desc = escapeHtml(pickString(a, ["description", "content", "intro", "summary", "text"]));
            html += '<div class="attraction">' +
              (image !== "#" ? '<img src="' + image + '" alt="' + (name || "景点 " + (i + 1)) + '" loading="lazy" />' : "") +
              '<div class="body">' + (name ? "<h3 class=\"serif\">" + name + "</h3>" : "") +
              (desc ? "<p>" + desc + "</p>" : "") + "</div></div>";
          });
          el("t-attractions").innerHTML = html;
        }

        // 行程安排
        var itinerary = t.itinerary || [];
        if (itinerary.length) {
          el("sec-itinerary").hidden = false;
          var items = "";
          itinerary.forEach(function (it) {
            var label = escapeHtml(pickString(it, ["day", "day_label", "dayLabel", "label", "title", "name"]));
            var desc = escapeHtml(pickString(it, ["description", "content", "detail", "summary", "text"]));
            items += "<li>" + (label ? "<h3 class=\"serif\">" + label + "</h3>" : "") +
              (desc ? "<p>" + desc + "</p>" : "") + "</li>";
          });
          el("t-itinerary").innerHTML = items;
        }

        // 旅行评价
        var reviews = t.reviews || [];
        if (reviews.length) {
          el("sec-reviews").hidden = false;
          var rhtml = "";
          reviews.forEach(function (r) {
            var author = escapeHtml(pickString(r, ["nickname", "user", "author", "name", "reviewer"]) || "匿名旅行者");
            var rating = pickNumber(r, ["rating", "score", "star", "stars"]);
            var content = escapeHtml(pickString(r, ["content", "comment", "text", "description", "review"]));
            rhtml += '<div class="review"><div class="row"><span>' + author + "</span>" +
              (rating > 0 ? '<span class="stars">' + stars(rating) + "</span>" : "") +
              "</div>" + (content ? "<p>" + content + "</p>" : "") + "</div>";
          });
          el("t-reviews").innerHTML = rhtml;
        }

        el("status").hidden = true;
        el("travel").hidden = false;
      }

      var id = parseId();
      if (!id) { showError("无效的攻略地址"); return; }

      fetch(siteRoot + "/api/v1/public/travels/" + encodeURIComponent(id), {
        headers: { Accept: "application/json" }
      })
        .then(function (r) { return r.json(); })
        .then(function (res) {
          if (res && res.code === 0 && res.data) { render(res.data); }
          else { showError((res && res.msg) || "攻略不存在或已下架"); }
        })
        .catch(function () { showError("攻略加载失败，请稍后重试"); });
    })();
  </script>
</body>
</html>
