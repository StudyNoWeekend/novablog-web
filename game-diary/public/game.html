<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- 动态内容壳页面：静态导出未预生成的游戏详情由此页面客户端取数渲染（主题规范 3.4） -->
  <title>游戏加载中</title>
  <script src="/theme-config.js"></script>
  <style>
    :root {
      --bg: #0b0a14;
      --panel: #161327;
      --border: rgba(255, 255, 255, 0.08);
      --text: #f4f2ff;
      --muted: #9d97bc;
      --subtle: #6e688e;
      --accent: #a78bfa;
      --accent-2: #ec4899;
      --danger: #f87171;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    [hidden] { display: none !important; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      line-height: 1.8;
    }
    .shell-header {
      border-bottom: 1px solid var(--border);
      padding: 14px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(16, 14, 28, 0.85);
      backdrop-filter: blur(10px);
      position: sticky;
      top: 0;
      z-index: 10;
    }
    .brand { display: flex; align-items: center; gap: 10px; font-weight: 800; font-size: 16px; }
    .brand-logo {
      width: 38px; height: 38px; border-radius: 12px;
      background: linear-gradient(120deg, #8b5cf6 0%, #ec4899 100%);
      box-shadow: 0 0 24px rgba(139, 92, 246, 0.35);
      display: flex; align-items: center; justify-content: center;
    }
    .brand-logo svg { width: 22px; height: 22px; stroke: #fff; }
    .brand-sub {
      display: block; font-size: 9px; font-weight: 700;
      letter-spacing: 0.22em; color: var(--subtle); text-transform: uppercase;
    }
    .shell-header a.back { color: var(--muted); text-decoration: none; font-size: 14px; }
    .shell-header a.back:hover { color: var(--accent); }
    main { max-width: 860px; margin: 0 auto; padding: 40px 24px 96px; }
    .status { color: var(--muted); padding: 64px 0; text-align: center; }
    .status.error { color: var(--danger); }
    .status.error a { color: var(--accent); }
    .cover {
      position: relative;
      aspect-ratio: 21 / 9;
      border-radius: 18px;
      overflow: hidden;
      border: 1px solid var(--border);
      margin-bottom: 32px;
      background: linear-gradient(135deg, #221a44 0%, #171233 60%, #0d0b1a 100%);
    }
    .cover img { width: 100%; height: 100%; object-fit: cover; }
    .cover .shade {
      position: absolute; inset: 0;
      background: linear-gradient(to top, rgba(11, 10, 20, 0.85), rgba(11, 10, 20, 0.1) 55%, rgba(11, 10, 20, 0.25));
    }
    .cover .title-block { position: absolute; left: 24px; right: 24px; bottom: 20px; }
    .brand-chip {
      display: inline-block;
      background: linear-gradient(120deg, #8b5cf6 0%, #ec4899 100%);
      color: #fff; font-size: 12px; font-weight: 700;
      border-radius: 999px; padding: 3px 12px; margin-bottom: 10px;
    }
    h1.g-title { font-size: 32px; line-height: 1.3; font-weight: 800; }
    .desc {
      color: #ded9f2;
      font-size: 16px;
      white-space: pre-line;
    }
    .meta-row {
      display: flex; align-items: center; gap: 8px;
      margin-top: 28px; font-size: 14px; color: var(--muted);
    }
    .meta-row svg { width: 16px; height: 16px; stroke: var(--subtle); }
    .actions { margin-top: 36px; display: flex; flex-wrap: wrap; gap: 12px; }
    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 8px;
      min-height: 44px; padding: 0 24px;
      border-radius: 999px; font-size: 14px; font-weight: 700;
      text-decoration: none; cursor: pointer; border: 1px solid var(--border);
    }
    .btn-primary {
      background: linear-gradient(120deg, #8b5cf6 0%, #ec4899 100%);
      color: #fff; border: none;
      box-shadow: 0 0 24px rgba(139, 92, 246, 0.35);
    }
    .btn-primary:hover { opacity: .9; }
    .btn-ghost { background: var(--panel); color: #ded9f2; }
    .btn-ghost:hover { border-color: var(--accent); color: var(--accent); }
    .shell-footer {
      border-top: 1px solid var(--border);
      margin-top: 64px;
      padding: 24px;
      text-align: center;
      font-size: 12px;
      color: var(--subtle);
    }
    .shell-footer a { color: var(--subtle); text-decoration: none; }
    .shell-footer a:hover { color: var(--accent); }
  </style>
</head>
<body>
  <header class="shell-header">
    <span class="brand">
      <span class="brand-logo" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <line x1="6" x2="10" y1="11" y2="11"/><line x1="8" x2="8" y1="9" y2="13"/>
          <line x1="15" x2="15.01" y1="12" y2="12"/><line x1="18" x2="18.01" y1="10" y2="10"/>
          <path d="M17.32 5H6.68a4 4 0 0 0-3.978 3.59c-.006.052-.01.101-.017.152C2.604 9.416 2 14.456 2 16a3 3 0 0 0 3 3c1 0 1.5-.5 2-1l1.414-1.414A2 2 0 0 1 9.828 16h4.344a2 2 0 0 1 1.414.586L17 18c.5.5 1 1 2 1a3 3 0 0 0 3-3c0-1.545-.604-6.584-.685-7.258-.007-.05-.011-.1-.017-.151A4 4 0 0 0 17.32 5z"/>
        </svg>
      </span>
      <span>
        <span id="brand-text"></span>
        <span class="brand-sub">Game · Share · Life</span>
      </span>
    </span>
    <a class="back" href="/games">← 返回游戏库</a>
  </header>
  <main>
    <div id="status" class="status">正在加载游戏信息…</div>
    <article id="game" hidden>
      <div class="cover" id="g-cover-wrap">
        <img id="g-cover" alt="" hidden />
        <div class="shade"></div>
        <div class="title-block">
          <span id="g-brand" class="brand-chip" hidden></span>
          <h1 id="g-title" class="g-title"></h1>
        </div>
      </div>
      <p id="g-desc" class="desc"></p>
      <div class="meta-row" id="g-meta" hidden>
        <svg viewBox="0 0 24 24" fill="none" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M3 20v-8a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v8"/><path d="M5 10V6a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2v4"/>
        </svg>
        <span>开发 / 发行：<span id="g-meta-brand"></span></span>
      </div>
      <div class="actions">
        <a id="g-search" class="btn btn-primary" href="#">查找相关攻略文章</a>
        <a class="btn btn-ghost" href="/games">浏览全部游戏</a>
      </div>
    </article>
  </main>
  <footer class="shell-footer">
    <p id="footer-copy"></p>
    <p>
      主题来源：
      <a href="https://github.com/StudyNoWeekend/novablog-web/tree/HEAD/game-diary" target="_blank" rel="noopener noreferrer">game-diary</a>
    </p>
  </footer>

  <script>
    (function () {
      "use strict";

      // API 地址解析：theme-config.js 注入（可携带 /api/v1 前缀）> 同域相对路径
      var injected = window.__NOVA_CONFIG__ && window.__NOVA_CONFIG__.apiBase;
      var siteRoot = injected
        ? injected.replace(/\/api\/v1\/?$/, "").replace(/\/$/, "")
        : "";
      var apiBase = siteRoot + "/api/v1";

      // 获取博主资料并更新品牌文字
      var blogTitle = "";
      fetch(apiBase + "/public/blogger", { headers: { Accept: "application/json" } })
        .then(function (r) { return r.json(); })
        .then(function (res) {
          if (res && res.code === 0 && res.data) {
            blogTitle = res.data.blog_title || "";
            var brand = document.getElementById("brand-text");
            if (brand) brand.textContent = blogTitle;
            var copy = document.getElementById("footer-copy");
            if (copy) copy.textContent = "© " + new Date().getFullYear() + " " + blogTitle + " · 用游戏记录热爱";
          }
        })
        .catch(function () { /* 静默失败 */ });

      // 从 URL 解析游戏 id：/games/{id} | /games/{id}.html | /games/{id}/
      function parseId() {
        var m = location.pathname.match(/\/games\/([^/]+?)\.?html?\/?$/i) ||
                location.pathname.match(/\/games\/([^/]+?)\/?$/i);
        if (!m) return "";
        try {
          return decodeURIComponent(m[1]);
        } catch (e) {
          return "";
        }
      }

      function el(id) { return document.getElementById(id); }

      function escapeHtml(s) {
        return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;")
          .replace(/>/g, "&gt;").replace(/"/g, "&quot;");
      }

      function safeUrl(u) {
        u = String(u || "").trim();
        if (/^(https?:\/\/|\/|#|mailto:)/i.test(u)) return u;
        return "#";
      }

      function showError(msg) {
        var s = el("status");
        s.className = "status error";
        s.innerHTML = msg + ' · <a href="/games">返回游戏库</a>';
      }

      function render(g) {
        var name = g.name || "未命名游戏";
        document.title = blogTitle ? name + " | " + blogTitle : name;
        el("g-title").textContent = name;

        if (g.image_url) {
          var img = el("g-cover");
          img.src = safeUrl(g.image_url);
          img.hidden = false;
        } else {
          el("g-cover-wrap").style.aspectRatio = "auto";
        }

        if (g.brand) {
          var chip = el("g-brand");
          chip.textContent = g.brand;
          chip.hidden = false;
          el("g-meta").hidden = false;
          el("g-meta-brand").textContent = g.brand;
        }

        el("g-desc").textContent = g.description || "暂无游戏介绍。";

        var search = el("g-search");
        search.href = "/articles?keyword=" + encodeURIComponent(g.name || "");

        el("status").hidden = true;
        el("game").hidden = false;
      }

      var gameId = parseId();
      if (!gameId) { showError("无效的游戏地址"); return; }

      fetch(apiBase + "/public/equipments/" + encodeURIComponent(gameId), {
        headers: { Accept: "application/json" }
      })
        .then(function (r) { return r.json(); })
        .then(function (res) {
          if (res && res.code === 0 && res.data) { render(res.data); }
          else { showError((res && res.msg) || "游戏不存在或已下架"); }
        })
        .catch(function () { showError("游戏信息加载失败，请稍后重试"); });
    })();
  </script>
</body>
</html>
