<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- 动态内容壳页面：静态导出未预生成的开源作品详情由此页面客户端取数渲染（主题规范 3.4） -->
  <title>开源作品加载中</title>
  <script src="/theme-config.js"></script>
  <style>
    :root {
      --bg: #0b0a14;
      --panel: #161327;
      --border: rgba(255, 255, 255, 0.08);
      --text: #f4f2ff;
      --muted: #9d97bc;
      --subtle: #6e688e;
      --accent: #a78bfa;
      --accent-2: #ec4899;
      --danger: #f87171;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    [hidden] { display: none !important; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      line-height: 1.8;
    }
    .shell-header {
      border-bottom: 1px solid var(--border);
      padding: 14px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(16, 14, 28, 0.85);
      backdrop-filter: blur(10px);
      position: sticky;
      top: 0;
      z-index: 10;
    }
    .brand { display: flex; align-items: center; gap: 10px; font-weight: 800; font-size: 16px; }
    .brand-logo {
      width: 38px; height: 38px; border-radius: 12px;
      background: linear-gradient(120deg, #8b5cf6 0%, #ec4899 100%);
      box-shadow: 0 0 24px rgba(139, 92, 246, 0.35);
      display: flex; align-items: center; justify-content: center;
    }
    .brand-logo svg { width: 22px; height: 22px; stroke: #fff; }
    .brand-sub {
      display: block; font-size: 9px; font-weight: 700;
      letter-spacing: 0.22em; color: var(--subtle); text-transform: uppercase;
    }
    .shell-header a.back { color: var(--muted); text-decoration: none; font-size: 14px; }
    .shell-header a.back:hover { color: var(--accent); }
    main { max-width: 860px; margin: 0 auto; padding: 40px 24px 96px; }
    .status { color: var(--muted); padding: 64px 0; text-align: center; }
    .status.error { color: var(--danger); }
    .status.error a { color: var(--accent); }
    .head-row { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; }
    h1.g-title { font-size: 32px; line-height: 1.3; font-weight: 800; }
    .stars { color: var(--muted); font-size: 14px; white-space: nowrap; }
    .stars b { color: var(--accent-2); font-weight: 700; }
    .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 16px; }
    .chip { border-radius: 999px; padding: 3px 12px; font-size: 12px; }
    .chip.lang { background: rgba(139, 92, 246, 0.14); color: var(--accent); font-weight: 600; }
    .chip.topic { border: 1px solid var(--border); background: var(--panel); color: var(--muted); }
    blockquote.summary {
      border-left: 2px solid var(--accent);
      padding: 4px 20px;
      margin: 24px 0 0;
      color: var(--muted);
      font-style: italic;
    }
    .links { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 28px; }
    .links a {
      display: inline-flex; align-items: center; gap: 8px;
      min-height: 44px; border-radius: 999px; padding: 0 24px; font-size: 14px; font-weight: 700;
      text-decoration: none; transition: opacity .2s ease, border-color .2s ease, color .2s ease;
    }
    .links .primary {
      background: linear-gradient(120deg, #8b5cf6 0%, #ec4899 100%);
      color: #fff; border: none;
      box-shadow: 0 0 24px rgba(139, 92, 246, 0.35);
    }
    .links .primary:hover { opacity: .9; }
    .links .ghost { border: 1px solid var(--border); background: var(--panel); color: var(--muted); }
    .links .ghost:hover { border-color: var(--accent); color: var(--accent); }
    h2.section { font-size: 24px; margin: 44px 0 18px; padding-top: 32px; border-top: 1px solid var(--border); font-weight: 800; }
    /* README（Markdown）正文样式，与站点 .prose-content 对齐 */
    .md { color: #ded9f2; font-size: 16px; line-height: 1.8; word-break: break-word; }
    .md h1, .md h2, .md h3, .md h4, .md h5, .md h6 {
      color: var(--text); font-weight: 800; margin: 2rem 0 1rem; line-height: 1.3;
    }
    .md h1 { font-size: 1.5rem; } .md h2 { font-size: 1.3rem; } .md h3 { font-size: 1.15rem; }
    .md p { margin-bottom: 1.1rem; }
    .md a { color: var(--accent); text-decoration: underline; text-underline-offset: 2px; }
    .md a:hover { color: var(--accent-2); }
    .md ul, .md ol { margin: 0 0 1.1rem; padding-left: 1.5rem; }
    .md ul { list-style: disc; } .md ol { list-style: decimal; }
    .md li { margin-bottom: .4rem; }
    .md blockquote {
      border-left: 3px solid var(--accent); margin: 1.2rem 0;
      padding: .4rem 0 .4rem 1.1rem; color: var(--muted); font-style: italic;
    }
    .md code { background: var(--panel); border-radius: 4px; font-size: .9em; padding: .15rem .4rem; }
    .md pre { background: var(--panel); border-radius: 8px; margin: 0 0 1.1rem; overflow-x: auto; padding: 1rem 1.2rem; }
    .md pre code { background: none; padding: 0; }
    .md img { border-radius: 8px; height: auto; margin: 1rem 0; max-width: 100%; }
    .md hr { border: none; border-top: 1px solid var(--border); margin: 1.8rem 0; }
    .md table { border-collapse: collapse; margin-bottom: 1.1rem; width: 100%; }
    .md th, .md td { border: 1px solid var(--border); padding: .5rem .75rem; text-align: left; }
    .md th { background: var(--panel); font-weight: 700; }
    .shell-footer {
      border-top: 1px solid var(--border);
      margin-top: 64px;
      padding: 24px;
      text-align: center;
      font-size: 12px;
      color: var(--subtle);
    }
    .shell-footer a { color: var(--subtle); text-decoration: none; }
    .shell-footer a:hover { color: var(--accent); }
  </style>
</head>
<body>
  <header class="shell-header">
    <span class="brand">
      <span class="brand-logo" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <line x1="6" x2="10" y1="11" y2="11"/><line x1="8" x2="8" y1="9" y2="13"/>
          <line x1="15" x2="15.01" y1="12" y2="12"/><line x1="18" x2="18.01" y1="10" y2="10"/>
          <path d="M17.32 5H6.68a4 4 0 0 0-3.978 3.59c-.006.052-.01.101-.017.152C2.604 9.416 2 14.456 2 16a3 3 0 0 0 3 3c1 0 1.5-.5 2-1l1.414-1.414A2 2 0 0 1 9.828 16h4.344a2 2 0 0 1 1.414.586L17 18c.5.5 1 1 2 1a3 3 0 0 0 3-3c0-1.545-.604-6.584-.685-7.258-.007-.05-.011-.1-.017-.151A4 4 0 0 0 17.32 5z"/>
        </svg>
      </span>
      <span>
        <span id="brand-text"></span>
        <span class="brand-sub">Game · Share · Life</span>
      </span>
    </span>
    <a class="back" href="/open-source">← 返回开源作品列表</a>
  </header>
  <main>
    <div id="status" class="status">正在加载开源作品…</div>
    <article id="project" hidden>
      <div class="head-row">
        <h1 id="p-name" class="g-title"></h1>
        <span id="p-stars" class="stars" hidden><b>★</b> <span id="p-star-count"></span> Stars</span>
      </div>
      <div id="p-chips" class="chips"></div>
      <blockquote id="p-summary" class="summary" hidden></blockquote>
      <div id="p-links" class="links"></div>
      <section id="sec-readme" hidden>
        <h2 class="section">README</h2>
        <div id="p-readme" class="md"></div>
      </section>
    </article>
  </main>
  <footer class="shell-footer">
    <p id="footer-copy"></p>
    <p>
      主题来源：
      <a href="https://github.com/StudyNoWeekend/novablog-web/tree/HEAD/game-diary" target="_blank" rel="noopener noreferrer">game-diary</a>
    </p>
  </footer>

  <script>
    (function () {
      "use strict";

      // API 地址解析：theme-config.js 注入（可携带 /api/v1 前缀）> 同域相对路径
      var injected = window.__NOVA_CONFIG__ && window.__NOVA_CONFIG__.apiBase;
      var siteRoot = injected
        ? injected.replace(/\/api\/v1\/?$/, "").replace(/\/$/, "")
        : "";
      var apiBase = siteRoot + "/api/v1";

      // 获取博主资料并更新品牌文字
      var blogTitle = "";
      fetch(apiBase + "/public/blogger", { headers: { Accept: "application/json" } })
        .then(function (r) { return r.json(); })
        .then(function (res) {
          if (res && res.code === 0 && res.data) {
            blogTitle = res.data.blog_title || "";
            var brand = document.getElementById("brand-text");
            if (brand) brand.textContent = blogTitle;
            var copy = document.getElementById("footer-copy");
            if (copy) copy.textContent = "© " + new Date().getFullYear() + " " + blogTitle + " · 用游戏记录热爱";
          }
        })
        .catch(function () { /* 静默失败 */ });

      // 从 URL 解析 id：/open-source/{id} | /open-source/{id}.html | /open-source/{id}/
      function parseId() {
        var m = location.pathname.match(/\/open-source\/([^/]+?)\.?html?\/?$/i) ||
                location.pathname.match(/\/open-source\/([^/]+?)\/?$/i);
        if (!m) return "";
        try {
          return decodeURIComponent(m[1]);
        } catch (e) {
          // 非法百分号编码：按无效地址处理，避免页面卡在加载态
          return "";
        }
      }

      function el(id) { return document.getElementById(id); }

      function escapeHtml(s) {
        return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;")
          .replace(/>/g, "&gt;").replace(/"/g, "&quot;");
      }

      // 链接/图片 URL 仅放行 http(s)://、//、/、#
      function safeUrl(u) {
        u = String(u || "").trim();
        if (/^(https?:\/\/|\/\/|\/|#)/i.test(u)) return u;
        return "#";
      }

      // ===== 极简 Markdown 渲染：先整体 HTML 转义再替换标记（防 XSS）=====
      function inlineMd(s) {
        // 行内代码
        s = s.replace(/`([^`]+)`/g, "<code>$1</code>");
        // 图片
        s = s.replace(/!\[([^\]]*)\]\(([^)\s]+)[^)]*\)/g, function (m, alt, src) {
          var u = safeUrl(src);
          return u === "#" ? "" : '<img src="' + u + '" alt="' + alt + '" loading="lazy" />';
        });
        // 链接
        s = s.replace(/\[([^\]]*)\]\(([^)\s]+)[^)]*\)/g, function (m, t, href) {
          var u = safeUrl(href);
          if (u === "#") return t;
          return '<a href="' + u + '" target="_blank" rel="noopener noreferrer">' + t + "</a>";
        });
        // 粗体 / 斜体
        s = s.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
        s = s.replace(/(^|[^*])\*([^*\s][^*]*)\*/g, "$1<em>$2</em>");
        return s;
      }

      function renderMarkdown(src) {
        var text = escapeHtml(String(src || "")).replace(/\r\n/g, "\n");
        var lines = text.split("\n");
        var html = "";
        var para = [];
        var listType = null;
        var inCode = false;

        function flushPara() {
          if (para.length) { html += "<p>" + para.map(inlineMd).join("<br>") + "</p>"; para = []; }
        }
        function closeList() {
          if (listType) { html += "</" + listType + ">"; listType = null; }
        }

        for (var i = 0; i < lines.length; i++) {
          var line = lines[i];
          if (/^```/.test(line)) {
            // 围栏代码块开/关
            if (inCode) { html += "</code></pre>"; inCode = false; }
            else { flushPara(); closeList(); html += "<pre><code>"; inCode = true; }
            continue;
          }
          if (inCode) { html += line + "\n"; continue; }

          if (!line.trim()) { flushPara(); closeList(); continue; }

          var hm = line.match(/^(#{1,6})\s+(.*)$/);
          if (hm) {
            flushPara(); closeList();
            var level = hm[1].length;
            html += "<h" + level + ">" + inlineMd(hm[2]) + "</h" + level + ">";
            continue;
          }
          if (/^(-{3,}|\*{3,})$/.test(line.trim())) { flushPara(); closeList(); html += "<hr>"; continue; }
          if (/^&gt;\s?/.test(line)) {
            flushPara(); closeList();
            html += "<blockquote>" + inlineMd(line.replace(/^&gt;\s?/, "")) + "</blockquote>";
            continue;
          }
          var ul = line.match(/^\s*[-*+]\s+(.*)$/);
          if (ul) {
            flushPara();
            if (listType !== "ul") { closeList(); html += "<ul>"; listType = "ul"; }
            html += "<li>" + inlineMd(ul[1]) + "</li>";
            continue;
          }
          var ol = line.match(/^\s*\d+[.)]\s+(.*)$/);
          if (ol) {
            flushPara();
            if (listType !== "ol") { closeList(); html += "<ol>"; listType = "ol"; }
            html += "<li>" + inlineMd(ol[1]) + "</li>";
            continue;
          }
          closeList();
          para.push(line);
        }
        if (inCode) html += "</code></pre>";
        flushPara();
        closeList();
        return html;
      }

      function showError(msg) {
        var s = el("status");
        s.className = "status error";
        s.innerHTML = msg + ' · <a href="/open-source">返回开源作品列表</a>';
      }

      function chip(text, cls) {
        return '<span class="chip ' + cls + '">' + escapeHtml(text) + "</span>";
      }

      function render(p) {
        var name = p.name || "开源作品";
        document.title = blogTitle ? name + " | " + blogTitle : name;
        el("p-name").textContent = name;

        if (p.stars > 0) {
          el("p-star-count").textContent = String(p.stars);
          el("p-stars").hidden = false;
        }

        var chips = "";
        if (p.language) chips += chip(p.language, "lang");
        String(p.topics || "").split(",").forEach(function (t) {
          t = t.trim();
          if (t) chips += chip(t, "topic");
        });
        if (chips) el("p-chips").innerHTML = chips;

        if (p.summary) {
          el("p-summary").textContent = p.summary;
          el("p-summary").hidden = false;
        }

        var links = "";
        if (p.repo_url && safeUrl(p.repo_url) !== "#") {
          links += '<a class="primary" href="' + safeUrl(p.repo_url) + '" target="_blank" rel="noopener noreferrer">仓库地址</a>';
        }
        if (p.homepage && safeUrl(p.homepage) !== "#") {
          links += '<a class="ghost" href="' + safeUrl(p.homepage) + '" target="_blank" rel="noopener noreferrer">项目主页</a>';
        }
        if (links) el("p-links").innerHTML = links;

        if (p.readme && String(p.readme).trim()) {
          el("sec-readme").hidden = false;
          el("p-readme").innerHTML = renderMarkdown(p.readme);
        }

        el("status").hidden = true;
        el("project").hidden = false;
      }

      var id = parseId();
      if (!id) { showError("无效的开源作品地址"); return; }

      fetch(apiBase + "/public/open-sources/" + encodeURIComponent(id), {
        headers: { Accept: "application/json" }
      })
        .then(function (r) { return r.json(); })
        .then(function (res) {
          if (res && res.code === 0 && res.data) { render(res.data); }
          else { showError((res && res.msg) || "开源作品不存在或已下架"); }
        })
        .catch(function () { showError("开源作品加载失败，请稍后重试"); });
    })();
  </script>
</body>
</html>
