<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- 动态内容壳页面：静态导出未预生成的旅行攻略详情由此页面客户端取数渲染（主题规范 3.4） -->
  <title>攻略加载中</title>
  <script src="/theme-config.js"></script>
  <style>
    :root {
      --bg: #0b0a14;
      --panel: #161327;
      --border: rgba(255, 255, 255, 0.08);
      --text: #f4f2ff;
      --muted: #9d97bc;
      --subtle: #6e688e;
      --accent: #a78bfa;
      --accent-2: #ec4899;
      --danger: #f87171;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    [hidden] { display: none !important; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      line-height: 1.8;
    }
    .shell-header {
      border-bottom: 1px solid var(--border);
      padding: 14px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(16, 14, 28, 0.85);
      backdrop-filter: blur(10px);
      position: sticky;
      top: 0;
      z-index: 10;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 800;
      font-size: 16px;
      letter-spacing: 0.02em;
    }
    .brand-logo {
      width: 38px; height: 38px;
      border-radius: 12px;
      background: linear-gradient(120deg, #8b5cf6 0%, #ec4899 100%);
      box-shadow: 0 0 24px rgba(139, 92, 246, 0.35);
      display: flex; align-items: center; justify-content: center;
    }
    .brand-logo svg { width: 22px; height: 22px; stroke: #fff; }
    .brand-sub {
      display: block;
      font-size: 9px;
      font-weight: 700;
      letter-spacing: 0.22em;
      color: var(--subtle);
      text-transform: uppercase;
    }
    .shell-header a.back { color: var(--muted); text-decoration: none; font-size: 14px; }
    .shell-header a.back:hover { color: var(--accent); }
    main { max-width: 860px; margin: 0 auto; padding: 32px 24px 96px; }
    .status {
      color: var(--muted);
      padding: 64px 0;
      text-align: center;
      letter-spacing: 0.05em;
    }
    .status.error { color: var(--danger); }
    .status.error a { color: var(--accent); }
    .hero {
      position: relative;
      border-radius: 18px;
      overflow: hidden;
      border: 1px solid var(--border);
      background: var(--panel);
      margin-bottom: 36px;
    }
    .hero img { width: 100%; aspect-ratio: 21/9; object-fit: cover; display: block; }
    .hero .ph { width: 100%; aspect-ratio: 21/9; }
    .hero .overlay {
      position: absolute; inset: 0;
      display: flex; flex-direction: column; justify-content: flex-end;
      padding: 24px 28px;
      background: linear-gradient(to top, rgba(0,0,0,.85), rgba(0,0,0,.35), transparent);
    }
    .hero .dest {
      font-size: 12px; font-weight: 700; letter-spacing: 0.2em;
      text-transform: uppercase; color: var(--accent); margin-bottom: 8px;
    }
    .hero h1 { font-size: 28px; line-height: 1.3; font-weight: 800; color: #fff; }
    .hero .meta { display: flex; flex-wrap: wrap; gap: 16px; margin-top: 10px; font-size: 14px; color: rgba(255,255,255,.8); }
    .hero.no-cover .overlay { position: static; padding: 28px; }
    .hero.no-cover .dest { color: var(--accent); }
    .hero.no-cover h1 { color: var(--text); }
    .hero.no-cover .meta { color: var(--muted); }
    .summary {
      border-left: 3px solid var(--accent);
      padding: 8px 20px;
      margin: 0 0 8px;
      color: var(--muted);
      font-style: italic;
    }
    h2.section { font-size: 24px; margin: 44px 0 18px; font-weight: 800; }
    .attraction {
      display: flex; gap: 16px;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 16px;
      margin-bottom: 16px;
    }
    .attraction img {
      width: 176px; aspect-ratio: 4/3; object-fit: cover;
      border-radius: 8px; flex-shrink: 0;
    }
    @media (max-width: 640px) { .attraction { flex-direction: column; } .attraction img { width: 100%; } }
    .attraction h3 { font-size: 17px; font-weight: 700; }
    .attraction p { font-size: 14px; color: var(--muted); margin-top: 8px; }
    .jump-chip {
      display: inline-flex; align-items: center; gap: 6px;
      margin-top: 12px;
      border: 1px solid var(--border); border-radius: 999px;
      background: var(--bg);
      color: var(--muted);
      font-size: 12px; text-decoration: none;
      padding: 6px 14px;
    }
    .jump-chip:hover { border-color: var(--accent); color: var(--accent); }
    .timeline { list-style: none; border-left: 2px solid rgba(139, 92, 246, 0.2); margin-left: 6px; padding-left: 24px; }
    .timeline li { position: relative; margin-bottom: 28px; }
    .timeline li::before {
      content: ""; position: absolute; left: -31px; top: 8px;
      width: 12px; height: 12px; border-radius: 50%;
      border: 2px solid var(--accent); background: var(--bg);
    }
    .timeline h3 { font-size: 15px; font-weight: 700; color: var(--accent); }
    .timeline p { font-size: 14px; color: var(--text); margin-top: 6px; }
    .review-card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px 18px;
      margin-bottom: 12px;
    }
    .review-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
    .review-head .name { font-size: 14px; font-weight: 600; }
    .review-head .stars { color: var(--accent-2); font-size: 13px; letter-spacing: 2px; }
    .review-card p { font-size: 14px; color: var(--text); margin-top: 8px; }
    .shell-footer {
      border-top: 1px solid var(--border);
      margin-top: 64px;
      padding: 24px;
      text-align: center;
      font-size: 12px;
      color: var(--subtle);
    }
    .shell-footer a { color: var(--subtle); text-decoration: none; }
    .shell-footer a:hover { color: var(--accent); }
  </style>
</head>
<body>
  <header class="shell-header">
    <span class="brand">
      <span class="brand-logo" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <line x1="6" x2="10" y1="11" y2="11"/><line x1="8" x2="8" y1="9" y2="13"/>
          <line x1="15" x2="15.01" y1="12" y2="12"/><line x1="18" x2="18.01" y1="10" y2="10"/>
          <path d="M17.32 5H6.68a4 4 0 0 0-3.978 3.59c-.006.052-.01.101-.017.152C2.604 9.416 2 14.456 2 16a3 3 0 0 0 3 3c1 0 1.5-.5 2-1l1.414-1.414A2 2 0 0 1 9.828 16h4.344a2 2 0 0 1 1.414.586L17 18c.5.5 1 1 2 1a3 3 0 0 0 3-3c0-1.545-.604-6.584-.685-7.258-.007-.05-.011-.1-.017-.151A4 4 0 0 0 17.32 5z"/>
        </svg>
      </span>
      <span>
        <span id="brand-text"></span>
        <span class="brand-sub">Game · Share · Life</span>
      </span>
    </span>
    <a class="back" href="/travels">← 返回攻略列表</a>
  </header>
  <main>
    <div id="status" class="status">正在加载攻略…</div>
    <article id="travel" hidden>
      <div class="hero" id="t-hero">
        <img id="t-cover" alt="" hidden />
        <div class="overlay">
          <p id="t-dest" class="dest" hidden></p>
          <h1 id="t-title"></h1>
          <div id="t-meta" class="meta"></div>
        </div>
      </div>
      <blockquote id="t-summary" class="summary" hidden></blockquote>
      <section id="sec-attractions" hidden>
        <h2 class="section">景点推荐</h2>
        <div id="t-attractions"></div>
      </section>
      <section id="sec-itinerary" hidden>
        <h2 class="section">行程安排</h2>
        <ol id="t-itinerary" class="timeline"></ol>
      </section>
      <section id="sec-reviews" hidden>
        <h2 class="section">旅行评价</h2>
        <div id="t-reviews"></div>
      </section>
    </article>
  </main>
  <footer class="shell-footer">
    <p id="footer-copy"></p>
    <p>
      主题来源：
      <a href="https://github.com/StudyNoWeekend/novablog-web/tree/HEAD/game-diary" target="_blank" rel="noopener noreferrer">游戏日记（game-diary）v0.5.1</a>
    </p>
  </footer>

  <script>
    (function () {
      "use strict";

      // API 地址解析：theme-config.js 注入（可携带 /api/v1 前缀）> 同域相对路径
      var injected = window.__NOVA_CONFIG__ && window.__NOVA_CONFIG__.apiBase;
      var siteRoot = injected
        ? injected.replace(/\/api\/v1\/?$/, "").replace(/\/$/, "")
        : "";
      var apiBase = siteRoot + "/api/v1";

      // 获取博主资料并更新品牌文字
      var blogTitle = "";
      fetch(apiBase + "/public/blogger", { headers: { Accept: "application/json" } })
        .then(function (r) { return r.json(); })
        .then(function (res) {
          if (res && res.code === 0 && res.data) {
            blogTitle = res.data.blog_title || "";
            var brand = document.getElementById("brand-text");
            if (brand) brand.textContent = blogTitle;
            var copy = document.getElementById("footer-copy");
            if (copy) copy.textContent = "© " + new Date().getFullYear() + " " + blogTitle + " · 用游戏记录热爱";
          }
        })
        .catch(function () { /* 静默失败 */ });

      // 从 URL 解析 id：/travels/{id} | /travels/{id}.html | /travels/{id}/
      function parseId() {
        var m = location.pathname.match(/\/travels\/([^/]+?)\.?html?\/?$/i) ||
                location.pathname.match(/\/travels\/([^/]+?)\/?$/i);
        if (!m) return "";
        try {
          return decodeURIComponent(m[1]);
        } catch (e) {
          // 非法百分号编码：按无效地址处理，避免页面卡在加载态
          return "";
        }
      }

      function el(id) { return document.getElementById(id); }

      function escapeHtml(s) {
        return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;")
          .replace(/>/g, "&gt;").replace(/"/g, "&quot;");
      }

      // 链接/图片 URL 仅放行 http(s)://、//、/、#
      function safeUrl(u) {
        u = String(u || "").trim();
        if (/^(https?:\/\/|\/\/|\/|#)/i.test(u)) return u;
        return "#";
      }

      // JSONB 防御式取值：按候选 key 依次取第一个非空字符串/数字
      function pickString(map, keys) {
        for (var i = 0; i < keys.length; i++) {
          var v = map[keys[i]];
          if (typeof v === "string" && v.trim()) return v;
          if (typeof v === "number") return String(v);
        }
        return "";
      }

      function pickNumber(map, keys) {
        for (var i = 0; i < keys.length; i++) {
          var v = map[keys[i]];
          if (typeof v === "number" && isFinite(v)) return v;
        }
        return 0;
      }

      // 按 coordType 生成对应地图平台的跳转链接（使用存储的原始坐标，不做坐标系转换）
      function mapJumpLink(attraction) {
        var lat = Number(attraction.latitude);
        var lng = Number(attraction.longitude);
        if (!isFinite(lat) || !isFinite(lng) || (lat === 0 && lng === 0)) return null;
        var coordType = String(attraction.coordType || attraction.coord_type || "").toLowerCase();
        var name = pickString(attraction, ["name", "title"]);
        if (coordType === "gcj02") {
          return {
            label: "在高德地图查看",
            url: "https://uri.amap.com/marker?position=" + lng + "," + lat +
              "&name=" + encodeURIComponent(name) + "&src=novablog&callnative=1"
          };
        }
        return {
          label: "在 Google 地图查看",
          url: "https://www.google.com/maps/search/?api=1&query=" + lat + "," + lng
        };
      }

      function showError(msg) {
        var s = el("status");
        s.className = "status error";
        s.innerHTML = msg + ' · <a href="/travels">返回攻略列表</a>';
      }

      function render(t) {
        var title = t.title || "旅行攻略";
        document.title = blogTitle ? title + " | " + blogTitle : title;
        el("t-title").textContent = title;

        // hero：无封面时叠加信息改为普通文档流展示
        if (t.cover_image) {
          var c = el("t-cover");
          c.src = safeUrl(t.cover_image);
          c.hidden = false;
        } else {
          el("t-hero").className = "hero no-cover";
        }

        var dest = [t.destination, t.region].filter(function (v) { return v && String(v).trim(); }).join(" · ");
        if (dest) {
          el("t-dest").textContent = dest;
          el("t-dest").hidden = false;
        }

        var meta = [];
        if (t.days > 0) meta.push(escapeHtml(t.days) + " 天");
        if (t.best_month) meta.push("最佳月份 " + escapeHtml(t.best_month));
        if (t.rating > 0) {
          meta.push("★ " + Number(t.rating).toFixed(1) + (t.review_count > 0 ? " (" + escapeHtml(t.review_count) + " 条评价)" : ""));
        }
        if (meta.length) el("t-meta").innerHTML = meta.join(" ");

        if (t.summary && String(t.summary).trim()) {
          el("t-summary").textContent = t.summary;
          el("t-summary").hidden = false;
        }

        // 景点推荐
        var attractions = Array.isArray(t.attractions) ? t.attractions : [];
        if (attractions.length > 0) {
          el("t-attractions").innerHTML = attractions.map(function (a, i) {
            var image = pickString(a, ["image", "cover_image", "image_url", "cover", "pic", "photo"]);
            var name = pickString(a, ["name", "title"]);
            var desc = pickString(a, ["description", "content", "intro", "summary", "text"]);
            var jump = mapJumpLink(a);
            var html = '<div class="attraction">' +
              (image ? '<img src="' + safeUrl(image) + '" alt="' + escapeHtml(name || "景点 " + (i + 1)) + '" loading="lazy" />' : "") +
              '<div class="attraction-body"><h3>' + escapeHtml(name || "景点 " + (i + 1)) + "</h3>" +
              (desc ? "<p>" + escapeHtml(desc) + "</p>" : "") +
              (jump ? '<a class="jump-chip" href="' + safeUrl(jump.url) + '" target="_blank" rel="noopener noreferrer">' + escapeHtml(jump.label) + "</a>" : "") +
              "</div></div>";
            return html;
          }).join("");
          el("sec-attractions").hidden = false;
        }

        // 行程安排（时间线）
        var itinerary = Array.isArray(t.itinerary) ? t.itinerary : [];
        if (itinerary.length > 0) {
          el("t-itinerary").innerHTML = itinerary.map(function (item, i) {
            var label = pickString(item, ["day", "day_label", "dayLabel", "label", "title", "name"]);
            var desc = pickString(item, ["description", "content", "detail", "summary", "text"]);
            return "<li>" +
              (label ? "<h3>" + escapeHtml(label) + "</h3>" : "") +
              (desc ? "<p>" + escapeHtml(desc) + "</p>" : "") +
              "</li>";
          }).join("");
          el("sec-itinerary").hidden = false;
        }

        // 旅行评价
        var reviews = Array.isArray(t.reviews) ? t.reviews : [];
        if (reviews.length > 0) {
          el("t-reviews").innerHTML = reviews.map(function (r) {
            var author = pickString(r, ["nickname", "user", "author", "name", "reviewer"]);
            var rating = pickNumber(r, ["rating", "score", "star", "stars"]);
            var content = pickString(r, ["content", "comment", "text", "description", "review"]);
            var stars = rating > 0 ? "★".repeat(Math.max(0, Math.min(5, Math.round(rating)))) : "";
            return '<div class="review-card"><div class="review-head">' +
              '<span class="name">' + escapeHtml(author || "匿名旅行者") + "</span>" +
              (stars ? '<span class="stars">' + stars + "</span>" : "") +
              "</div>" +
              (content ? "<p>" + escapeHtml(content) + "</p>" : "") +
              "</div>";
          }).join("");
          el("sec-reviews").hidden = false;
        }

        el("status").hidden = true;
        el("travel").hidden = false;
      }

      var id = parseId();
      if (!id) { showError("无效的攻略地址"); return; }

      fetch(apiBase + "/public/travels/" + encodeURIComponent(id), {
        headers: { Accept: "application/json" }
      })
        .then(function (r) { return r.json(); })
        .then(function (res) {
          if (res && res.code === 0 && res.data) { render(res.data); }
          else { showError((res && res.msg) || "攻略不存在或已下架"); }
        })
        .catch(function () { showError("攻略加载失败，请稍后重试"); });
    })();
  </script>
</body>
</html>
