<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- 动态内容壳页面：静态导出未预生成的菜谱详情由此页面客户端取数渲染（主题规范 3.4） -->
  <title>菜谱加载中</title>
  <script src="/theme-config.js"></script>
  <style>
    :root {
      --bg: #0b0a14;
      --panel: #161327;
      --border: rgba(255, 255, 255, 0.08);
      --text: #f4f2ff;
      --muted: #9d97bc;
      --subtle: #6e688e;
      --accent: #a78bfa;
      --accent-2: #ec4899;
      --danger: #f87171;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    [hidden] { display: none !important; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      line-height: 1.8;
    }
    .shell-header {
      border-bottom: 1px solid var(--border);
      padding: 14px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(16, 14, 28, 0.85);
      backdrop-filter: blur(10px);
      position: sticky;
      top: 0;
      z-index: 10;
    }
    .brand { display: flex; align-items: center; gap: 10px; font-weight: 800; font-size: 16px; }
    .brand-logo {
      width: 38px; height: 38px; border-radius: 12px;
      background: linear-gradient(120deg, #8b5cf6 0%, #ec4899 100%);
      box-shadow: 0 0 24px rgba(139, 92, 246, 0.35);
      display: flex; align-items: center; justify-content: center;
    }
    .brand-logo svg { width: 22px; height: 22px; stroke: #fff; }
    .brand-sub {
      display: block; font-size: 9px; font-weight: 700;
      letter-spacing: 0.22em; color: var(--subtle); text-transform: uppercase;
    }
    .shell-header a.back { color: var(--muted); text-decoration: none; font-size: 14px; }
    .shell-header a.back:hover { color: var(--accent); }
    main { max-width: 860px; margin: 0 auto; padding: 40px 24px 96px; }
    .status { color: var(--muted); padding: 64px 0; text-align: center; }
    .status.error { color: var(--danger); }
    .status.error a { color: var(--accent); }
    .cover {
      position: relative;
      aspect-ratio: 21 / 9;
      border-radius: 18px;
      overflow: hidden;
      border: 1px solid var(--border);
      background: linear-gradient(135deg, #221a44 0%, #171233 60%, #0d0b1a 100%);
      margin-bottom: 32px;
    }
    .cover img { width: 100%; height: 100%; object-fit: cover; }
    .cover .ph {
      position: absolute; inset: 0;
      display: flex; align-items: center; justify-content: center;
      color: var(--subtle); font-size: 14px;
    }
    .cover img + .ph { display: none; }
    .difficulty {
      display: inline-block;
      background: linear-gradient(120deg, #8b5cf6 0%, #ec4899 100%);
      color: #fff; font-size: 12px; font-weight: 700;
      border-radius: 999px; padding: 3px 12px; margin-bottom: 10px;
      box-shadow: 0 0 24px rgba(139, 92, 246, 0.35);
    }
    h1.g-title { font-size: 32px; line-height: 1.3; font-weight: 800; }
    .facts { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 20px; color: var(--muted); font-size: 14px; margin-top: 12px; }
    .tags { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 16px; }
    .tag {
      border: 1px solid rgba(139, 92, 246, 0.25); background: rgba(139, 92, 246, 0.14);
      color: var(--accent); border-radius: 999px; padding: 2px 12px; font-size: 12px;
    }
    blockquote.summary {
      border-left: 2px solid var(--accent);
      padding: 4px 20px;
      margin: 24px 0 0;
      color: var(--muted);
      font-style: italic;
    }
    h2.section { font-size: 24px; margin: 44px 0 18px; font-weight: 800; }
    .ingredients { list-style: none; display: grid; grid-template-columns: 1fr; gap: 10px; }
    @media (min-width: 640px) { .ingredients { grid-template-columns: 1fr 1fr; } }
    .ingredients li {
      display: flex; align-items: baseline; justify-content: space-between; gap: 12px;
      border: 1px solid var(--border); background: var(--panel);
      border-radius: 8px; padding: 10px 16px; font-size: 14px;
    }
    .ingredients .amount { color: var(--muted); white-space: nowrap; }
    .steps { list-style: none; display: flex; flex-direction: column; gap: 32px; }
    .steps li { display: flex; gap: 16px; }
    .step-no {
      flex-shrink: 0; width: 32px; height: 32px; border-radius: 999px;
      display: flex; align-items: center; justify-content: center;
      background: rgba(139, 92, 246, 0.14); color: var(--accent);
      font-size: 14px; font-weight: 700;
    }
    .step-body { flex: 1; min-width: 0; }
    .step-body p { white-space: pre-wrap; color: #ded9f2; }
    .step-body img {
      display: block; width: 100%; aspect-ratio: 16 / 9; object-fit: cover;
      border-radius: 14px; border: 1px solid var(--border); margin-top: 16px;
    }
    .shell-footer {
      border-top: 1px solid var(--border);
      margin-top: 64px;
      padding: 24px;
      text-align: center;
      font-size: 12px;
      color: var(--subtle);
    }
    .shell-footer a { color: var(--subtle); text-decoration: none; }
    .shell-footer a:hover { color: var(--accent); }
  </style>
</head>
<body>
  <header class="shell-header">
    <span class="brand">
      <span class="brand-logo" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <line x1="6" x2="10" y1="11" y2="11"/><line x1="8" x2="8" y1="9" y2="13"/>
          <line x1="15" x2="15.01" y1="12" y2="12"/><line x1="18" x2="18.01" y1="10" y2="10"/>
          <path d="M17.32 5H6.68a4 4 0 0 0-3.978 3.59c-.006.052-.01.101-.017.152C2.604 9.416 2 14.456 2 16a3 3 0 0 0 3 3c1 0 1.5-.5 2-1l1.414-1.414A2 2 0 0 1 9.828 16h4.344a2 2 0 0 1 1.414.586L17 18c.5.5 1 1 2 1a3 3 0 0 0 3-3c0-1.545-.604-6.584-.685-7.258-.007-.05-.011-.1-.017-.151A4 4 0 0 0 17.32 5z"/>
        </svg>
      </span>
      <span>
        <span id="brand-text"></span>
        <span class="brand-sub">Game · Share · Life</span>
      </span>
    </span>
    <a class="back" href="/recipes">← 返回菜谱列表</a>
  </header>
  <main>
    <div id="status" class="status">正在加载菜谱…</div>
    <article id="recipe" hidden>
      <div class="cover">
        <img id="r-cover" alt="" hidden />
        <div class="ph">暂无封面</div>
      </div>
      <span id="r-difficulty" class="difficulty" hidden></span>
      <h1 id="r-title" class="g-title"></h1>
      <div id="r-facts" class="facts" hidden></div>
      <div id="r-tags" class="tags" hidden></div>
      <blockquote id="r-summary" class="summary" hidden></blockquote>
      <section id="sec-ingredients" hidden>
        <h2 class="section">食材清单</h2>
        <ul id="r-ingredients" class="ingredients"></ul>
      </section>
      <section id="sec-steps" hidden>
        <h2 class="section">制作步骤</h2>
        <ol id="r-steps" class="steps"></ol>
      </section>
    </article>
  </main>
  <footer class="shell-footer">
    <p id="footer-copy"></p>
    <p>
      主题来源：
      <a href="https://github.com/StudyNoWeekend/novablog-web/tree/HEAD/game-diary" target="_blank" rel="noopener noreferrer">game-diary</a>
    </p>
  </footer>

  <script>
    (function () {
      "use strict";

      // API 地址解析：theme-config.js 注入（可携带 /api/v1 前缀）> 同域相对路径
      var injected = window.__NOVA_CONFIG__ && window.__NOVA_CONFIG__.apiBase;
      var siteRoot = injected
        ? injected.replace(/\/api\/v1\/?$/, "").replace(/\/$/, "")
        : "";
      var apiBase = siteRoot + "/api/v1";

      // 获取博主资料并更新品牌文字
      var blogTitle = "";
      fetch(apiBase + "/public/blogger", { headers: { Accept: "application/json" } })
        .then(function (r) { return r.json(); })
        .then(function (res) {
          if (res && res.code === 0 && res.data) {
            blogTitle = res.data.blog_title || "";
            var brand = document.getElementById("brand-text");
            if (brand) brand.textContent = blogTitle;
            var copy = document.getElementById("footer-copy");
            if (copy) copy.textContent = "© " + new Date().getFullYear() + " " + blogTitle + " · 用游戏记录热爱";
          }
        })
        .catch(function () { /* 静默失败 */ });

      // 从 URL 解析 id：/recipes/{id} | /recipes/{id}.html | /recipes/{id}/
      function parseId() {
        var m = location.pathname.match(/\/recipes\/([^/]+?)\.?html?\/?$/i) ||
                location.pathname.match(/\/recipes\/([^/]+?)\/?$/i);
        if (!m) return "";
        try {
          return decodeURIComponent(m[1]);
        } catch (e) {
          // 非法百分号编码：按无效地址处理，避免页面卡在加载态
          return "";
        }
      }

      function el(id) { return document.getElementById(id); }

      function escapeHtml(s) {
        return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;")
          .replace(/>/g, "&gt;").replace(/"/g, "&quot;");
      }

      // 链接/图片 URL 仅放行 http(s)://、//、/、#
      function safeUrl(u) {
        u = String(u || "").trim();
        if (/^(https?:\/\/|\/\/|\/|#)/i.test(u)) return u;
        return "#";
      }

      // 封面/步骤图为相对路径：非 http(s) 开头时拼接「站点根 + /files/ + 路径」
      function fileUrl(u) {
        u = String(u || "").trim();
        if (!u) return "";
        if (/^(https?:\/\/|\/\/|\/|#)/i.test(u)) return safeUrl(u);
        return siteRoot + "/files/" + u.replace(/^\/+/, "");
      }

      var DIFFICULTY_LABELS = { 1: "简单", 2: "中等", 3: "困难" };

      function showError(msg) {
        var s = el("status");
        s.className = "status error";
        s.innerHTML = msg + ' · <a href="/recipes">返回菜谱列表</a>';
      }

      function render(r) {
        var title = r.title || "菜谱";
        document.title = blogTitle ? title + " | " + blogTitle : title;
        el("r-title").textContent = title;

        if (r.cover) {
          var c = el("r-cover");
          c.src = fileUrl(r.cover);
          c.hidden = false;
        }

        var difficulty = DIFFICULTY_LABELS[r.difficulty];
        if (difficulty) {
          el("r-difficulty").textContent = difficulty;
          el("r-difficulty").hidden = false;
        }

        var facts = [];
        if (r.minutes > 0) facts.push("⏱ " + escapeHtml(r.minutes) + " 分钟");
        if (r.servings > 0) facts.push("🍚 " + escapeHtml(r.servings) + " 人份");
        if (facts.length) {
          el("r-facts").innerHTML = facts.join("");
          el("r-facts").hidden = false;
        }

        var tags = "";
        String(r.tags || "").split(",").forEach(function (t) {
          t = t.trim();
          if (t) tags += '<span class="tag">#' + escapeHtml(t) + "</span>";
        });
        if (tags) {
          el("r-tags").innerHTML = tags;
          el("r-tags").hidden = false;
        }

        if (r.summary) {
          el("r-summary").textContent = r.summary;
          el("r-summary").hidden = false;
        }

        var ingredients = Array.isArray(r.ingredients) ? r.ingredients : [];
        if (ingredients.length > 0) {
          var items = "";
          ingredients.forEach(function (item) {
            items += "<li><span>" + escapeHtml(item.name) + "</span>" +
              (item.amount ? '<span class="amount">' + escapeHtml(item.amount) + "</span>" : "") +
              "</li>";
          });
          el("r-ingredients").innerHTML = items;
          el("sec-ingredients").hidden = false;
        }

        var steps = Array.isArray(r.steps) ? r.steps : [];
        if (steps.length > 0) {
          var stepItems = "";
          steps.forEach(function (step, index) {
            stepItems += '<li><span class="step-no">' + (index + 1) + '</span>' +
              '<div class="step-body"><p>' + escapeHtml(step.text) + "</p>" +
              (step.image ? '<img src="' + fileUrl(step.image) + '" alt="步骤 ' + (index + 1) + '" loading="lazy" />' : "") +
              "</div></li>";
          });
          el("r-steps").innerHTML = stepItems;
          el("sec-steps").hidden = false;
        }

        el("status").hidden = true;
        el("recipe").hidden = false;
      }

      var id = parseId();
      if (!id) { showError("无效的菜谱地址"); return; }

      fetch(apiBase + "/public/recipes/" + encodeURIComponent(id), {
        headers: { Accept: "application/json" }
      })
        .then(function (r) { return r.json(); })
        .then(function (res) {
          if (res && res.code === 0 && res.data) { render(res.data); }
          else { showError((res && res.msg) || "菜谱不存在或已下架"); }
        })
        .catch(function () { showError("菜谱加载失败，请稍后重试"); });
    })();
  </script>
</body>
</html>
