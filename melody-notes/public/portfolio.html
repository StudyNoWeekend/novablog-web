<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- 动态内容壳页面：静态导出未预生成的作品集详情由此页面客户端取数渲染（主题规范 3.4） -->
  <title>作品集加载中</title>
  <script src="/theme-config.js"></script>
  <style>
    :root {
      --bg: #0c1310;
      --bg-soft: #101815;
      --panel: #16211c;
      --panel-2: #1b2822;
      --border: rgba(255, 255, 255, 0.08);
      --text: #f0f6f1;
      --text-2: #dde8df;
      --muted: #9cb1a4;
      --subtle: #6c8275;
      --accent: #9ed0b0;
      --accent-strong: #d9ebde;
      --on-accent: #10241a;
      --danger: #e08a8a;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    [hidden] { display: none !important; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: ui-sans-serif, system-ui, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      line-height: 1.8;
    }
    .script { font-family: "Segoe Script", "Bradley Hand", "Comic Sans MS", cursive; }
    .shell-header {
      border-bottom: 1px solid var(--border);
      background: var(--bg-soft);
      padding: 16px 28px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .brand {
      font-size: 24px;
      line-height: 1;
      color: var(--text);
      text-decoration: none;
    }
    .brand em { color: var(--accent); font-style: normal; }
    .shell-header nav { display: flex; align-items: center; gap: 18px; font-size: 14px; }
    .shell-header nav a { color: var(--muted); text-decoration: none; transition: color .2s ease; }
    .shell-header nav a:hover { color: var(--accent); }
    main { max-width: 1080px; margin: 0 auto; padding: 32px 24px 88px; }
    .status {
      color: var(--muted);
      padding: 64px 0;
      text-align: center;
      letter-spacing: 0.05em;
    }
    .status.error { color: var(--danger); }
    .status.error a { color: var(--accent); }
    .back-link {
      display: inline-flex; align-items: center; gap: 6px;
      color: var(--muted); text-decoration: none; font-size: 14px;
    }
    .back-link:hover { color: var(--accent); }
    .hero {
      position: relative;
      border-radius: 16px;
      overflow: hidden;
      border: 1px solid var(--border);
      margin-top: 20px;
      background: var(--panel);
    }
    .hero img { width: 100%; aspect-ratio: 21/9; object-fit: cover; display: block; }
    .hero .ph { width: 100%; aspect-ratio: 21/9; }
    .badge {
      display: inline-block;
      background: var(--accent);
      color: var(--on-accent);
      font-size: 12px;
      font-weight: 600;
      border-radius: 999px;
      padding: 3px 12px;
      margin: 24px 0 0;
    }
    h1 { font-size: 30px; line-height: 1.35; margin-top: 12px; }
    .desc { color: var(--muted); margin-top: 12px; max-width: 760px; }
    h2.section {
      font-size: 24px;
      color: var(--text);
      margin: 44px 0 18px;
      padding-top: 32px;
      border-top: 1px solid var(--border);
    }
    h2.section .count { font-size: 14px; font-weight: 400; color: var(--muted); margin-left: 10px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 20px; }
    .item {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 16px;
      overflow: hidden;
    }
    .item .cover { position: relative; aspect-ratio: 1/1; background: var(--panel-2); }
    .item .cover img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .item .cap { padding: 12px 14px; }
    .item .cap .t { font-size: 14px; font-weight: 600; color: var(--text); }
    .item .cap .d {
      font-size: 12px; color: var(--muted); margin-top: 4px;
      display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
    }
    .shell-footer {
      border-top: 1px solid var(--border);
      padding: 22px 28px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      font-size: 12px;
      color: var(--subtle);
    }
    .shell-footer .slogan { font-size: 20px; color: var(--muted); }
    .shell-footer .slogan em { color: var(--accent); font-style: normal; }
    .shell-footer a { color: var(--muted); text-decoration: none; }
    .shell-footer a:hover { color: var(--accent); }
  </style>
</head>
<body>
  <header class="shell-header">
    <a class="brand script" id="brand-link" href="/"><span id="brand-text">Melody Notes</span> <em>♫</em></a>
    <nav>
      <a href="/">首页</a>
      <a href="/portfolio">作品集</a>
      <a href="/articles">文章</a>
      <a href="/about">关于我</a>
    </nav>
  </header>
  <main>
    <a class="back-link" href="/portfolio">← 返回作品集</a>
    <div id="status" class="status">正在加载作品集…</div>
    <article id="portfolio" hidden>
      <div class="hero">
        <img id="p-cover" alt="" hidden />
        <div id="p-cover-ph" class="ph"></div>
      </div>
      <span id="p-category" class="badge" hidden></span>
      <h1 id="p-name"></h1>
      <p id="p-desc" class="desc" hidden></p>
      <section id="sec-items" hidden>
        <h2 class="section">作品一览<span class="count" id="p-count"></span></h2>
        <div id="p-grid" class="grid"></div>
      </section>
    </article>
  </main>

  <footer class="shell-footer">
    <span class="slogan script">Good Music, Better Life <em>♪</em></span>
    <span id="footer-copy"></span>
    <span id="footer-theme"></span>
  </footer>

  <script>
    (function () {
      "use strict";

      // API 地址解析：theme-config.js 注入（可携带 /api/v1 前缀）> 同域相对路径
      var injected = window.__NOVA_CONFIG__ && window.__NOVA_CONFIG__.apiBase;
      var siteRoot = injected
        ? injected.replace(/\/api\/v1\/?$/, "").replace(/\/$/, "")
        : "";
      var apiBase = siteRoot + "/api/v1";

      // 页脚：主题来源链接（与 theme.json homepage 一致）
      var THEME_HOMEPAGE = "https://github.com/StudyNoWeekend/novablog-web/tree/HEAD/melody-notes";
      var THEME_VERSION = "0.5.1";
      var footerTheme = document.getElementById("footer-theme");
      footerTheme.innerHTML =
        '主题来源：<a href="' +
        THEME_HOMEPAGE + '" target="_blank" rel="noopener noreferrer">旋律笔记（melody-notes）v' + THEME_VERSION + "</a>";

      // 获取博主资料并更新品牌文字与页脚署名
      var blogTitle = "";
      fetch(apiBase + "/public/blogger", { headers: { Accept: "application/json" } })
        .then(function (r) { return r.json(); })
        .then(function (res) {
          if (res && res.code === 0 && res.data) {
            blogTitle = res.data.blog_title || "";
            var brand = document.getElementById("brand-text");
            if (brand && blogTitle) brand.textContent = blogTitle;
            var copy = document.getElementById("footer-copy");
            if (copy) {
              copy.textContent = "© " + new Date().getFullYear() +
                (res.data.nickname ? " " + res.data.nickname : "") +
                (res.data.blog_description ? " · " + res.data.blog_description : "");
            }
          }
        })
        .catch(function () { /* 静默失败 */ });

      // 从 URL 解析 id：/portfolio/{id} | /portfolio/{id}.html | /portfolio/{id}/
      function parseId() {
        var m = location.pathname.match(/\/portfolio\/([^/]+?)\.?html?\/?$/i) ||
                location.pathname.match(/\/portfolio\/([^/]+?)\/?$/i);
        if (!m) return "";
        try {
          return decodeURIComponent(m[1]);
        } catch (e) {
          // 非法百分号编码：按无效地址处理，避免页面卡在加载态
          return "";
        }
      }

      function el(id) { return document.getElementById(id); }

      function escapeHtml(s) {
        return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;")
          .replace(/>/g, "&gt;").replace(/"/g, "&quot;");
      }

      // 链接/图片 URL 仅放行 http(s)://、//、/、#
      function safeUrl(u) {
        u = String(u || "").trim();
        if (/^(https?:\/\/|\/\/|\/|#)/i.test(u)) return u;
        return "#";
      }

      function showError(msg) {
        var s = el("status");
        s.className = "status error";
        s.innerHTML = msg + ' · <a href="/portfolio">返回作品集</a>';
      }

      function render(p) {
        var title = p.name || "作品集";
        document.title = blogTitle ? title + " | " + blogTitle : title;
        el("p-name").textContent = title;

        if (p.cover_url) {
          var c = el("p-cover");
          c.src = safeUrl(p.cover_url);
          c.hidden = false;
          el("p-cover-ph").style.display = "none";
        }

        if (p.category_name) {
          el("p-category").textContent = escapeHtml(p.category_name);
          el("p-category").hidden = false;
        }

        if (p.description && String(p.description).trim()) {
          el("p-desc").textContent = p.description;
          el("p-desc").hidden = false;
        }

        var items = Array.isArray(p.items) ? p.items : [];
        if (items.length > 0) {
          el("p-count").textContent = items.length + " 个作品";
          el("p-grid").innerHTML = items.map(function (item, i) {
            var t = item.title || "作品 " + (i + 1);
            var img = item.output_url
              ? '<img src="' + safeUrl(item.output_url) + '" alt="' + escapeHtml(t) + '" loading="lazy" />'
              : "";
            var d = item.description
              ? '<p class="d">' + escapeHtml(item.description) + "</p>"
              : "";
            return '<figure class="item"><div class="cover">' + img +
              '</div><figcaption class="cap"><p class="t">' + escapeHtml(t) + "</p>" + d +
              "</figcaption></figure>";
          }).join("");
          el("sec-items").hidden = false;
        }

        el("status").hidden = true;
        el("portfolio").hidden = false;
      }

      var id = parseId();
      if (!id) { showError("无效的作品集地址"); return; }

      fetch(apiBase + "/public/portfolios/" + encodeURIComponent(id), {
        headers: { Accept: "application/json" }
      })
        .then(function (r) { return r.json(); })
        .then(function (res) {
          if (res && res.code === 0 && res.data) { render(res.data); }
          else { showError((res && res.msg) || "作品集不存在或已下架"); }
        })
        .catch(function () { showError("作品集加载失败，请稍后重试"); });
    })();
  </script>
</body>
</html>
