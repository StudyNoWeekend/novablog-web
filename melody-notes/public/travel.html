<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- 动态内容壳页面：静态导出未预生成的旅行攻略详情由此页面客户端取数渲染（主题规范 3.4） -->
  <title>旅行攻略加载中</title>
  <script src="/theme-config.js"></script>
  <style>
    :root {
      --bg: #0c1310;
      --bg-soft: #101815;
      --panel: #16211c;
      --panel-2: #1b2822;
      --border: rgba(255, 255, 255, 0.08);
      --text: #f0f6f1;
      --text-2: #dde8df;
      --muted: #9cb1a4;
      --subtle: #6c8275;
      --accent: #9ed0b0;
      --accent-strong: #d9ebde;
      --on-accent: #10241a;
      --danger: #e08a8a;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    [hidden] { display: none !important; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: ui-sans-serif, system-ui, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      line-height: 1.8;
    }
    .script { font-family: "Segoe Script", "Bradley Hand", "Comic Sans MS", cursive; }
    .shell-header {
      border-bottom: 1px solid var(--border);
      background: var(--bg-soft);
      padding: 16px 28px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .brand {
      font-size: 24px;
      line-height: 1;
      color: var(--text);
      text-decoration: none;
    }
    .brand em { color: var(--accent); font-style: normal; }
    .shell-header nav { display: flex; align-items: center; gap: 18px; font-size: 14px; }
    .shell-header nav a { color: var(--muted); text-decoration: none; transition: color .2s ease; }
    .shell-header nav a:hover { color: var(--accent); }
    main { max-width: 920px; margin: 0 auto; padding: 32px 24px 88px; }
    .status {
      color: var(--muted);
      padding: 64px 0;
      text-align: center;
      letter-spacing: 0.05em;
    }
    .status.error { color: var(--danger); }
    .status.error a { color: var(--accent); }
    .back-link {
      display: inline-flex; align-items: center; gap: 6px;
      color: var(--muted); text-decoration: none; font-size: 14px;
    }
    .back-link:hover { color: var(--accent); }
    .hero {
      position: relative;
      border-radius: 16px;
      overflow: hidden;
      border: 1px solid var(--border);
      margin-top: 20px;
      background: var(--panel);
    }
    .hero img { width: 100%; aspect-ratio: 21/9; object-fit: cover; display: block; }
    .hero .ph { width: 100%; aspect-ratio: 21/9; }
    .hero .overlay {
      position: absolute; inset: 0;
      background: linear-gradient(to top, rgba(0,0,0,.8), rgba(0,0,0,.3) 45%, transparent);
      display: flex; flex-direction: column; justify-content: flex-end;
      padding: 24px 28px;
    }
    .hero .dest {
      display: flex; align-items: center; gap: 6px;
      font-size: 12px; letter-spacing: .2em; text-transform: uppercase;
      color: rgba(255,255,255,.9); margin-bottom: 8px;
    }
    .hero h1 { font-size: 28px; line-height: 1.35; color: #fff; max-width: 720px; }
    .hero .meta { display: flex; flex-wrap: wrap; gap: 6px 16px; margin-top: 10px; font-size: 14px; color: rgba(255,255,255,.85); }
    .hero .meta .star { color: var(--accent); }
    .action-bar { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; margin: 24px 0 0; }
    .btn-like {
      display: inline-flex; align-items: center; gap: 8px;
      min-height: 44px; padding: 0 20px;
      border: 1px solid var(--border); border-radius: 999px;
      background: var(--panel); color: var(--text-2);
      font-size: 14px; font-weight: 500; cursor: pointer;
      transition: all .2s ease;
    }
    .btn-like:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
    .btn-like.liked { border-color: var(--accent); background: rgba(158, 208, 176, 0.12); color: var(--accent); cursor: default; }
    .btn-like:disabled { cursor: default; }
    .view-pill {
      display: inline-flex; align-items: center; gap: 8px;
      min-height: 44px; padding: 0 20px;
      border: 1px solid var(--border); border-radius: 999px;
      background: var(--panel); color: var(--muted); font-size: 14px;
    }
    .summary-quote {
      border-left: 3px solid var(--accent);
      background: rgba(158, 208, 176, 0.06);
      border-radius: 0 12px 12px 0;
      padding: 12px 16px;
      margin: 28px 0 0;
      color: var(--text-2);
      font-style: italic;
    }
    h2.section { font-size: 24px; margin: 52px 0 20px; color: var(--text); }
    h2.section .sub {
      font-family: "Segoe Script", "Bradley Hand", cursive;
      font-size: 19px; font-weight: 500; color: rgba(158, 208, 176, 0.7);
      margin-left: 10px;
    }
    .attraction {
      display: flex; gap: 16px;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 18px;
      margin-bottom: 18px;
    }
    @media (max-width: 640px) { .attraction { flex-direction: column; } }
    .attraction .pic {
      width: 176px; aspect-ratio: 4/3; flex-shrink: 0;
      border-radius: 12px; overflow: hidden; background: var(--panel-2);
    }
    @media (max-width: 640px) { .attraction .pic { width: 100%; } }
    .attraction .pic img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .attraction h3 { font-size: 18px; color: var(--text); }
    .attraction .desc { font-size: 14px; color: var(--muted); margin-top: 8px; }
    .map-chip {
      display: inline-flex; align-items: center; gap: 6px;
      margin-top: 12px; padding: 6px 14px;
      border: 1px solid var(--border); border-radius: 999px;
      background: var(--bg-soft); color: var(--muted);
      font-size: 12px; text-decoration: none;
      transition: color .2s ease, border-color .2s ease;
    }
    .map-chip:hover { color: var(--accent); border-color: var(--accent); }
    .timeline { list-style: none; border-left: 2px solid rgba(158, 208, 176, 0.2); margin-left: 6px; padding-left: 24px; }
    .timeline li { position: relative; margin-bottom: 28px; }
    .timeline li::before {
      content: ""; position: absolute; left: -31px; top: 8px;
      width: 12px; height: 12px; border-radius: 50%;
      border: 2px solid var(--accent); background: var(--bg);
    }
    .timeline h3 { font-size: 16px; font-weight: 600; color: var(--accent); }
    .timeline p { font-size: 14px; color: var(--text-2); margin-top: 6px; }
    .review-card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 18px 20px;
      margin-bottom: 14px;
    }
    .review-head { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px; }
    .review-head .name { font-size: 14px; font-weight: 600; color: var(--text); }
    .stars { color: var(--accent); font-size: 13px; letter-spacing: 2px; }
    .stars .off { color: var(--subtle); }
    .review-card .content { font-size: 14px; color: var(--text-2); margin-top: 8px; }
    .shell-footer {
      border-top: 1px solid var(--border);
      padding: 22px 28px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      font-size: 12px;
      color: var(--subtle);
    }
    .shell-footer .slogan { font-size: 20px; color: var(--muted); }
    .shell-footer .slogan em { color: var(--accent); font-style: normal; }
    .shell-footer a { color: var(--muted); text-decoration: none; }
    .shell-footer a:hover { color: var(--accent); }
  </style>
</head>
<body>
  <header class="shell-header">
    <a class="brand script" id="brand-link" href="/"><span id="brand-text">Melody Notes</span> <em>♫</em></a>
    <nav>
      <a href="/">首页</a>
      <a href="/travels">旅行</a>
      <a href="/articles">文章</a>
      <a href="/about">关于我</a>
    </nav>
  </header>
  <main>
    <a class="back-link" href="/travels">← 返回攻略列表</a>
    <div id="status" class="status">正在加载旅行攻略…</div>
    <article id="travel" hidden>
      <div class="hero">
        <img id="t-cover" alt="" hidden />
        <div id="t-cover-ph" class="ph"></div>
        <div class="overlay">
          <p class="dest" id="t-dest" hidden></p>
          <h1 id="t-title"></h1>
          <div class="meta" id="t-meta"></div>
        </div>
      </div>

      <div class="action-bar">
        <button type="button" id="t-like" class="btn-like">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/></svg>
          <span id="t-like-count">0</span>
          <span id="t-like-text">点赞</span>
        </button>
        <span class="view-pill"><span id="t-views">0</span> 次浏览</span>
      </div>

      <blockquote id="t-summary" class="summary-quote" hidden></blockquote>

      <section id="sec-attractions" hidden>
        <h2 class="section">景点推荐<span class="sub">Spots</span></h2>
        <div id="t-attractions"></div>
      </section>

      <section id="sec-itinerary" hidden>
        <h2 class="section">行程安排<span class="sub">Plan</span></h2>
        <ol class="timeline" id="t-itinerary"></ol>
      </section>

      <section id="sec-reviews" hidden>
        <h2 class="section">旅行评价<span class="sub">Reviews</span></h2>
        <div id="t-reviews"></div>
      </section>
    </article>
  </main>

  <footer class="shell-footer">
    <span class="slogan script">Good Music, Better Life <em>♪</em></span>
    <span id="footer-copy"></span>
    <span id="footer-theme"></span>
  </footer>

  <script>
    (function () {
      "use strict";

      // API 地址解析：theme-config.js 注入（可携带 /api/v1 前缀）> 同域相对路径
      var injected = window.__NOVA_CONFIG__ && window.__NOVA_CONFIG__.apiBase;
      var siteRoot = injected
        ? injected.replace(/\/api\/v1\/?$/, "").replace(/\/$/, "")
        : "";
      var apiBase = siteRoot + "/api/v1";

      // 页脚：主题来源链接（与 theme.json homepage 一致）
      var THEME_HOMEPAGE = "https://github.com/StudyNoWeekend/novablog-web/tree/HEAD/melody-notes";
      var THEME_VERSION = "0.5.1";
      var footerTheme = document.getElementById("footer-theme");
      footerTheme.innerHTML =
        '主题来源：<a href="' +
        THEME_HOMEPAGE + '" target="_blank" rel="noopener noreferrer">旋律笔记（melody-notes）v' + THEME_VERSION + "</a>";

      // 获取博主资料并更新品牌文字与页脚署名
      var blogTitle = "";
      fetch(apiBase + "/public/blogger", { headers: { Accept: "application/json" } })
        .then(function (r) { return r.json(); })
        .then(function (res) {
          if (res && res.code === 0 && res.data) {
            blogTitle = res.data.blog_title || "";
            var brand = document.getElementById("brand-text");
            if (brand && blogTitle) brand.textContent = blogTitle;
            var copy = document.getElementById("footer-copy");
            if (copy) {
              copy.textContent = "© " + new Date().getFullYear() +
                (res.data.nickname ? " " + res.data.nickname : "") +
                (res.data.blog_description ? " · " + res.data.blog_description : "");
            }
          }
        })
        .catch(function () { /* 静默失败 */ });

      // 从 URL 解析 id：/travels/{id} | /travels/{id}.html | /travels/{id}/
      function parseId() {
        var m = location.pathname.match(/\/travels\/([^/]+?)\.?html?\/?$/i) ||
                location.pathname.match(/\/travels\/([^/]+?)\/?$/i);
        if (!m) return "";
        try {
          return decodeURIComponent(m[1]);
        } catch (e) {
          // 非法百分号编码：按无效地址处理，避免页面卡在加载态
          return "";
        }
      }

      function el(id) { return document.getElementById(id); }

      function escapeHtml(s) {
        return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;")
          .replace(/>/g, "&gt;").replace(/"/g, "&quot;");
      }

      // 链接/图片 URL 仅放行 http(s)://、//、/、#
      function safeUrl(u) {
        u = String(u || "").trim();
        if (/^(https?:\/\/|\/\/|\/|#)/i.test(u)) return u;
        return "#";
      }

      function showError(msg) {
        var s = el("status");
        s.className = "status error";
        s.innerHTML = msg + ' · <a href="/travels">返回攻略列表</a>';
      }

      function reportView(id) {
        // 浏览计数客户端上报（与预渲染详情页 ViewTracker 行为一致）
        fetch(apiBase + "/public/travels/" + encodeURIComponent(id) + "/view", {
          method: "POST",
          headers: { Accept: "application/json" }
        }).catch(function () { /* 静默失败 */ });
      }

      // JSONB 防御式取值：历史数据字段名不统一，依次尝试候选 key
      function pickString(map, keys) {
        for (var i = 0; i < keys.length; i++) {
          var v = map[keys[i]];
          if (typeof v === "string" && v.trim()) return v;
          if (typeof v === "number") return String(v);
        }
        return "";
      }

      function pickNumber(map, keys) {
        for (var i = 0; i < keys.length; i++) {
          var v = map[keys[i]];
          if (typeof v === "number" && isFinite(v)) return v;
        }
        return 0;
      }

      // 按坐标类型生成地图跳转链接（gcj02 → 高德，其余 → Google）
      function mapJumpLink(attraction) {
        var lat = Number(attraction.latitude);
        var lng = Number(attraction.longitude);
        if (!isFinite(lat) || !isFinite(lng) || (lat === 0 && lng === 0)) return null;
        var coordType = String(attraction.coordType != null ? attraction.coordType : attraction.coord_type || "").toLowerCase();
        var name = pickString(attraction, ["name", "title"]);
        if (coordType === "gcj02") {
          return {
            label: "在高德地图查看",
            url: "https://uri.amap.com/marker?position=" + lng + "," + lat +
              "&name=" + encodeURIComponent(name) + "&src=novablog&callnative=1"
          };
        }
        return {
          label: "在 Google 地图查看",
          url: "https://www.google.com/maps/search/?api=1&query=" + lat + "," + lng
        };
      }

      function starRow(value) {
        var clamped = Math.max(0, Math.min(5, Math.round(value)));
        var on = "★", off = "☆", html = '<span class="stars">';
        for (var i = 1; i <= 5; i++) {
          html += i <= clamped ? on : '<span class="off">' + off + "</span>";
        }
        return html + "</span>";
      }

      function bindLike(id, likeCount) {
        var btn = el("t-like");
        var liked = false;
        btn.addEventListener("click", function () {
          if (liked) return;
          liked = true;
          btn.classList.add("liked");
          el("t-like-text").textContent = "已点赞";
          el("t-like-count").textContent = String(likeCount + 1);
          fetch(apiBase + "/public/travels/" + encodeURIComponent(id) + "/like", {
            method: "POST",
            headers: { Accept: "application/json" }
          }).catch(function () { /* 静默失败，计数为乐观展示 */ });
        });
      }

      function render(t) {
        var title = t.title || "旅行攻略";
        document.title = blogTitle ? title + " | " + blogTitle : title;
        el("t-title").textContent = title;

        if (t.cover_image) {
          var c = el("t-cover");
          c.src = safeUrl(t.cover_image);
          c.hidden = false;
          el("t-cover-ph").style.display = "none";
        }

        var destText = [t.destination, t.region].filter(Boolean).join(" · ");
        if (destText) {
          el("t-dest").textContent = destText;
          el("t-dest").hidden = false;
        }

        var meta = [];
        if (t.days > 0) meta.push(escapeHtml(t.days) + " 天");
        if (t.best_month) meta.push("最佳月份 " + escapeHtml(t.best_month));
        if (t.rating > 0) {
          meta.push('<span class="star">★ ' + Number(t.rating).toFixed(1) + "</span>" +
            (t.review_count > 0 ? " (" + escapeHtml(t.review_count) + " 条评价)" : ""));
        }
        el("t-meta").innerHTML = meta.join(" ");

        el("t-views").textContent = t.view_count || 0;
        el("t-like-count").textContent = t.like_count || 0;
        bindLike(t.id, t.like_count || 0);

        if (t.summary && String(t.summary).trim()) {
          el("t-summary").textContent = t.summary;
          el("t-summary").hidden = false;
        }

        // 景点推荐
        var attractions = Array.isArray(t.attractions) ? t.attractions : [];
        if (attractions.length > 0) {
          el("t-attractions").innerHTML = attractions.map(function (a, i) {
            var image = pickString(a, ["image", "cover_image", "image_url", "cover", "pic", "photo"]);
            var name = pickString(a, ["name", "title"]);
            var desc = pickString(a, ["description", "content", "intro", "summary", "text"]);
            var jump = mapJumpLink(a);
            var pic = image
              ? '<div class="pic"><img src="' + safeUrl(image) + '" alt="' + escapeHtml(name || "景点 " + (i + 1)) + '" loading="lazy" /></div>'
              : "";
            var chip = jump
              ? '<a class="map-chip" href="' + safeUrl(jump.url) + '" target="_blank" rel="noopener noreferrer">📍 ' + escapeHtml(jump.label) + "</a>"
              : "";
            return '<div class="attraction">' + pic +
              '<div class="body">' +
              (name ? "<h3>" + escapeHtml(name) + "</h3>" : "") +
              (desc ? '<p class="desc">' + escapeHtml(desc) + "</p>" : "") +
              chip +
              "</div></div>";
          }).join("");
          el("sec-attractions").hidden = false;
        }

        // 行程时间线
        var itinerary = Array.isArray(t.itinerary) ? t.itinerary : [];
        if (itinerary.length > 0) {
          el("t-itinerary").innerHTML = itinerary.map(function (item) {
            var label = pickString(item, ["day", "day_label", "dayLabel", "label", "title", "name"]);
            var desc = pickString(item, ["description", "content", "detail", "summary", "text"]);
            return "<li>" +
              (label ? "<h3>" + escapeHtml(label) + "</h3>" : "") +
              (desc ? "<p>" + escapeHtml(desc) + "</p>" : "") +
              "</li>";
          }).join("");
          el("sec-itinerary").hidden = false;
        }

        // 评价列表
        var reviews = Array.isArray(t.reviews) ? t.reviews : [];
        if (reviews.length > 0) {
          el("t-reviews").innerHTML = reviews.map(function (r) {
            var author = pickString(r, ["nickname", "user", "author", "name", "reviewer"]);
            var rating = pickNumber(r, ["rating", "score", "star", "stars"]);
            var content = pickString(r, ["content", "comment", "text", "description", "review"]);
            return '<div class="review-card"><div class="review-head">' +
              '<span class="name">' + escapeHtml(author || "匿名旅行者") + "</span>" +
              (rating > 0 ? starRow(rating) : "") +
              "</div>" +
              (content ? '<p class="content">' + escapeHtml(content) + "</p>" : "") +
              "</div>";
          }).join("");
          el("sec-reviews").hidden = false;
        }

        el("status").hidden = true;
        el("travel").hidden = false;
        reportView(t.id);
      }

      var id = parseId();
      if (!id) { showError("无效的攻略地址"); return; }

      fetch(apiBase + "/public/travels/" + encodeURIComponent(id), {
        headers: { Accept: "application/json" }
      })
        .then(function (r) { return r.json(); })
        .then(function (res) {
          if (res && res.code === 0 && res.data) { render(res.data); }
          else { showError((res && res.msg) || "攻略不存在或已下架"); }
        })
        .catch(function () { showError("攻略加载失败，请稍后重试"); });
    })();
  </script>
</body>
</html>
