<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- 动态内容壳页面：静态导出未预生成的书籍详情由此页面客户端取数渲染（主题规范 3.4） -->
  <title>书籍加载中</title>
  <script src="/theme-config.js"></script>
  <style>
    :root {
      --bg: #0c1310;
      --bg-soft: #101815;
      --panel: #16211c;
      --panel-2: #1b2822;
      --border: rgba(255, 255, 255, 0.08);
      --text: #f0f6f1;
      --text-2: #dde8df;
      --muted: #9cb1a4;
      --subtle: #6c8275;
      --accent: #9ed0b0;
      --accent-strong: #d9ebde;
      --on-accent: #10241a;
      --danger: #e08a8a;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    [hidden] { display: none !important; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: ui-sans-serif, system-ui, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      line-height: 1.8;
    }
    .script { font-family: "Segoe Script", "Bradley Hand", "Comic Sans MS", cursive; }
    .shell-header {
      border-bottom: 1px solid var(--border);
      background: var(--bg-soft);
      padding: 16px 28px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .brand {
      font-size: 24px;
      line-height: 1;
      color: var(--text);
      text-decoration: none;
    }
    .brand em { color: var(--accent); font-style: normal; }
    .shell-header nav { display: flex; align-items: center; gap: 18px; font-size: 14px; }
    .shell-header nav a { color: var(--muted); text-decoration: none; transition: color .2s ease; }
    .shell-header nav a:hover { color: var(--accent); }
    .back-link {
      display: inline-flex; align-items: center; gap: 6px;
      color: var(--muted); text-decoration: none; font-size: 14px;
    }
    .back-link:hover { color: var(--accent); }
    main { max-width: 760px; margin: 0 auto; padding: 40px 24px 72px; }
    .status {
      color: var(--muted);
      padding: 64px 0;
      text-align: center;
      letter-spacing: 0.05em;
    }
    .status.error { color: var(--danger); }
    .status.error a { color: var(--accent); }
    .book-layout { display: flex; flex-direction: column; gap: 28px; }
    @media (min-width: 640px) { .book-layout { flex-direction: row; } }
    .cover {
      width: 176px; flex-shrink: 0;
    }
    .cover img, .cover .ph {
      width: 100%; aspect-ratio: 2/3; object-fit: cover; display: block;
      border-radius: 12px; border: 1px solid var(--border); background: var(--panel);
    }
    .cover .ph {
      display: flex; align-items: center; justify-content: center;
      color: var(--subtle); font-size: 14px;
    }
    .info { flex: 1; min-width: 0; }
    .status-badge {
      display: inline-block; background: var(--accent); color: var(--on-accent);
      font-size: 12px; font-weight: 500; border-radius: 999px;
      padding: 3px 12px; margin-bottom: 12px;
    }
    article h1 { font-size: 30px; line-height: 1.35; }
    .author { color: var(--muted); margin-top: 10px; }
    .stars { color: var(--accent); font-size: 16px; letter-spacing: 2px; margin-top: 12px; }
    .stars .score { color: var(--muted); font-size: 14px; letter-spacing: normal; margin-left: 8px; }
    .dates { color: var(--muted); font-size: 14px; margin-top: 12px; }
    .dates p { margin: 2px 0; }
    h2.section { font-size: 24px; margin: 44px 0 18px; padding-top: 32px; border-top: 1px solid var(--border); }
    /* 书评（Markdown）正文样式，与站点 .prose-content 对齐 */
    .md { color: var(--text-2); font-size: 16px; line-height: 1.8; word-break: break-word; }
    .md h1, .md h2, .md h3, .md h4, .md h5, .md h6 {
      color: var(--text); font-weight: 700; margin: 2rem 0 1rem; line-height: 1.3;
    }
    .md h1 { font-size: 1.5rem; } .md h2 { font-size: 1.3rem; } .md h3 { font-size: 1.15rem; }
    .md p { margin-bottom: 1.1rem; }
    .md a { color: var(--accent); text-decoration: underline; text-underline-offset: 2px; }
    .md ul, .md ol { margin: 0 0 1.1rem; padding-left: 1.5rem; }
    .md ul { list-style: disc; } .md ol { list-style: decimal; }
    .md li { margin-bottom: .4rem; }
    .md blockquote {
      border-left: 3px solid var(--accent); margin: 1.2rem 0;
      padding: .4rem 0 .4rem 1.1rem; color: var(--muted); font-style: italic;
    }
    .md code {
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      background: var(--panel); border: 1px solid var(--border);
      color: var(--accent); border-radius: 4px; font-size: .88em; padding: 2px 6px;
    }
    .md pre {
      background: var(--panel); border: 1px solid var(--border); border-radius: 8px;
      margin: 0 0 1.1rem; overflow-x: auto; padding: 16px;
    }
    .md pre code { background: none; border: none; color: var(--text-2); padding: 0; }
    .md img { border-radius: 8px; height: auto; margin: 1rem 0; max-width: 100%; }
    .md hr { border: none; border-top: 1px solid var(--border); margin: 1.8rem 0; }
    .md table { border-collapse: collapse; margin-bottom: 1.1rem; width: 100%; }
    .md th, .md td { border: 1px solid var(--border); padding: .5rem .75rem; text-align: left; }
    .md th { background: var(--panel); font-weight: 600; }
    .empty-tip { color: var(--muted); font-size: 14px; }
    .shell-footer {
      border-top: 1px solid var(--border);
      padding: 22px 28px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      font-size: 12px;
      color: var(--subtle);
    }
    .shell-footer .slogan { font-size: 20px; color: var(--muted); }
    .shell-footer .slogan em { color: var(--accent); font-style: normal; }
    .shell-footer a { color: var(--muted); text-decoration: none; }
    .shell-footer a:hover { color: var(--accent); }
    .theme-chip {
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 2px 10px;
      font-size: 11px;
      color: var(--muted);
      margin: 0 6px;
    }
  </style>
</head>
<body>
  <header class="shell-header">
    <a class="brand script" id="brand-link" href="/"><span id="brand-text">Melody Notes</span> <em>♫</em></a>
    <nav>
      <a href="/">首页</a>
      <a href="/music">音乐推荐</a>
      <a href="/playlists">歌单</a>
      <a href="/articles">文章</a>
      <a href="/about">关于我</a>
    </nav>
  </header>
  <main>
    <a class="back-link" href="/books">← 返回书架</a>
    <div id="status" class="status">正在加载书籍…</div>
    <article id="book" hidden>
      <div class="book-layout">
        <div class="cover">
          <img id="b-cover" alt="" hidden />
          <div id="b-cover-ph" class="ph">暂无封面</div>
        </div>
        <div class="info">
          <span id="b-status" class="status-badge" hidden></span>
          <h1 id="b-title"></h1>
          <p id="b-author" class="author" hidden></p>
          <div id="b-stars" class="stars" hidden></div>
          <div id="b-dates" class="dates" hidden></div>
        </div>
      </div>
      <section id="sec-review" hidden>
        <h2 class="section">书评</h2>
        <div id="b-review" class="md"></div>
      </section>
      <p id="b-review-empty" class="empty-tip" hidden>暂无书评</p>
    </article>
  </main>

  <footer class="shell-footer">
    <span class="slogan script">Good Music, Better Life <em>♪</em></span>
    <span id="footer-copy"></span>
    <span id="footer-theme"></span>
  </footer>

  <script>
    (function () {
      "use strict";

      // API 地址解析：theme-config.js 注入（可携带 /api/v1 前缀）> 同域相对路径
      var injected = window.__NOVA_CONFIG__ && window.__NOVA_CONFIG__.apiBase;
      var siteRoot = injected
        ? injected.replace(/\/api\/v1\/?$/, "").replace(/\/$/, "")
        : "";
      var apiBase = siteRoot + "/api/v1";

      // 页脚：主题来源链接（与 theme.json homepage 一致）
      var THEME_HOMEPAGE = "https://github.com/StudyNoWeekend/novablog-web/tree/HEAD/melody-notes";
      var THEME_VERSION = "0.4.0";
      var footerTheme = document.getElementById("footer-theme");
      footerTheme.innerHTML =
        '主题<span class="theme-chip">Melody Notes v' + THEME_VERSION + "</span>来源：<a href=\"" +
        THEME_HOMEPAGE + '" target="_blank" rel="noopener noreferrer">novablog-web/melody-notes</a>';

      // 获取博主资料并更新品牌文字与页脚署名
      var blogTitle = "";
      fetch(apiBase + "/public/blogger", { headers: { Accept: "application/json" } })
        .then(function (r) { return r.json(); })
        .then(function (res) {
          if (res && res.code === 0 && res.data) {
            blogTitle = res.data.blog_title || "";
            var brand = document.getElementById("brand-text");
            if (brand && blogTitle) brand.textContent = blogTitle;
            var copy = document.getElementById("footer-copy");
            if (copy) {
              copy.textContent = "© " + new Date().getFullYear() +
                (res.data.nickname ? " " + res.data.nickname : "") +
                (res.data.blog_description ? " · " + res.data.blog_description : "");
            }
          }
        })
        .catch(function () { /* 静默失败 */ });

      // 从 URL 解析 id：/books/{id} | /books/{id}.html | /books/{id}/
      function parseId() {
        var m = location.pathname.match(/\/books\/([^/]+?)\.?html?\/?$/i) ||
                location.pathname.match(/\/books\/([^/]+?)\/?$/i);
        if (!m) return "";
        try {
          return decodeURIComponent(m[1]);
        } catch (e) {
          // 非法百分号编码：按无效地址处理，避免页面卡在加载态
          return "";
        }
      }

      function el(id) { return document.getElementById(id); }

      function escapeHtml(s) {
        return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;")
          .replace(/>/g, "&gt;").replace(/"/g, "&quot;");
      }

      // 链接/图片 URL 仅放行 http(s)://、//、/、#
      function safeUrl(u) {
        u = String(u || "").trim();
        if (/^(https?:\/\/|\/\/|\/|#)/i.test(u)) return u;
        return "#";
      }

      // 轻量 Markdown 渲染（先整体转义防 XSS，再按行解析常用块级/行内语法）
      function renderMarkdown(src) {
        var lines = escapeHtml(src).split(/\r?\n/);
        var out = [], i = 0, inCode = false, codeBuf = [], listType = null;

        function closeList() {
          if (listType) { out.push("</" + listType + ">"); listType = null; }
        }
        function inline(s) {
          s = s.replace(/`([^`]+)`/g, "<code>$1</code>");
          s = s.replace(/!\[([^\]]*)\]\(([^)\s]+)[^)]*\)/g, function (_, alt, src) {
            var u = safeUrl(src);
            return u === "#" ? "" : '<img src="' + u + '" alt="' + alt + '" loading="lazy" />';
          });
          s = s.replace(/\[([^\]]+)\]\(([^)\s]+)[^)]*\)/g, function (_, text, href) {
            var u = safeUrl(href);
            if (u === "#") return text;
            return '<a href="' + u + '" target="_blank" rel="noopener noreferrer">' + text + "</a>";
          });
          s = s.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
          s = s.replace(/(^|[^*])\*([^*\s][^*]*)\*/g, "$1<em>$2</em>");
          return s;
        }

        while (i < lines.length) {
          var line = lines[i];
          if (/^```/.test(line)) {
            if (inCode) {
              out.push("<pre><code>" + codeBuf.join("\n") + "</code></pre>");
              codeBuf = []; inCode = false;
            } else { closeList(); inCode = true; }
            i++; continue;
          }
          if (inCode) { codeBuf.push(line); i++; continue; }

          var h = line.match(/^(#{1,6})\s+(.*)$/);
          if (h) {
            closeList();
            var lv = h[1].length;
            out.push("<h" + lv + ">" + inline(h[2]) + "</h" + lv + ">");
            i++; continue;
          }
          if (/^\s*(---+|\*\*\*+)\s*$/.test(line)) { closeList(); out.push("<hr/>"); i++; continue; }
          if (/^\s*&gt;\s?/.test(line)) {
            closeList();
            var quote = [];
            while (i < lines.length && /^\s*&gt;\s?/.test(lines[i])) {
              quote.push(lines[i].replace(/^\s*&gt;\s?/, "")); i++;
            }
            out.push("<blockquote><p>" + inline(quote.join(" ")) + "</p></blockquote>");
            continue;
          }
          if (/^\s*[-*+]\s+/.test(line)) {
            if (listType !== "ul") { closeList(); out.push("<ul>"); listType = "ul"; }
            out.push("<li>" + inline(line.replace(/^\s*[-*+]\s+/, "")) + "</li>");
            i++; continue;
          }
          if (/^\s*\d+[.)]\s+/.test(line)) {
            if (listType !== "ol") { closeList(); out.push("<ol>"); listType = "ol"; }
            out.push("<li>" + inline(line.replace(/^\s*\d+[.)]\s+/, "")) + "</li>");
            i++; continue;
          }
          if (/^\s*$/.test(line)) { closeList(); i++; continue; }

          var para = [];
          while (i < lines.length && !/^\s*$/.test(lines[i]) &&
                 !/^(#{1,6})\s|^```|^\s*[-*+]\s|^\s*\d+[.)]\s|^\s*&gt;/.test(lines[i])) {
            para.push(lines[i]); i++;
          }
          if (para.length) { closeList(); out.push("<p>" + inline(para.join("<br/>")) + "</p>"); }
          else { i++; }
        }
        closeList();
        if (inCode && codeBuf.length) out.push("<pre><code>" + codeBuf.join("\n") + "</code></pre>");
        return out.join("\n");
      }

      var READING_STATUS_LABELS = { want: "想读", reading: "在读", done: "读完" };

      function starsHtml(value) {
        var n = Math.max(0, Math.min(5, Math.round(Number(value) || 0)));
        var out = "";
        for (var i = 1; i <= 5; i++) out += i <= n ? "★" : "☆";
        return out;
      }

      function formatDate(dateStr) {
        if (!dateStr) return "";
        var d = new Date(dateStr);
        if (isNaN(d.getTime())) return "";
        return d.toLocaleDateString("zh-CN", { year: "numeric", month: "long", day: "numeric" });
      }

      function showError(msg) {
        var s = el("status");
        s.className = "status error";
        s.innerHTML = msg + ' · <a href="/books">返回书架</a>';
      }

      function render(b) {
        var title = b.title || "书籍";
        document.title = blogTitle ? title + " | " + blogTitle : title;
        el("b-title").textContent = title;

        if (b.cover && safeUrl(b.cover) !== "#") {
          el("b-cover").src = safeUrl(b.cover);
          el("b-cover").hidden = false;
          el("b-cover-ph").hidden = true;
        }

        var statusLabel = READING_STATUS_LABELS[b.reading_status];
        if (statusLabel) {
          el("b-status").textContent = statusLabel;
          el("b-status").hidden = false;
        }

        if (b.author) {
          el("b-author").textContent = b.author;
          el("b-author").hidden = false;
        }

        if (b.rating > 0) {
          el("b-stars").innerHTML = starsHtml(b.rating) +
            '<span class="score">' + escapeHtml(b.rating) + " / 5</span>";
          el("b-stars").hidden = false;
        }

        var startedAt = formatDate(b.started_at);
        var finishedAt = formatDate(b.finished_at);
        var dates = "";
        if (startedAt) dates += "<p>开始阅读：" + escapeHtml(startedAt) + "</p>";
        if (finishedAt) dates += "<p>读完于：" + escapeHtml(finishedAt) + "</p>";
        if (dates) {
          el("b-dates").innerHTML = dates;
          el("b-dates").hidden = false;
        }

        if (b.review && String(b.review).trim()) {
          el("sec-review").hidden = false;
          el("b-review").innerHTML = renderMarkdown(b.review);
        } else {
          el("b-review-empty").hidden = false;
        }

        el("status").hidden = true;
        el("book").hidden = false;
      }

      var id = parseId();
      if (!id) { showError("无效的书籍地址"); return; }

      fetch(apiBase + "/public/books/" + encodeURIComponent(id), {
        headers: { Accept: "application/json" }
      })
        .then(function (r) { return r.json(); })
        .then(function (res) {
          if (res && res.code === 0 && res.data) { render(res.data); }
          else { showError((res && res.msg) || "书籍不存在或已下架"); }
        })
        .catch(function () { showError("书籍加载失败，请稍后重试"); });
    })();
  </script>
</body>
</html>
