<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- 动态内容壳页面：静态导出未预生成的菜谱详情由此页面客户端取数渲染（主题规范 3.4） -->
  <title>菜谱加载中</title>
  <script src="/theme-config.js"></script>
  <style>
    :root {
      --bg: #0c1310;
      --bg-soft: #101815;
      --panel: #16211c;
      --panel-2: #1b2822;
      --border: rgba(255, 255, 255, 0.08);
      --text: #f0f6f1;
      --text-2: #dde8df;
      --muted: #9cb1a4;
      --subtle: #6c8275;
      --accent: #9ed0b0;
      --accent-strong: #d9ebde;
      --on-accent: #10241a;
      --danger: #e08a8a;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    [hidden] { display: none !important; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: ui-sans-serif, system-ui, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      line-height: 1.8;
    }
    .script { font-family: "Segoe Script", "Bradley Hand", "Comic Sans MS", cursive; }
    .shell-header {
      border-bottom: 1px solid var(--border);
      background: var(--bg-soft);
      padding: 16px 28px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .brand {
      font-size: 24px;
      line-height: 1;
      color: var(--text);
      text-decoration: none;
    }
    .brand em { color: var(--accent); font-style: normal; }
    .shell-header nav { display: flex; align-items: center; gap: 18px; font-size: 14px; }
    .shell-header nav a { color: var(--muted); text-decoration: none; transition: color .2s ease; }
    .shell-header nav a:hover { color: var(--accent); }
    .back-link {
      display: inline-flex; align-items: center; gap: 6px;
      color: var(--muted); text-decoration: none; font-size: 14px;
    }
    .back-link:hover { color: var(--accent); }
    main { max-width: 760px; margin: 0 auto; padding: 40px 24px 72px; }
    .status {
      color: var(--muted);
      padding: 64px 0;
      text-align: center;
      letter-spacing: 0.05em;
    }
    .status.error { color: var(--danger); }
    .status.error a { color: var(--accent); }
    .hero {
      width: 100%; aspect-ratio: 21/9; object-fit: cover;
      border-radius: 12px; border: 1px solid var(--border);
      background: var(--panel); margin-bottom: 32px;
    }
    .difficulty {
      display: inline-block; background: var(--accent); color: var(--on-accent);
      font-size: 12px; font-weight: 500; border-radius: 999px;
      padding: 3px 12px; margin-bottom: 12px;
    }
    article h1 { font-size: 32px; line-height: 1.35; }
    .facts {
      display: flex; flex-wrap: wrap; gap: 16px;
      color: var(--muted); font-size: 14px; margin-top: 14px;
    }
    .tags { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 16px; }
    .tag {
      border: 1px solid rgba(158, 208, 176, 0.25); background: rgba(158, 208, 176, 0.12);
      color: var(--accent); font-size: 12px; border-radius: 999px; padding: 3px 12px;
    }
    blockquote.summary {
      border-left: 2px solid var(--accent);
      padding: 4px 20px;
      margin: 28px 0 0;
      color: var(--muted);
      font-style: italic;
    }
    h2.section { font-size: 24px; margin: 44px 0 18px; padding-top: 32px; border-top: 1px solid var(--border); }
    .ingredients { list-style: none; display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    @media (max-width: 640px) { .ingredients { grid-template-columns: 1fr; } }
    .ingredients li {
      display: flex; align-items: baseline; justify-content: space-between; gap: 12px;
      background: var(--panel); border: 1px solid var(--border);
      border-radius: 8px; padding: 10px 16px; font-size: 14px;
    }
    .ingredients .amount { color: var(--muted); flex-shrink: 0; }
    .step { display: flex; gap: 16px; margin-bottom: 24px; }
    .step .no {
      width: 32px; height: 32px; border-radius: 50%; flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      background: rgba(158, 208, 176, 0.12); color: var(--accent);
      font-family: "Segoe Script", "Bradley Hand", "Comic Sans MS", cursive;
      font-size: 15px; font-weight: 600;
    }
    .step .body { flex: 1; min-width: 0; }
    .step p { color: var(--text-2); white-space: pre-wrap; word-break: break-word; }
    .step img { border-radius: 8px; display: block; margin-top: 14px; max-width: 100%; height: auto; }
    .shell-footer {
      border-top: 1px solid var(--border);
      padding: 22px 28px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      font-size: 12px;
      color: var(--subtle);
    }
    .shell-footer .slogan { font-size: 20px; color: var(--muted); }
    .shell-footer .slogan em { color: var(--accent); font-style: normal; }
    .shell-footer a { color: var(--muted); text-decoration: none; }
    .shell-footer a:hover { color: var(--accent); }
    .theme-chip {
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 2px 10px;
      font-size: 11px;
      color: var(--muted);
      margin: 0 6px;
    }
  </style>
</head>
<body>
  <header class="shell-header">
    <a class="brand script" id="brand-link" href="/"><span id="brand-text">Melody Notes</span> <em>♫</em></a>
    <nav>
      <a href="/">首页</a>
      <a href="/music">音乐推荐</a>
      <a href="/playlists">歌单</a>
      <a href="/articles">文章</a>
      <a href="/about">关于我</a>
    </nav>
  </header>
  <main>
    <a class="back-link" href="/recipes">← 返回菜谱列表</a>
    <div id="status" class="status">正在加载菜谱…</div>
    <article id="recipe" hidden>
      <img id="r-cover" class="hero" alt="" hidden />
      <span id="r-difficulty" class="difficulty" hidden></span>
      <h1 id="r-title"></h1>
      <div class="facts" id="r-facts"></div>
      <div id="r-tags" class="tags" hidden></div>
      <blockquote id="r-summary" class="summary" hidden></blockquote>
      <section id="sec-ingredients" hidden>
        <h2 class="section">食材清单</h2>
        <ul id="r-ingredients" class="ingredients"></ul>
      </section>
      <section id="sec-steps" hidden>
        <h2 class="section">制作步骤</h2>
        <div id="r-steps"></div>
      </section>
    </article>
  </main>

  <footer class="shell-footer">
    <span class="slogan script">Good Music, Better Life <em>♪</em></span>
    <span id="footer-copy"></span>
    <span id="footer-theme"></span>
  </footer>

  <script>
    (function () {
      "use strict";

      // API 地址解析：theme-config.js 注入（可携带 /api/v1 前缀）> 同域相对路径
      var injected = window.__NOVA_CONFIG__ && window.__NOVA_CONFIG__.apiBase;
      var siteRoot = injected
        ? injected.replace(/\/api\/v1\/?$/, "").replace(/\/$/, "")
        : "";
      var apiBase = siteRoot + "/api/v1";

      // 页脚：主题来源链接（与 theme.json homepage 一致）
      var THEME_HOMEPAGE = "https://github.com/StudyNoWeekend/novablog-web/tree/HEAD/melody-notes";
      var THEME_VERSION = "0.4.0";
      var footerTheme = document.getElementById("footer-theme");
      footerTheme.innerHTML =
        '主题<span class="theme-chip">Melody Notes v' + THEME_VERSION + "</span>来源：<a href=\"" +
        THEME_HOMEPAGE + '" target="_blank" rel="noopener noreferrer">novablog-web/melody-notes</a>';

      // 获取博主资料并更新品牌文字与页脚署名
      var blogTitle = "";
      fetch(apiBase + "/public/blogger", { headers: { Accept: "application/json" } })
        .then(function (r) { return r.json(); })
        .then(function (res) {
          if (res && res.code === 0 && res.data) {
            blogTitle = res.data.blog_title || "";
            var brand = document.getElementById("brand-text");
            if (brand && blogTitle) brand.textContent = blogTitle;
            var copy = document.getElementById("footer-copy");
            if (copy) {
              copy.textContent = "© " + new Date().getFullYear() +
                (res.data.nickname ? " " + res.data.nickname : "") +
                (res.data.blog_description ? " · " + res.data.blog_description : "");
            }
          }
        })
        .catch(function () { /* 静默失败 */ });

      // 从 URL 解析 id：/recipes/{id} | /recipes/{id}.html | /recipes/{id}/
      function parseId() {
        var m = location.pathname.match(/\/recipes\/([^/]+?)\.?html?\/?$/i) ||
                location.pathname.match(/\/recipes\/([^/]+?)\/?$/i);
        if (!m) return "";
        try {
          return decodeURIComponent(m[1]);
        } catch (e) {
          // 非法百分号编码：按无效地址处理，避免页面卡在加载态
          return "";
        }
      }

      function el(id) { return document.getElementById(id); }

      function escapeHtml(s) {
        return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;")
          .replace(/>/g, "&gt;").replace(/"/g, "&quot;");
      }

      // 链接/图片 URL 仅放行 http(s)://、//、/、#
      function safeUrl(u) {
        u = String(u || "").trim();
        if (/^(https?:\/\/|\/\/|\/|#)/i.test(u)) return u;
        return "#";
      }

      // 步骤图为相对路径：非 http(s) 开头时拼接「站点根 + /files/ + 路径」
      function fileUrl(u) {
        u = String(u || "").trim();
        if (!u) return "";
        if (/^(https?:\/\/|\/\/|\/|#)/i.test(u)) return safeUrl(u);
        return siteRoot + "/files/" + u.replace(/^\/+/, "");
      }

      var DIFFICULTY_LABELS = { 1: "简单", 2: "中等", 3: "困难" };

      function showError(msg) {
        var s = el("status");
        s.className = "status error";
        s.innerHTML = msg + ' · <a href="/recipes">返回菜谱列表</a>';
      }

      function render(r) {
        var title = r.title || "菜谱";
        document.title = blogTitle ? title + " | " + blogTitle : title;
        el("r-title").textContent = title;

        if (r.cover && safeUrl(r.cover) !== "#") {
          var c = el("r-cover");
          c.src = safeUrl(r.cover);
          c.hidden = false;
        }

        var diff = DIFFICULTY_LABELS[r.difficulty] || DIFFICULTY_LABELS[Number(r.difficulty)];
        if (diff) {
          el("r-difficulty").textContent = diff;
          el("r-difficulty").hidden = false;
        }

        var facts = [];
        if (r.minutes > 0) facts.push("⏱ " + escapeHtml(r.minutes) + " 分钟");
        if (r.servings > 0) facts.push("👥 " + escapeHtml(r.servings) + " 人份");
        if (facts.length) el("r-facts").innerHTML = facts.join("<span>·</span>");

        var tags = String(r.tags || "").split(",").map(function (t) { return t.trim(); })
          .filter(Boolean).map(function (t) { return '<span class="tag">#' + escapeHtml(t) + "</span>"; });
        if (tags.length) {
          el("r-tags").innerHTML = tags.join("");
          el("r-tags").hidden = false;
        }

        if (r.summary) {
          el("r-summary").textContent = r.summary;
          el("r-summary").hidden = false;
        }

        // 食材清单
        var ingredients = Array.isArray(r.ingredients) ? r.ingredients : [];
        if (ingredients.length) {
          el("sec-ingredients").hidden = false;
          el("r-ingredients").innerHTML = ingredients.map(function (item) {
            return "<li><span>" + escapeHtml(item.name || "") + "</span>" +
              (item.amount ? '<span class="amount">' + escapeHtml(item.amount) + "</span>" : "") +
              "</li>";
          }).join("");
        }

        // 编号步骤（含图）
        var steps = Array.isArray(r.steps) ? r.steps : [];
        if (steps.length) {
          el("sec-steps").hidden = false;
          el("r-steps").innerHTML = steps.map(function (step, i) {
            var img = fileUrl(step.image);
            return '<div class="step"><span class="no">' + (i + 1) + '</span>' +
              '<div class="body"><p>' + escapeHtml(step.text || "") + "</p>" +
              (img && img !== "#" ? '<img src="' + img + '" alt="步骤 ' + (i + 1) + '" loading="lazy" />' : "") +
              "</div></div>";
          }).join("");
        }

        el("status").hidden = true;
        el("recipe").hidden = false;
      }

      var id = parseId();
      if (!id) { showError("无效的菜谱地址"); return; }

      fetch(apiBase + "/public/recipes/" + encodeURIComponent(id), {
        headers: { Accept: "application/json" }
      })
        .then(function (r) { return r.json(); })
        .then(function (res) {
          if (res && res.code === 0 && res.data) { render(res.data); }
          else { showError((res && res.msg) || "菜谱不存在或已下架"); }
        })
        .catch(function () { showError("菜谱加载失败，请稍后重试"); });
    })();
  </script>
</body>
</html>
