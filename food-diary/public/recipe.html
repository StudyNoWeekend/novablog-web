<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- 动态内容壳页面：静态导出未预生成的美食菜谱由此页面客户端取数渲染（主题规范 3.4） -->
  <title>菜谱加载中</title>
  <script src="/theme-config.js"></script>
  <style>
    :root {
      --bg: #fdf8f0;
      --panel: #ffffff;
      --panel-soft: #f7efe1;
      --highlight: #fbf3e4;
      --border: #efe3d0;
      --border-strong: #e2d2b8;
      --text: #3d2b1f;
      --text-soft: #5d4a38;
      --muted: #8a7361;
      --subtle: #b39c86;
      --accent: #f09b3c;
      --accent-deep: #de8725;
      --accent-subtle: rgba(240, 155, 60, 0.14);
      --danger: #e2695e;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: ui-sans-serif, system-ui, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      line-height: 1.85;
    }
    .display { font-family: "ZCOOL KuaiLe", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif; letter-spacing: 0.02em; }
    .hand { font-family: "Caveat", "Segoe Script", cursive; }
    .shell-header {
      border-bottom: 1px solid var(--border);
      background: rgba(253, 248, 240, 0.92);
      padding: 16px 28px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 14px;
    }
    .brand { color: var(--text); font-weight: 600; }
    .brand em { color: var(--accent-deep); font-style: normal; }
    .shell-header a { color: var(--muted); text-decoration: none; }
    .shell-header a:hover { color: var(--accent-deep); }
    main { max-width: 760px; margin: 0 auto; padding: 44px 24px 96px; }
    .status { color: var(--muted); padding: 64px 0; text-align: center; }
    .status.error { color: var(--danger); }
    .status.error a { color: var(--accent-deep); }
    .hero { position: relative; border-radius: 20px; overflow: hidden; margin-bottom: 32px; background: var(--panel-soft); }
    .hero img { width: 100%; aspect-ratio: 21/9; object-fit: cover; display: block; }
    .hero .ph { width: 100%; aspect-ratio: 21/9; display: flex; align-items: center; justify-content: center; color: var(--subtle); font-size: 20px; }
    .difficulty {
      display: inline-block; background: var(--accent); color: #fff;
      font-size: 12px; font-weight: 600; border-radius: 999px;
      padding: 3px 12px; margin-bottom: 12px;
    }
    h1 { font-size: 30px; line-height: 1.35; }
    .facts { display: flex; flex-wrap: wrap; gap: 16px; color: var(--muted); font-size: 14px; margin-top: 12px; }
    .tags { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 16px; }
    .tag {
      border: 1px solid rgba(240, 155, 60, 0.25); background: var(--accent-subtle);
      color: var(--accent-deep); font-size: 12px; border-radius: 999px; padding: 3px 12px;
    }
    blockquote.summary {
      border-left: 3px solid var(--accent);
      background: var(--highlight);
      border-radius: 0 10px 10px 0;
      padding: 10px 18px;
      margin: 24px 0 0;
      color: var(--muted);
      font-style: italic;
    }
    h2.section { font-size: 24px; margin: 44px 0 18px; padding-top: 32px; border-top: 1px dashed var(--border-strong); }
    .ingredients { list-style: none; display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    @media (max-width: 640px) { .ingredients { grid-template-columns: 1fr; } }
    .ingredients li {
      display: flex; align-items: baseline; justify-content: space-between; gap: 12px;
      background: var(--panel); border: 1px solid var(--border);
      border-radius: 10px; padding: 10px 16px; font-size: 14px;
    }
    .ingredients .amount { color: var(--muted); flex-shrink: 0; }
    .step { display: flex; gap: 16px; margin-bottom: 24px; }
    .step .no {
      width: 32px; height: 32px; border-radius: 50%; flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      background: var(--accent-subtle); color: var(--accent-deep);
      font-size: 14px; font-weight: 600;
    }
    .step .body { flex: 1; min-width: 0; }
    .step p { color: var(--text-soft); white-space: pre-wrap; word-break: break-word; }
    .step img { border-radius: 14px; display: block; margin-top: 14px; max-width: 100%; height: auto; }
  </style>
</head>
<body>
  <header class="shell-header">
    <span class="brand display" id="brand-text"></span>
    <a href="/recipes">← 菜谱列表</a>
  </header>
  <main>
    <div id="status" class="status">正在加载菜谱…</div>
    <article id="recipe" hidden>
      <div class="hero">
        <img id="r-cover" alt="" hidden />
        <div id="r-cover-ph" class="ph hand">yum…</div>
      </div>
      <span id="r-difficulty" class="difficulty" hidden></span>
      <h1 id="r-title" class="display"></h1>
      <div class="facts" id="r-facts"></div>
      <div id="r-tags" class="tags" hidden></div>
      <blockquote id="r-summary" class="summary" hidden></blockquote>
      <section id="sec-ingredients" hidden>
        <h2 class="section display">食材清单</h2>
        <ul id="r-ingredients" class="ingredients"></ul>
      </section>
      <section id="sec-steps" hidden>
        <h2 class="section display">制作步骤</h2>
        <div id="r-steps"></div>
      </section>
    </article>
  </main>

  <script>
    (function () {
      "use strict";

      // API 地址解析：theme-config.js 注入（可携带 /api/v1 前缀）> 同域相对路径
      var injected = window.__NOVA_CONFIG__ && window.__NOVA_CONFIG__.apiBase;
      var siteRoot = injected
        ? injected.replace(/\/api\/v1\/?$/, "").replace(/\/$/, "")
        : "";
      var apiBase = siteRoot + "/api/v1";

      // 获取博主资料并更新品牌文字
      var blogTitle = "";
      fetch(apiBase + "/public/blogger", { headers: { Accept: "application/json" } })
        .then(function (r) { return r.json(); })
        .then(function (res) {
          if (res && res.code === 0 && res.data) {
            blogTitle = res.data.blog_title || "";
            var brand = document.getElementById("brand-text");
            if (brand) brand.textContent = blogTitle;
          }
        })
        .catch(function () { /* 静默失败 */ });

      // 从 URL 解析 id：/recipes/{id} | /recipes/{id}.html | /recipes/{id}/
      function parseId() {
        var m = location.pathname.match(/\/recipes\/([^/]+?)\.?html?\/?$/i) ||
                location.pathname.match(/\/recipes\/([^/]+?)\/?$/i);
        if (!m) return "";
        try {
          return decodeURIComponent(m[1]);
        } catch (e) {
          // 非法百分号编码：按无效地址处理，避免页面卡在加载态
          return "";
        }
      }

      function el(id) { return document.getElementById(id); }

      function escapeHtml(s) {
        return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;")
          .replace(/>/g, "&gt;").replace(/"/g, "&quot;");
      }

      // 链接/图片 URL 仅放行 http(s)://、//、/、#
      function safeUrl(u) {
        u = String(u || "").trim();
        if (/^(https?:\/\/|\/\/|\/|#)/i.test(u)) return u;
        return "#";
      }

      // 封面/步骤图为相对路径：非 http(s) 开头时拼接「站点根 + /files/ + 路径」
      function fileUrl(u) {
        u = String(u || "").trim();
        if (!u) return "";
        if (/^(https?:\/\/|\/\/|\/|#)/i.test(u)) return safeUrl(u);
        return siteRoot + "/files/" + u.replace(/^\/+/, "");
      }

      var DIFFICULTY_LABELS = { 1: "简单", 2: "中等", 3: "困难" };

      function showError(msg) {
        var s = el("status");
        s.className = "status error";
        s.innerHTML = msg + ' · <a href="/recipes">返回菜谱列表</a>';
      }

      function render(r) {
        var title = r.title || "菜谱";
        document.title = blogTitle ? title + " | " + blogTitle : title;
        el("r-title").textContent = title;

        if (r.cover) {
          var c = fileUrl(r.cover);
          if (c && c !== "#") {
            el("r-cover").src = c;
            el("r-cover").hidden = false;
            el("r-cover-ph").style.display = "none";
          }
        }

        var diff = DIFFICULTY_LABELS[r.difficulty] || DIFFICULTY_LABELS[Number(r.difficulty)];
        if (diff) {
          el("r-difficulty").textContent = diff;
          el("r-difficulty").hidden = false;
        }

        var facts = [];
        if (r.minutes > 0) facts.push("⏱ " + escapeHtml(r.minutes) + " 分钟");
        if (r.servings > 0) facts.push("👥 " + escapeHtml(r.servings) + " 人份");
        el("r-facts").innerHTML = facts.join("<span>·</span>");

        var tags = String(r.tags || "").split(",").map(function (t) { return t.trim(); })
          .filter(Boolean).map(function (t) { return '<span class="tag">#' + escapeHtml(t) + "</span>"; });
        if (tags.length) {
          el("r-tags").innerHTML = tags.join("");
          el("r-tags").hidden = false;
        }

        if (r.summary) {
          el("r-summary").textContent = r.summary;
          el("r-summary").hidden = false;
        }

        // 食材清单
        var ingredients = Array.isArray(r.ingredients) ? r.ingredients : [];
        if (ingredients.length) {
          el("sec-ingredients").hidden = false;
          el("r-ingredients").innerHTML = ingredients.map(function (item, i) {
            return "<li><span>" + escapeHtml(item.name || "") + "</span>" +
              (item.amount ? '<span class="amount">' + escapeHtml(item.amount) + "</span>" : "") +
              "</li>";
          }).join("");
        }

        // 编号步骤（含图）
        var steps = Array.isArray(r.steps) ? r.steps : [];
        if (steps.length) {
          el("sec-steps").hidden = false;
          el("r-steps").innerHTML = steps.map(function (step, i) {
            var img = fileUrl(step.image);
            return '<div class="step"><span class="no">' + (i + 1) + '</span>' +
              '<div class="body"><p>' + escapeHtml(step.text || "") + "</p>" +
              (img && img !== "#" ? '<img src="' + img + '" alt="步骤 ' + (i + 1) + '" loading="lazy" />' : "") +
              "</div></div>";
          }).join("");
        }

        el("status").hidden = true;
        el("recipe").hidden = false;
      }

      var id = parseId();
      if (!id) { showError("无效的菜谱地址"); return; }

      fetch(apiBase + "/public/recipes/" + encodeURIComponent(id), {
        headers: { Accept: "application/json" }
      })
        .then(function (r) { return r.json(); })
        .then(function (res) {
          if (res && res.code === 0 && res.data) { render(res.data); }
          else { showError((res && res.msg) || "菜谱不存在或已下架"); }
        })
        .catch(function () { showError("菜谱加载失败，请稍后重试"); });
    })();
  </script>
</body>
</html>
