<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- 动态内容壳页面：静态导出未预生成的作品集详情由此页面客户端取数渲染（主题规范 3.4） -->
  <title>作品集加载中 | Photo Creator</title>
  <script src="/theme-config.js"></script>
  <style>
    :root {
      --bg: #fdfdfc;
      --border: #e8e6e1;
      --text: #1c1b1a;
      --muted: #8a8781;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: ui-sans-serif, system-ui, "PingFang SC", "Microsoft YaHei", sans-serif;
      line-height: 1.8;
    }
    .shell-header {
      padding: 20px 32px;
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      letter-spacing: 0.12em;
      font-size: 13px;
      text-transform: uppercase;
    }
    .brand { color: var(--text); font-weight: 600; }
    .shell-header a { color: var(--muted); text-decoration: none; }
    .shell-header a:hover { color: var(--text); }
    main { max-width: 960px; margin: 0 auto; padding: 48px 24px 96px; }
    .status {
      color: var(--muted);
      padding: 64px 0;
      text-align: center;
      letter-spacing: 0.05em;
    }
    .status.error a { color: var(--text); }
    h1 {
      font-size: 30px;
      line-height: 1.35;
      margin: 12px 0 20px;
      letter-spacing: -0.01em;
      font-weight: 600;
    }
    .meta {
      font-size: 13px;
      color: var(--muted);
      margin-bottom: 40px;
      display: flex;
      flex-wrap: wrap;
      gap: 16px;
      letter-spacing: 0.04em;
    }
    .cover { width: 100%; margin-bottom: 8px; }
    .desc { color: var(--muted); margin-bottom: 40px; max-width: 640px; }
    .gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 20px; }
    .item img { width: 100%; aspect-ratio: 4/3; object-fit: cover; display: block; background: #f1efeb; }
    .item video { width: 100%; aspect-ratio: 4/3; display: block; background: #1c1b1a; }
    .item figcaption { font-size: 13px; color: var(--muted); padding: 8px 2px 0; }
    .item figcaption b { display: block; color: var(--text); font-weight: 500; }
  </style>
</head>
<body>
  <header class="shell-header">
    <span class="brand">Photo Creator</span>
    <a href="/portfolios">← 作品集</a>
  </header>
  <main>
    <div id="status" class="status">Loading…</div>
    <article id="work" hidden>
      <div class="meta" id="w-meta"></div>
      <h1 id="w-title"></h1>
      <p class="desc" id="w-desc"></p>
      <img id="w-cover" class="cover" alt="" hidden />
      <div class="gallery" id="w-gallery"></div>
    </article>
  </main>

  <script>
    (function () {
      "use strict";

      // API 地址解析：theme-config.js 注入（可携带 /api/v1 前缀）> 同域相对路径
      var injected = window.__NOVA_CONFIG__ && window.__NOVA_CONFIG__.apiBase;
      var siteRoot = injected
        ? injected.replace(/\/api\/v1\/?$/, "").replace(/\/$/, "")
        : "";

      // 从 URL 解析 id：/portfolios/{id} | /portfolios/{id}.html | /portfolios/{id}/
      function parseId() {
        var m = location.pathname.match(/\/portfolios\/([^/]+?)\.?html?\/?$/i) ||
                location.pathname.match(/\/portfolios\/([^/]+?)\/?$/i);
        if (!m) return "";
        try {
          return decodeURIComponent(m[1]);
        } catch (e) {
          // 非法百分号编码：按无效地址处理，避免页面卡在加载态
          return "";
        }
      }

      function el(id) { return document.getElementById(id); }

      function escapeHtml(s) {
        return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;")
          .replace(/>/g, "&gt;").replace(/"/g, "&quot;");
      }

      function safeUrl(u) {
        u = String(u || "").trim();
        if (/^(https?:\/\/|\/|#)/i.test(u)) return u;
        return "#";
      }

      function showError(msg) {
        var s = el("status");
        s.className = "status error";
        s.innerHTML = msg + ' · <a href="/portfolios">返回作品集</a>';
      }

      function render(p) {
        document.title = (p.name || "作品集") + " | Photo Creator";
        var meta = [];
        if (p.category_name) meta.push(escapeHtml(p.category_name));
        if (p.item_count !== undefined) meta.push(escapeHtml(p.item_count) + " 件作品");
        if (p.created_at) meta.push(escapeHtml(p.created_at));
        el("w-meta").innerHTML = meta.join(" · ");
        el("w-title").textContent = p.name || "无标题";
        el("w-desc").textContent = p.description || "";
        if (p.cover_url) {
          var c = el("w-cover");
          c.src = safeUrl(p.cover_url);
          c.hidden = false;
        }
        var gallery = el("w-gallery");
        (p.items || []).forEach(function (it) {
          var url = safeUrl(it.output_url);
          if (url === "#") return;
          var fig = document.createElement("figure");
          fig.className = "item";
          var isVideo = /^video\//i.test(it.mime_type || "");
          fig.innerHTML = isVideo
            ? '<video src="' + url + '" controls preload="metadata"></video>'
            : '<img src="' + url + '" alt="' + escapeHtml(it.title || "") + '" loading="lazy" />';
          if (it.title || it.description) {
            var cap = document.createElement("figcaption");
            cap.innerHTML = (it.title ? "<b>" + escapeHtml(it.title) + "</b>" : "") +
              escapeHtml(it.description || "");
            fig.appendChild(cap);
          }
          gallery.appendChild(fig);
        });
        el("status").hidden = true;
        el("work").hidden = false;
      }

      var id = parseId();
      if (!id) { showError("无效的作品集地址"); return; }

      fetch(siteRoot + "/api/v1/public/portfolios/" + encodeURIComponent(id), {
        headers: { Accept: "application/json" }
      })
        .then(function (r) { return r.json(); })
        .then(function (res) {
          if (res && res.code === 0 && res.data) { render(res.data); }
          else { showError((res && res.msg) || "作品集不存在或已下架"); }
        })
        .catch(function () { showError("作品集加载失败，请稍后重试"); });
    })();
  </script>
</body>
</html>
