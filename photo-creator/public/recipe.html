<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- 动态内容壳页面：静态导出未预生成的菜谱详情由此页面客户端取数渲染（主题规范 3.4） -->
  <title>菜谱加载中 | Photo Creator</title>
  <script src="/theme-config.js"></script>
  <style>
    :root {
      --bg: #fdfdfc;
      --border: #e8e6e1;
      --text: #1c1b1a;
      --muted: #8a8781;
      --accent: #a67c2e;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: ui-sans-serif, system-ui, "PingFang SC", "Microsoft YaHei", sans-serif;
      line-height: 1.8;
    }
    .shell-header {
      padding: 20px 32px;
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      letter-spacing: 0.12em;
      font-size: 13px;
      text-transform: uppercase;
    }
    .brand { color: var(--text); font-weight: 600; }
    .shell-header a { color: var(--muted); text-decoration: none; }
    .shell-header a:hover { color: var(--text); }
    main { max-width: 720px; margin: 0 auto; padding: 48px 24px 96px; }
    .status {
      color: var(--muted);
      padding: 64px 0;
      text-align: center;
      letter-spacing: 0.05em;
    }
    .status.error a { color: var(--text); }
    article h1 {
      font-size: 30px;
      line-height: 1.35;
      margin: 20px 0 12px;
      letter-spacing: -0.01em;
      font-weight: 600;
    }
    .cover { width: 100%; border-radius: 12px; }
    .meta { display: flex; flex-wrap: wrap; gap: 8px; margin: 16px 0 8px; font-size: 13px; }
    .meta span {
      padding: 2px 12px;
      border-radius: 999px;
      border: 1px solid var(--border);
      color: var(--muted);
    }
    .meta span.diff { color: var(--accent); border-color: color-mix(in srgb, var(--accent) 35%, transparent); }
    .summary {
      color: var(--muted);
      border-left: 2px solid var(--accent);
      padding: 4px 0 4px 18px;
      margin: 16px 0 8px;
    }
    .section-title { font-size: 18px; font-weight: 600; margin: 32px 0 14px; }
    .ingredients { list-style: none; display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 8px; }
    .ingredients li {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      padding: 8px 16px;
      border: 1px solid var(--border);
      border-radius: 10px;
      font-size: 14px;
    }
    .ingredients .amount { color: var(--muted); }
    .steps { list-style: none; }
    .steps li { display: flex; gap: 14px; margin-bottom: 28px; }
    .steps .no {
      flex-shrink: 0;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: var(--accent);
      color: #fff;
      font-size: 14px;
      font-weight: 600;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-top: 4px;
    }
    .steps .body { flex: 1; min-width: 0; }
    .steps img { max-width: 100%; border-radius: 10px; margin-top: 12px; }
  </style>
</head>
<body>
  <header class="shell-header">
    <span class="brand">Photo Creator</span>
    <a href="/">← Back</a>
  </header>
  <main>
    <div id="status" class="status">Loading…</div>
    <article id="recipe" hidden>
      <img id="r-cover" class="cover" alt="" hidden />
      <h1 id="r-title"></h1>
      <div class="meta" id="r-meta"></div>
      <p class="summary" id="r-summary" hidden></p>
      <div id="r-ingredients" hidden>
        <h2 class="section-title">食材清单</h2>
        <ul class="ingredients" id="r-ingredient-list"></ul>
      </div>
      <div id="r-steps" hidden>
        <h2 class="section-title">制作步骤</h2>
        <ol class="steps" id="r-step-list"></ol>
      </div>
    </article>
  </main>

  <script>
    (function () {
      "use strict";

      // API 地址解析：theme-config.js 注入（可携带 /api/v1 前缀）> 同域相对路径
      var injected = window.__NOVA_CONFIG__ && window.__NOVA_CONFIG__.apiBase;
      var siteRoot = injected
        ? injected.replace(/\/api\/v1\/?$/, "").replace(/\/$/, "")
        : "";

      // 从 URL 解析 id：/recipes/{id} | /recipes/{id}.html | /recipes/{id}/
      function parseId() {
        var m = location.pathname.match(/\/recipes\/([^/]+?)\.?html?\/?$/i) ||
                location.pathname.match(/\/recipes\/([^/]+?)\/?$/i);
        if (!m) return "";
        try {
          return decodeURIComponent(m[1]);
        } catch (e) {
          // 非法百分号编码（如 /recipes/%zz）：按无效地址处理，避免页面卡在加载态
          return "";
        }
      }

      function el(id) { return document.getElementById(id); }

      function escapeHtml(s) {
        return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;")
          .replace(/>/g, "&gt;").replace(/"/g, "&quot;");
      }

      // URL 仅放行 http(s)、站点相对路径与页内锚点
      function safeUrl(u) {
        u = String(u || "").trim();
        if (/^(https?:\/\/|\/|#)/i.test(u)) return u;
        return "#";
      }

      // 步骤配图相对路径：拼「站点根 /files/」前缀（与主站 resolveFileUrl 行为一致）
      function fileUrl(path) {
        var value = String(path || "").trim();
        if (!value) return "";
        if (/^(https?:\/\/|\/|data:)/i.test(value)) return value;
        return siteRoot + "/files/" + value.replace(/^\.\//, "");
      }

      // 难度映射：1=简单 2=中等 3=困难
      var DIFFICULTY = { 1: "简单", 2: "中等", 3: "困难" };

      function showError(msg) {
        var s = el("status");
        s.className = "status error";
        s.innerHTML = msg + ' · <a href="/">返回首页</a>';
      }

      function render(r) {
        document.title = (r.title || "菜谱") + " | Photo Creator";

        if (r.cover) {
          var c = el("r-cover");
          c.src = safeUrl(r.cover);
          c.hidden = false;
        }
        el("r-title").textContent = r.title || "无标题";

        // 难度 / 耗时 / 份量 / 标签
        var meta = [];
        if (DIFFICULTY[r.difficulty]) meta.push('<span class="diff">' + escapeHtml(DIFFICULTY[r.difficulty]) + "</span>");
        if (Number(r.minutes) > 0) meta.push("<span>" + escapeHtml(r.minutes) + " 分钟</span>");
        if (Number(r.servings) > 0) meta.push("<span>" + escapeHtml(r.servings) + " 人份</span>");
        String(r.tags || "").split(",").forEach(function (tag) {
          tag = tag.trim();
          if (tag) meta.push("<span>#" + escapeHtml(tag) + "</span>");
        });
        if (meta.length) el("r-meta").innerHTML = meta.join(" ");

        if (r.summary) {
          el("r-summary").textContent = r.summary;
          el("r-summary").hidden = false;
        }

        // 食材清单
        var ingredients = Array.isArray(r.ingredients) ? r.ingredients : [];
        if (ingredients.length) {
          var ingHtml = "";
          ingredients.forEach(function (item) {
            ingHtml += "<li><span>" + escapeHtml(item.name || "") + "</span>" +
              '<span class="amount">' + escapeHtml(item.amount || "") + "</span></li>";
          });
          el("r-ingredient-list").innerHTML = ingHtml;
          el("r-ingredients").hidden = false;
        }

        // 编号步骤（含配图）
        var steps = Array.isArray(r.steps) ? r.steps : [];
        if (steps.length) {
          var stepHtml = "";
          steps.forEach(function (step, i) {
            var img = "";
            var src = fileUrl(step && step.image);
            if (src) {
              img = '<img src="' + escapeHtml(src) + '" alt="步骤 ' + (i + 1) + '" loading="lazy" />';
            }
            stepHtml += "<li><span class=\"no\">" + (i + 1) + "</span>" +
              '<div class="body"><p>' + escapeHtml(step && step.text || "") + "</p>" + img + "</div></li>";
          });
          el("r-step-list").innerHTML = stepHtml;
          el("r-steps").hidden = false;
        }

        el("status").hidden = true;
        el("recipe").hidden = false;
      }

      var id = parseId();
      if (!id) { showError("无效的菜谱地址"); return; }

      // 模块开关预检查：菜谱模块关闭时不请求详情（失败按开启处理）
      fetch(siteRoot + "/api/v1/public/module-config", { headers: { Accept: "application/json" } })
        .then(function (r) { return r.json(); })
        .then(function (res) {
          if (res && res.code === 0 && res.data && res.data.recipe_enabled === false) {
            showError("美食菜谱模块未开启");
            return null;
          }
          return fetch(siteRoot + "/api/v1/public/recipes/" + encodeURIComponent(id), {
            headers: { Accept: "application/json" }
          }).then(function (r) { return r.json(); });
        })
        .then(function (res) {
          if (!res) return;
          if (res && res.code === 0 && res.data) { render(res.data); }
          else { showError((res && res.msg) || "菜谱不存在或已下架"); }
        })
        .catch(function () { showError("菜谱加载失败，请稍后重试"); });
    })();
  </script>
</body>
</html>
