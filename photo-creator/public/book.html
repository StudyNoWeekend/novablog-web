<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- 动态内容壳页面：静态导出未预生成的书籍详情由此页面客户端取数渲染（主题规范 3.4） -->
  <title>书籍加载中 | Photo Creator</title>
  <script src="/theme-config.js"></script>
  <style>
    :root {
      --bg: #fdfdfc;
      --border: #e8e6e1;
      --text: #1c1b1a;
      --muted: #8a8781;
      --accent: #a67c2e;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: ui-sans-serif, system-ui, "PingFang SC", "Microsoft YaHei", sans-serif;
      line-height: 1.8;
    }
    .shell-header {
      padding: 20px 32px;
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      letter-spacing: 0.12em;
      font-size: 13px;
      text-transform: uppercase;
    }
    .brand { color: var(--text); font-weight: 600; }
    .shell-header a { color: var(--muted); text-decoration: none; }
    .shell-header a:hover { color: var(--text); }
    main { max-width: 720px; margin: 0 auto; padding: 48px 24px 96px; }
    .status {
      color: var(--muted);
      padding: 64px 0;
      text-align: center;
      letter-spacing: 0.05em;
    }
    .status.error a { color: var(--text); }
    .book-header { display: flex; gap: 28px; flex-wrap: wrap; margin-bottom: 40px; }
    .cover { width: 168px; border-radius: 10px; flex-shrink: 0; }
    .info { flex: 1; min-width: 240px; }
    article h1 {
      font-size: 28px;
      line-height: 1.35;
      margin: 0 0 8px;
      letter-spacing: -0.01em;
      font-weight: 600;
    }
    .badge {
      display: inline-block;
      font-size: 12px;
      padding: 2px 12px;
      border-radius: 999px;
      border: 1px solid var(--accent);
      color: var(--accent);
      margin-bottom: 10px;
    }
    .author { color: var(--muted); margin-bottom: 8px; }
    .stars { color: var(--accent); font-size: 15px; letter-spacing: 2px; }
    .stars .off { color: var(--border); }
    .dates { color: var(--muted); font-size: 13px; margin-top: 10px; }
    .section-title { font-size: 18px; font-weight: 600; margin: 32px 0 16px; }
    .content { font-size: 16px; }
    .content h2, .content h3, .content h4 { margin: 40px 0 14px; font-weight: 600; }
    .content h2 { font-size: 22px; }
    .content h3 { font-size: 19px; }
    .content p { margin: 16px 0; }
    .content a { color: var(--text); text-decoration: underline; text-underline-offset: 3px; }
    .content code {
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 0.88em;
      background: #f1efeb;
      padding: 2px 6px;
      border-radius: 4px;
    }
    .content pre {
      background: #1c1b1a;
      color: #f5f4f2;
      padding: 16px;
      overflow-x: auto;
      margin: 24px 0;
    }
    .content pre code { background: none; color: inherit; padding: 0; }
    .content blockquote {
      border-left: 2px solid var(--text);
      padding: 8px 20px;
      margin: 22px 0;
      color: var(--muted);
    }
    .content ul, .content ol { margin: 16px 0 16px 24px; }
    .content li { margin: 8px 0; }
    .content img { max-width: 100%; }
    .content hr { border: none; border-top: 1px solid var(--border); margin: 44px 0; }
  </style>
</head>
<body>
  <header class="shell-header">
    <span class="brand">Photo Creator</span>
    <a href="/">← Back</a>
  </header>
  <main>
    <div id="status" class="status">Loading…</div>
    <article id="book" hidden>
      <div class="book-header">
        <img id="b-cover" class="cover" alt="" hidden />
        <div class="info">
          <span class="badge" id="b-status" hidden></span>
          <h1 id="b-title"></h1>
          <p class="author" id="b-author" hidden></p>
          <div class="stars" id="b-stars" hidden></div>
          <p class="dates" id="b-dates" hidden></p>
        </div>
      </div>
      <h2 class="section-title">书评</h2>
      <div class="content" id="b-review"></div>
    </article>
  </main>

  <script>
    (function () {
      "use strict";

      // API 地址解析：theme-config.js 注入（可携带 /api/v1 前缀）> 同域相对路径
      var injected = window.__NOVA_CONFIG__ && window.__NOVA_CONFIG__.apiBase;
      var siteRoot = injected
        ? injected.replace(/\/api\/v1\/?$/, "").replace(/\/$/, "")
        : "";

      // 从 URL 解析 id：/books/{id} | /books/{id}.html | /books/{id}/
      function parseId() {
        var m = location.pathname.match(/\/books\/([^/]+?)\.?html?\/?$/i) ||
                location.pathname.match(/\/books\/([^/]+?)\/?$/i);
        if (!m) return "";
        try {
          return decodeURIComponent(m[1]);
        } catch (e) {
          // 非法百分号编码（如 /books/%zz）：按无效地址处理，避免页面卡在加载态
          return "";
        }
      }

      function el(id) { return document.getElementById(id); }

      function escapeHtml(s) {
        return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;")
          .replace(/>/g, "&gt;").replace(/"/g, "&quot;");
      }

      // URL 仅放行 http(s)、站点相对路径与页内锚点
      function safeUrl(u) {
        u = String(u || "").trim();
        if (/^(https?:\/\/|\/|#)/i.test(u)) return u;
        return "#";
      }

      // 轻量 Markdown 渲染（先整体转义防 XSS，再按行解析常用块级/行内语法）
      function renderMarkdown(src) {
        var lines = escapeHtml(src).split(/\r?\n/);
        var out = [], i = 0, inCode = false, codeBuf = [], listType = null;

        function closeList() {
          if (listType) { out.push("</" + listType + ">"); listType = null; }
        }
        function inline(s) {
          s = s.replace(/`([^`]+)`/g, "<code>$1</code>");
          s = s.replace(/!\[([^\]]*)\]\(([^)\s]+)\)/g, function (_, alt, src) {
            return '<img src="' + safeUrl(src) + '" alt="' + alt + '" />';
          });
          s = s.replace(/\[([^\]]+)\]\(([^)\s]+)\)/g, function (_, text, href) {
            return '<a href="' + safeUrl(href) + '" target="_blank" rel="noopener">' + text + "</a>";
          });
          s = s.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
          s = s.replace(/\*([^*]+)\*/g, "<em>$1</em>");
          return s;
        }

        while (i < lines.length) {
          var line = lines[i];
          if (/^```/.test(line)) {
            if (inCode) {
              out.push("<pre><code>" + codeBuf.join("\n") + "</code></pre>");
              codeBuf = []; inCode = false;
            } else { closeList(); inCode = true; }
            i++; continue;
          }
          if (inCode) { codeBuf.push(line); i++; continue; }

          var h = line.match(/^(#{1,4})\s+(.*)$/);
          if (h) {
            closeList();
            var lv = h[1].length;
            out.push("<h" + lv + ">" + inline(h[2]) + "</h" + lv + ">");
            i++; continue;
          }
          if (/^\s*(---+|\*\*\*+)\s*$/.test(line)) { closeList(); out.push("<hr/>"); i++; continue; }
          if (/^\s*&gt;\s?/.test(line)) {
            closeList();
            var quote = [];
            while (i < lines.length && /^\s*&gt;\s?/.test(lines[i])) {
              quote.push(lines[i].replace(/^\s*&gt;\s?/, "")); i++;
            }
            out.push("<blockquote><p>" + inline(quote.join(" ")) + "</p></blockquote>");
            continue;
          }
          if (/^\s*[-*+]\s+/.test(line)) {
            if (listType !== "ul") { closeList(); out.push("<ul>"); listType = "ul"; }
            out.push("<li>" + inline(line.replace(/^\s*[-*+]\s+/, "")) + "</li>");
            i++; continue;
          }
          if (/^\s*\d+\.\s+/.test(line)) {
            if (listType !== "ol") { closeList(); out.push("<ol>"); listType = "ol"; }
            out.push("<li>" + inline(line.replace(/^\s*\d+\.\s+/, "")) + "</li>");
            i++; continue;
          }
          if (/^\s*$/.test(line)) { closeList(); i++; continue; }

          var para = [];
          while (i < lines.length && !/^\s*$/.test(lines[i]) &&
                 !/^(#{1,4})\s|^```|^\s*[-*+]\s|^\s*\d+\.\s|^\s*&gt;/.test(lines[i])) {
            para.push(lines[i]); i++;
          }
          if (para.length) { closeList(); out.push("<p>" + inline(para.join("<br/>")) + "</p>"); }
          else { i++; }
        }
        closeList();
        if (inCode && codeBuf.length) out.push("<pre><code>" + codeBuf.join("\n") + "</code></pre>");
        return out.join("\n");
      }

      // 阅读状态映射：want=想读 reading=在读 done=读完
      var READING_STATUS = { want: "想读", reading: "在读", done: "读完" };

      function showError(msg) {
        var s = el("status");
        s.className = "status error";
        s.innerHTML = msg + ' · <a href="/">返回首页</a>';
      }

      function render(b) {
        document.title = (b.title || "书籍") + " | Photo Creator";

        if (b.cover) {
          var c = el("b-cover");
          c.src = safeUrl(b.cover);
          c.hidden = false;
        }
        if (READING_STATUS[b.reading_status]) {
          var badge = el("b-status");
          badge.textContent = READING_STATUS[b.reading_status];
          badge.hidden = false;
        }
        el("b-title").textContent = b.title || "无标题";

        if (b.author) {
          el("b-author").textContent = b.author;
          el("b-author").hidden = false;
        }

        // 星级 0-5（实星 / 空星）
        var rating = Math.max(0, Math.min(5, Number(b.rating) || 0));
        if (rating > 0) {
          var starsHtml = "";
          for (var i = 1; i <= 5; i++) {
            starsHtml += i <= Math.round(rating) ? "★" : '<span class="off">★</span>';
          }
          el("b-stars").innerHTML = starsHtml;
          el("b-stars").hidden = false;
        }

        // 起止阅读时间
        var dates = [];
        if (b.started_at) dates.push("开始 " + escapeHtml(String(b.started_at).slice(0, 10)));
        if (b.finished_at) dates.push("读完 " + escapeHtml(String(b.finished_at).slice(0, 10)));
        if (dates.length) {
          el("b-dates").innerHTML = dates.join(" · ");
          el("b-dates").hidden = false;
        }

        el("b-review").innerHTML = renderMarkdown(b.review || "_暂无书评_");
        el("status").hidden = true;
        el("book").hidden = false;
      }

      var id = parseId();
      if (!id) { showError("无效的书籍地址"); return; }

      // 模块开关预检查：书架模块关闭时不请求详情（失败按开启处理）
      fetch(siteRoot + "/api/v1/public/module-config", { headers: { Accept: "application/json" } })
        .then(function (r) { return r.json(); })
        .then(function (res) {
          if (res && res.code === 0 && res.data && res.data.book_enabled === false) {
            showError("读书书架模块未开启");
            return null;
          }
          return fetch(siteRoot + "/api/v1/public/books/" + encodeURIComponent(id), {
            headers: { Accept: "application/json" }
          }).then(function (r) { return r.json(); });
        })
        .then(function (res) {
          if (!res) return;
          if (res && res.code === 0 && res.data) { render(res.data); }
          else { showError((res && res.msg) || "书籍不存在或已下架"); }
        })
        .catch(function () { showError("书籍加载失败，请稍后重试"); });
    })();
  </script>
</body>
</html>
