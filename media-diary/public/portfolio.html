<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- 动态内容壳页面：静态导出未预生成的作品集详情由此页面客户端取数渲染（主题规范 3.4） -->
  <title>多媒体日记加载中</title>
  <script src="/theme-config.js"></script>
  <style>
    :root {
      --bg: #faf7f0;
      --panel: #ffffff;
      --panel-soft: #f3edde;
      --border: #eee6d4;
      --border-strong: #e0d5bc;
      --text: #262117;
      --text-soft: #57503f;
      --muted: #8c8370;
      --accent: #f2b824;
      --accent-deep: #d99e0b;
      --accent-subtle: rgba(242, 184, 36, 0.16);
      --ink: #161310;
      --danger: #ec6a8a;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    [hidden] { display: none !important; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: ui-sans-serif, system-ui, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      line-height: 1.85;
    }
    .display { letter-spacing: 0.02em; }
    .shell-header {
      background: var(--ink);
      padding: 14px 28px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 14px;
    }
    .brand { display: flex; align-items: center; gap: 10px; color: #fff; font-weight: 600; }
    .brand-logo {
      display: inline-flex; align-items: center; justify-content: center;
      width: 30px; height: 30px; border-radius: 9px;
      background: var(--accent); color: var(--ink);
    }
    .shell-header a { color: rgba(255,255,255,0.7); text-decoration: none; }
    .shell-header a:hover { color: var(--accent); }
    main { max-width: 1080px; margin: 0 auto; padding: 32px 24px 96px; }
    .status {
      color: var(--muted);
      padding: 64px 0;
      text-align: center;
    }
    .status.error { color: var(--danger); }
    .status.error a { color: var(--accent-deep); }
    .back { display: inline-block; color: var(--muted); text-decoration: none; font-size: 14px; margin-bottom: 20px; }
    .back:hover { color: var(--accent-deep); }
    .hero { position: relative; border-radius: 14px; overflow: hidden; margin-bottom: 32px; background: var(--panel-soft); }
    .hero img { width: 100%; aspect-ratio: 21/9; object-fit: cover; display: block; }
    .hero .ph { width: 100%; aspect-ratio: 21/9; }
    .cat-badge {
      display: inline-block;
      background: var(--accent);
      color: var(--ink);
      font-size: 12px;
      font-weight: 600;
      border-radius: 999px;
      padding: 3px 12px;
      margin-bottom: 14px;
    }
    h1 { font-size: 30px; line-height: 1.35; }
    .desc { color: var(--muted); margin-top: 12px; max-width: 760px; }
    h2.section { font-size: 24px; margin: 44px 0 18px; padding-top: 32px; border-top: 1px dashed var(--border-strong); }
    h2.section .count { font-size: 14px; font-weight: 400; color: var(--muted); margin-left: 10px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 20px; }
    .item { background: var(--panel); border: 1px solid var(--border); border-radius: 14px; overflow: hidden; }
    .item .cover { position: relative; aspect-ratio: 1/1; background: var(--panel-soft); }
    .item .cover img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .item .cap { padding: 12px 14px; }
    .item .cap .t { font-size: 14px; font-weight: 600; color: var(--text); }
    .item .cap .d { font-size: 12px; color: var(--muted); margin-top: 4px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .empty {
      border: 1px dashed var(--border-strong); border-radius: 14px;
      padding: 56px 0; text-align: center; color: var(--muted); font-size: 14px;
    }
  </style>
</head>
<body>
  <header class="shell-header">
    <span class="brand display" id="brand-title">
      <span class="brand-logo" aria-hidden="true">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5.14v13.72c0 .96 1.05 1.55 1.87 1.05l10.7-6.86a1.25 1.25 0 0 0 0-2.1L9.87 4.09C9.05 3.59 8 4.18 8 5.14z"/></svg>
      </span>
      <span id="brand-name">多媒体日记</span>
    </span>
    <a href="/portfolio">← 返回作品集</a>
  </header>
  <main>
    <div id="status" class="status">正在加载作品集…</div>
    <article id="portfolio" hidden>
      <a class="back" href="/portfolio">← 返回作品集</a>
      <div class="hero">
        <img id="p-cover" alt="" hidden />
        <div id="p-cover-ph" class="ph"></div>
      </div>
      <span id="p-category" class="cat-badge" hidden></span>
      <h1 id="p-name" class="display"></h1>
      <p id="p-desc" class="desc" hidden></p>
      <section id="sec-items" hidden>
        <h2 class="section display">作品一览<span class="count" id="p-count"></span></h2>
        <div id="p-grid" class="grid"></div>
      </section>
      <div id="p-empty" class="empty" hidden>该作品集暂无作品</div>
    </article>
  </main>

  <script>
    (function () {
      "use strict";

      // API 地址解析：theme-config.js 注入（可携带 /api/v1 前缀）> 同域相对路径
      var injected = window.__NOVA_CONFIG__ && window.__NOVA_CONFIG__.apiBase;
      var siteRoot = injected
        ? injected.replace(/\/api\/v1\/?$/, "").replace(/\/$/, "")
        : "";
      var apiBase = siteRoot + "/api/v1";

      // 获取博主资料并更新品牌文字
      var blogTitle = "";
      fetch(apiBase + "/public/blogger", { headers: { Accept: "application/json" } })
        .then(function (r) { return r.json(); })
        .then(function (res) {
          if (res && res.code === 0 && res.data) {
            blogTitle = res.data.blog_title || "";
            var brand = document.getElementById("brand-name");
            if (brand && blogTitle) brand.textContent = blogTitle;
          }
        })
        .catch(function () { /* 静默失败 */ });

      // 从 URL 解析 id：/portfolio/{id} | /portfolio/{id}.html | /portfolio/{id}/
      function parseId() {
        var m = location.pathname.match(/\/portfolio\/([^/]+?)\.?html?\/?$/i) ||
                location.pathname.match(/\/portfolio\/([^/]+?)\/?$/i);
        if (!m) return "";
        try {
          return decodeURIComponent(m[1]);
        } catch (e) {
          // 非法百分号编码：按无效地址处理，避免页面卡在加载态
          return "";
        }
      }

      function el(id) { return document.getElementById(id); }

      function escapeHtml(s) {
        return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;")
          .replace(/>/g, "&gt;").replace(/"/g, "&quot;");
      }

      // 链接/图片 URL 仅放行 http(s)://、//、/、#
      function safeUrl(u) {
        u = String(u || "").trim();
        if (/^(https?:\/\/|\/\/|\/|#)/i.test(u)) return u;
        return "#";
      }

      function showError(msg) {
        var s = el("status");
        s.className = "status error";
        s.innerHTML = msg + ' · <a href="/portfolio">返回作品集</a>';
      }

      function render(p) {
        var title = p.name || "作品集";
        document.title = blogTitle ? title + " | " + blogTitle : title;
        el("p-name").textContent = title;

        if (p.cover_url) {
          var c = el("p-cover");
          c.src = safeUrl(p.cover_url);
          c.hidden = false;
          el("p-cover-ph").style.display = "none";
        }

        if (p.category_name) {
          el("p-category").textContent = escapeHtml(p.category_name);
          el("p-category").hidden = false;
        }

        if (p.description && String(p.description).trim()) {
          el("p-desc").textContent = p.description;
          el("p-desc").hidden = false;
        }

        var items = Array.isArray(p.items) ? p.items : [];
        if (items.length > 0) {
          el("p-count").textContent = items.length + " 个作品";
          el("p-grid").innerHTML = items.map(function (item, i) {
            var t = item.title || "作品 " + (i + 1);
            var img = item.output_url
              ? '<img src="' + safeUrl(item.output_url) + '" alt="' + escapeHtml(t) + '" loading="lazy" />'
              : "";
            var d = item.description
              ? '<p class="d">' + escapeHtml(item.description) + "</p>"
              : "";
            return '<figure class="item"><div class="cover">' + img +
              '</div><figcaption class="cap"><p class="t">' + escapeHtml(t) + "</p>" + d +
              "</figcaption></figure>";
          }).join("");
          el("sec-items").hidden = false;
        } else {
          el("p-empty").hidden = false;
        }

        el("status").hidden = true;
        el("portfolio").hidden = false;
      }

      var id = parseId();
      if (!id) { showError("无效的作品集地址"); return; }

      fetch(apiBase + "/public/portfolios/" + encodeURIComponent(id), {
        headers: { Accept: "application/json" }
      })
        .then(function (r) { return r.json(); })
        .then(function (res) {
          if (res && res.code === 0 && res.data) { render(res.data); }
          else { showError((res && res.msg) || "作品集不存在或已下架"); }
        })
        .catch(function () { showError("作品集加载失败，请稍后重试"); });
    })();
  </script>
</body>
</html>
