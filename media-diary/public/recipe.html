<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- 动态内容壳页面：静态导出未预生成的菜谱详情由此页面客户端取数渲染（主题规范 3.4） -->
  <title>菜谱加载中</title>
  <script src="/theme-config.js"></script>
  <style>
    :root {
      --bg: #faf7f0;
      --panel: #ffffff;
      --panel-soft: #f3edde;
      --border: #eee6d4;
      --border-strong: #e0d5bc;
      --text: #262117;
      --text-soft: #57503f;
      --muted: #8c8370;
      --subtle: #b3a992;
      --accent: #f2b824;
      --accent-deep: #d99e0b;
      --accent-subtle: rgba(242, 184, 36, 0.16);
      --ink: #161310;
      --danger: #ec6a8a;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    [hidden] { display: none !important; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: ui-sans-serif, system-ui, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      line-height: 1.85;
    }
    .display { letter-spacing: 0.02em; }
    .shell-header {
      background: var(--ink);
      padding: 14px 28px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 14px;
    }
    .brand { display: flex; align-items: center; gap: 10px; color: #fff; font-weight: 600; }
    .brand-logo {
      display: inline-flex; align-items: center; justify-content: center;
      width: 30px; height: 30px; border-radius: 9px;
      background: var(--accent); color: var(--ink);
    }
    .shell-header a { color: rgba(255,255,255,0.7); text-decoration: none; }
    .shell-header a:hover { color: var(--accent); }
    main { max-width: 760px; margin: 0 auto; padding: 44px 24px 96px; }
    .status { color: var(--muted); padding: 64px 0; text-align: center; }
    .status.error { color: var(--danger); }
    .status.error a { color: var(--accent-deep); }
    .cover { width: 100%; border-radius: 14px; margin-bottom: 28px; }
    .cat-badge {
      display: inline-block;
      background: var(--accent);
      color: var(--ink);
      font-size: 12px;
      font-weight: 600;
      border-radius: 999px;
      padding: 3px 12px;
      margin-bottom: 14px;
    }
    article h1 { font-size: 30px; line-height: 1.35; }
    .meta {
      font-size: 13px;
      color: var(--muted);
      margin-top: 14px;
      display: flex;
      flex-wrap: wrap;
      gap: 16px;
    }
    .tags { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 16px; }
    .tag {
      border: 1px solid rgba(242, 184, 36, 0.35);
      background: var(--accent-subtle);
      color: var(--accent-deep);
      border-radius: 999px;
      padding: 3px 12px;
      font-size: 12px;
    }
    blockquote.summary {
      border-left: 3px solid var(--accent);
      background: var(--panel-soft);
      border-radius: 0 10px 10px 0;
      padding: 10px 18px;
      margin: 24px 0 0;
      color: var(--muted);
      font-style: italic;
    }
    h2.section { font-size: 24px; margin: 44px 0 18px; }
    .ingredients { list-style: none; display: grid; grid-template-columns: 1fr; gap: 10px; }
    @media (min-width: 640px) { .ingredients { grid-template-columns: 1fr 1fr; } }
    .ingredients li {
      display: flex; align-items: baseline; justify-content: space-between; gap: 12px;
      background: var(--panel); border: 1px solid var(--border);
      border-radius: 10px; padding: 10px 16px; font-size: 14px;
    }
    .ingredients li em { color: var(--muted); font-style: normal; flex-shrink: 0; }
    .steps { list-style: none; }
    .steps li { display: flex; gap: 16px; margin-bottom: 28px; }
    .step-no {
      flex-shrink: 0;
      display: inline-flex; align-items: center; justify-content: center;
      width: 32px; height: 32px; border-radius: 999px;
      background: var(--accent-subtle); color: var(--accent-deep);
      font-size: 14px; font-weight: 600;
    }
    .step-body { flex: 1; min-width: 0; }
    .step-body p { white-space: pre-wrap; color: var(--text-soft); font-size: 16px; }
    .step-body img { display: block; width: 100%; border-radius: 14px; margin-top: 16px; }
  </style>
</head>
<body>
  <header class="shell-header">
    <span class="brand display" id="brand-text">
      <span class="brand-logo" aria-hidden="true">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5.14v13.72c0 .96 1.05 1.55 1.87 1.05l10.7-6.86a1.25 1.25 0 0 0 0-2.1L9.87 4.09C9.05 3.59 8 4.18 8 5.14z"/></svg>
      </span>
      <span id="brand-title">多媒体日记</span>
    </span>
    <a href="/recipes">← 菜谱列表</a>
  </header>
  <main>
    <div id="status" class="status">正在加载菜谱…</div>
    <article id="recipe" hidden>
      <img id="r-cover" class="cover" alt="" hidden />
      <span id="r-difficulty" class="cat-badge" hidden></span>
      <h1 id="r-title" class="display"></h1>
      <div id="r-meta" class="meta"></div>
      <div id="r-tags" class="tags" hidden></div>
      <blockquote id="r-summary" class="summary" hidden></blockquote>
      <section id="sec-ingredients" hidden>
        <h2 class="section display">食材清单</h2>
        <ul id="r-ingredients" class="ingredients"></ul>
      </section>
      <section id="sec-steps" hidden>
        <h2 class="section display">制作步骤</h2>
        <ol id="r-steps" class="steps"></ol>
      </section>
    </article>
  </main>

  <script>
    (function () {
      "use strict";

      // API 地址解析：theme-config.js 注入（可携带 /api/v1 前缀）> 同域相对路径
      var injected = window.__NOVA_CONFIG__ && window.__NOVA_CONFIG__.apiBase;
      var siteRoot = injected
        ? injected.replace(/\/api\/v1\/?$/, "").replace(/\/$/, "")
        : "";
      var apiBase = siteRoot + "/api/v1";

      // 获取博主资料并更新品牌文字
      var blogTitle = "";
      fetch(apiBase + "/public/blogger", { headers: { Accept: "application/json" } })
        .then(function (r) { return r.json(); })
        .then(function (res) {
          if (res && res.code === 0 && res.data) {
            blogTitle = res.data.blog_title || "";
            var brand = document.getElementById("brand-title");
            if (brand && blogTitle) brand.textContent = blogTitle;
          }
        })
        .catch(function () { /* 静默失败 */ });

      // 从 URL 解析 id：/recipes/{id} | /recipes/{id}.html | /recipes/{id}/
      function parseId() {
        var m = location.pathname.match(/\/recipes\/([^/]+?)\.?html?\/?$/i) ||
                location.pathname.match(/\/recipes\/([^/]+?)\/?$/i);
        if (!m) return "";
        try {
          return decodeURIComponent(m[1]);
        } catch (e) {
          // 非法百分号编码：按无效地址处理，避免页面卡在加载态
          return "";
        }
      }

      function el(id) { return document.getElementById(id); }

      function escapeHtml(s) {
        return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;")
          .replace(/>/g, "&gt;").replace(/"/g, "&quot;");
      }

      // 链接/图片 URL 仅放行 http(s)://、//、/、#
      function safeUrl(u) {
        u = String(u || "").trim();
        if (/^(https?:\/\/|\/\/|\/|#)/i.test(u)) return u;
        return "#";
      }

      // 后端相对路径文件地址 → API 站点根 + /files/ 前缀（完整 URL 原样返回）
      function fileUrl(path) {
        var raw = String(path || "").trim();
        if (!raw) return "";
        if (/^(https?:\/\/|\/\/|\/|#)/i.test(raw)) return raw;
        return siteRoot + "/files/" + raw.replace(/^\/+/, "");
      }

      function formatDate(dateStr) {
        if (!dateStr) return "";
        var d = new Date(dateStr);
        if (isNaN(d.getTime())) return "";
        return d.getFullYear() + " 年 " + (d.getMonth() + 1) + " 月 " + d.getDate() + " 日";
      }

      var DIFFICULTY_LABELS = { 1: "简单", 2: "中等", 3: "困难" };

      function showError(msg) {
        var s = el("status");
        s.className = "status error";
        s.innerHTML = msg + ' · <a href="/recipes">返回菜谱列表</a>';
      }

      function render(r) {
        var title = r.title || "菜谱";
        document.title = blogTitle ? title + " | " + blogTitle : title;
        el("r-title").textContent = title;

        var cover = el("r-cover");
        if (r.cover && safeUrl(fileUrl(r.cover)) !== "#") {
          cover.src = safeUrl(fileUrl(r.cover));
          cover.hidden = false;
        }

        var difficulty = DIFFICULTY_LABELS[r.difficulty];
        if (difficulty) {
          el("r-difficulty").textContent = difficulty;
          el("r-difficulty").hidden = false;
        }

        var meta = [];
        if (r.minutes > 0) meta.push(escapeHtml(r.minutes) + " 分钟");
        if (r.servings > 0) meta.push(escapeHtml(r.servings) + " 人份");
        var dateStr = formatDate(r.updated_at || r.created_at);
        if (dateStr) meta.push(escapeHtml(dateStr));
        if (meta.length) el("r-meta").innerHTML = meta.join(" ");

        var tags = String(r.tags || "").split(",").map(function (t) { return t.trim(); }).filter(Boolean);
        if (tags.length) {
          el("r-tags").innerHTML = tags.map(function (t) {
            return '<span class="tag"># ' + escapeHtml(t) + "</span>";
          }).join("");
          el("r-tags").hidden = false;
        }

        if (r.summary) {
          el("r-summary").textContent = r.summary;
          el("r-summary").hidden = false;
        }

        var ingredients = Array.isArray(r.ingredients) ? r.ingredients : [];
        if (ingredients.length) {
          el("r-ingredients").innerHTML = ingredients.map(function (item) {
            var amount = item && item.amount
              ? "<em>" + escapeHtml(item.amount) + "</em>"
              : "";
            return "<li><span>" + escapeHtml((item && item.name) || "") + "</span>" + amount + "</li>";
          }).join("");
          el("sec-ingredients").hidden = false;
        }

        var steps = Array.isArray(r.steps) ? r.steps : [];
        if (steps.length) {
          el("r-steps").innerHTML = steps.map(function (step, i) {
            var img = "";
            var src = step && step.image ? safeUrl(fileUrl(step.image)) : "";
            if (step && step.image && src !== "#") {
              img = '<img src="' + src + '" alt="步骤 ' + (i + 1) + '" loading="lazy" />';
            }
            return '<li><span class="step-no">' + (i + 1) + '</span>' +
              '<div class="step-body"><p>' + escapeHtml((step && step.text) || "") + "</p>" + img + "</div></li>";
          }).join("");
          el("sec-steps").hidden = false;
        }

        el("status").hidden = true;
        el("recipe").hidden = false;
      }

      var id = parseId();
      if (!id) { showError("无效的菜谱地址"); return; }

      fetch(apiBase + "/public/recipes/" + encodeURIComponent(id), {
        headers: { Accept: "application/json" }
      })
        .then(function (r) { return r.json(); })
        .then(function (res) {
          if (res && res.code === 0 && res.data) { render(res.data); }
          else { showError((res && res.msg) || "菜谱不存在或已下架"); }
        })
        .catch(function () { showError("菜谱加载失败，请稍后重试"); });
    })();
  </script>
</body>
</html>
